<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23204A;
    --ink-soft:#5B5680;
    --sky:#4FA8F7;
    --grape:#8B5CF6;
    --mango:#FFB020;
    --melon:#22C55E;
    --berry:#FF5C8A;
    --paper:#FFFFFF;
    --line:#E4E0F5;
    --shadow:0 6px 0 rgba(35,32,74,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #DCEEFF 0%, rgba(220,238,255,0) 60%),
      radial-gradient(900px 600px at 110% 0%, #F3E4FF 0%, rgba(243,228,255,0) 55%),
      linear-gradient(180deg,#F4F9FF 0%, #FBF5FF 100%);
    background-attachment:fixed;
    overscroll-behavior:none;
  }
  .en{font-family:'Fredoka', sans-serif;font-weight:600;letter-spacing:.02em}
  #app{max-width:520px;margin:0 auto;padding:14px 14px 40px;min-height:100%}

  /* ---------- 공통 부품 ---------- */
  .btn{
    border:none;border-radius:18px;padding:14px 18px;font-family:inherit;font-size:18px;
    background:var(--paper);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .btn:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
  .btn.primary{background:var(--grape);color:#fff;box-shadow:0 6px 0 #6D3FD6}
  .btn.primary:active{box-shadow:0 2px 0 #6D3FD6}
  .btn.go{background:var(--melon);color:#fff;box-shadow:0 6px 0 #16A34A}
  .btn.go:active{box-shadow:0 2px 0 #16A34A}
  .btn.wide{display:block;width:100%}
  .btn[disabled]{opacity:.45;pointer-events:none}

  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .iconbtn{
    width:44px;height:44px;border-radius:14px;border:none;background:var(--paper);
    box-shadow:var(--shadow);font-size:20px;cursor:pointer;flex:none;
  }
  .iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .topbar h2{margin:0;font-size:19px;flex:1;text-align:center}
  .pill{background:#fff;border-radius:999px;padding:6px 12px;font-size:15px;box-shadow:var(--shadow)}

  .card{background:var(--paper);border-radius:24px;padding:18px;box-shadow:var(--shadow)}

  /* ---------- 인트로 ---------- */
  .intro{text-align:center;padding-top:8vh}
  .intro .logo{font-size:64px;animation:bob 2.4s ease-in-out infinite}
  .intro .hsvg.logo{margin:0 auto 4px}
  .intro h1{font-size:34px;margin:8px 0 4px;letter-spacing:-.5px}
  .intro p{color:var(--ink-soft);font-size:16px;margin:0 0 26px}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}

  /* ---------- 홈: 레벨 목록 ---------- */
  .hero{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#8B5CF6,#4FA8F7);
    color:#fff;border-radius:24px;padding:14px;box-shadow:0 6px 0 #5B34C0;margin-bottom:12px}
  .hero .face{font-size:44px}
  .hero b{display:block;font-size:20px}
  .hero small{opacity:.9;font-size:14px}
  .hsvg{width:104px;height:137px;flex:none;display:block}
  .hsvg.lg{width:180px;height:237px;margin:0 auto}
  .hinfo{flex:1;min-width:0}
  .hinfo .nm{font-size:22px;line-height:1.2}
  .hinfo .ti{font-size:15px;opacity:.95;margin-bottom:8px}
  .hbar{height:10px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden;margin-bottom:4px}
  .hbar i{display:block;height:100%;background:var(--mango);border-radius:999px;transition:width .5s}
  .hinfo .cnt{font-size:13px;opacity:.9}

  .rw{margin-bottom:14px}
  .rw h3{margin:0 0 3px;font-size:17px}
  .rw .sub{color:var(--ink-soft);font-size:13px;margin-bottom:10px}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rchip{display:flex;align-items:center;gap:7px;background:#F7F5FF;border:2px solid var(--line);
    border-radius:14px;padding:8px 9px;font-size:13px;line-height:1.25;text-align:left;
    font-family:inherit;cursor:default;color:var(--ink-soft);width:100%}
  .rchip .ri{font-size:19px;flex:none;filter:grayscale(1);opacity:.5}
  .rchip .rn{flex:1;min-width:0}
  .rchip.won{background:#FFF8E6;border-color:var(--mango);color:var(--ink);cursor:pointer}
  .rchip.won .ri{filter:none;opacity:1}
  .rchip.won .rn:after{content:' 획득!';color:var(--mango)}
  .rchip.given{background:#F0FDF4;border-color:var(--melon)}
  .rchip.given .rn:after{content:' 받음 ✅';color:var(--melon)}
  .rule{display:flex;align-items:stretch;gap:5px;margin:0 0 12px}
  .rule .rs{flex:1;background:#F3ECFF;border:2px solid #E4D9FF;border-radius:14px;padding:8px 4px;text-align:center}
  .rule .rs b{display:block;font-size:22px;line-height:1.2}
  .rule .rs span{font-size:12px;line-height:1.3;color:var(--ink)}
  .rule .rs.hit{background:#FFF6DF;border-color:var(--mango)}
  .rule .ra{align-self:center;color:var(--grape);font-size:17px;flex:none}

  .rchip.final{grid-column:1/-1;position:relative;overflow:hidden;padding:12px 11px;
    background:linear-gradient(135deg,#312E81,#6D28D9 55%,#312E81);
    border:3px solid #FBBF24;color:#FDE68A;box-shadow:0 4px 0 #4C1D95;cursor:default}
  .rchip.final .ri{filter:none;opacity:1;font-size:28px}
  .rchip.final .rn{font-size:15px;color:#FDE68A}
  .rchip.final .rn b{display:block;font-size:17px;color:#fff;letter-spacing:.3px}
  .rchip.final:after{content:'';position:absolute;top:0;left:-60%;width:38%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-18deg);animation:sweep 3s ease-in-out infinite}
  @keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
  .rchip.final.won{background:linear-gradient(135deg,#B45309,#FDE047 50%,#B45309);
    border-color:#FFF7CD;color:#4A2500;box-shadow:0 4px 0 #92400E;cursor:pointer;
    animation:goldpulse 1.7s ease-in-out infinite}
  .rchip.final.won .rn{color:#4A2500}
  .rchip.final.won .rn b{color:#3B1D00}
  @keyframes goldpulse{0%,100%{box-shadow:0 4px 0 #92400E, 0 0 0 0 rgba(251,191,36,.65)}
    50%{box-shadow:0 4px 0 #92400E, 0 0 0 10px rgba(251,191,36,0)}}

  .testbtn{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:20px;padding:16px;
    margin:14px 0 4px;font-family:inherit;text-align:left;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#FF8A3D,#FF5C8A);box-shadow:0 6px 0 #C2410C}
  .testbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #C2410C}
  .testbtn.lock{background:#E5E1F2;color:var(--ink-soft);box-shadow:0 6px 0 #CFC9E8;cursor:not-allowed}
  .testbtn .ico{font-size:30px;flex:none}
  .testbtn .t{flex:1}
  .testbtn .t b{display:block;font-size:18px}
  .testbtn .t small{font-size:13px;opacity:.92}

  .dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#E0DBF3}
  .dot.o{background:var(--melon)}.dot.x{background:var(--berry)}

  .ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(35,32,74,.62);display:flex;align-items:center;
    justify-content:center;padding:18px;z-index:60;overflow:auto}
  .mod{background:#fff;border-radius:28px;padding:22px 20px;max-width:400px;width:100%;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.18);animation:popin .32s cubic-bezier(.2,1.4,.4,1)}
  @keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .mod h2{margin:6px 0 2px;font-size:26px}
  .mod p{color:var(--ink-soft);margin:4px 0 16px;font-size:16px}
  .reel{font-size:22px;background:#F7F5FF;border:3px dashed var(--line);border-radius:18px;
    padding:22px 10px;margin:12px 0;min-height:84px;display:flex;align-items:center;justify-content:center;gap:8px}
  .reel.hit{border-style:solid;border-color:var(--mango);background:#FFF8E6;animation:pop .45s}
  .reel .e{font-size:34px}
  .lvup{font-size:20px;color:var(--grape)}
  .conf{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:70;overflow:hidden}
  .cf{position:absolute;font-size:22px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
  .lvl{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 14px;
    box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;border:3px solid transparent;text-align:left;width:100%;font-family:inherit}
  .lvl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .lvl .no{width:46px;height:46px;border-radius:14px;background:#F1ECFF;color:var(--grape);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .lvl .t{flex:1;min-width:0}
  .lvl .t b{display:block;font-size:17px}
  .lvl .t small{color:var(--ink-soft);font-size:13px}
  .lvl .stars{font-size:13px;color:var(--mango);white-space:nowrap}
  .lvl.locked{opacity:.5;filter:grayscale(.6)}
  .lvl.done{border-color:#BBF7D0}

  /* ---------- 레벨 상세 ---------- */
  .actbtn{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:none;border-radius:20px;
    padding:14px;box-shadow:var(--shadow);margin-bottom:10px;font-family:inherit;text-align:left;cursor:pointer}
  .actbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .actbtn .ico{font-size:30px;width:46px;text-align:center;flex:none}
  .actbtn .t{flex:1}
  .actbtn .t b{display:block;font-size:17px}
  .actbtn .t small{color:var(--ink-soft);font-size:13px}
  .actbtn .st{color:var(--mango);font-size:14px;white-space:nowrap}

  /* ---------- 게임 공통 ---------- */
  .bar{height:12px;background:#E9E5F8;border-radius:999px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--melon),#86EFAC);border-radius:999px;transition:width .3s}
  .q{text-align:center;color:var(--ink-soft);font-size:16px;margin:2px 0 12px}

  .word{font-size:56px;line-height:1.1;text-align:center;margin:6px 0}
  .word.small{font-size:40px}
  .emoji{font-size:88px;text-align:center;line-height:1.1}
  .ko{text-align:center;color:var(--ink-soft);font-size:17px;margin-top:4px}

  .chunks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
  .chunk{
    border:none;border-radius:16px;padding:12px 18px;font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:30px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);
  }
  .chunk.onset{background:#FFE7B3;color:#8A5A00;box-shadow:0 5px 0 #E8C377}
  .chunk.rime{background:#CFE8FF;color:#0B4C86;box-shadow:0 5px 0 #93C5FD}
  .chunk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .chunk.pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22) translateY(-8px)}100%{transform:scale(1)}}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .opt{
    background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 8px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:32px;cursor:pointer;box-shadow:var(--shadow);
  }
  .opt.pic{font-size:52px;font-family:inherit;padding:14px 8px}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .opt.ok{background:#DCFCE7;border-color:var(--melon)}
  .opt.no{background:#FFE4E6;border-color:var(--berry);animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .shake{animation:shake .3s}

  .slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 10px;min-height:64px}
  .slot{
    width:54px;height:64px;border-radius:14px;border:3px dashed var(--line);background:#FAF8FF;
    display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:30px;cursor:pointer;
  }
  .slot.filled{border-style:solid;border-color:var(--grape);background:#F3ECFF;color:var(--grape)}
  .slot.wide{width:auto;padding:0 12px;min-width:60px;font-size:22px;height:52px}
  .tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
  .tile{
    border:none;border-radius:14px;background:var(--mango);color:#5B3A00;box-shadow:0 5px 0 #D98D00;
    min-width:54px;height:60px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:28px;cursor:pointer;padding:0 10px;
  }
  .tile.word{font-size:20px;height:52px}
  .tile:active{transform:translateY(3px);box-shadow:0 2px 0 #D98D00}
  .tile.used{visibility:hidden}

  .sent{font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;text-align:center;line-height:1.5}
  .sw{display:inline-block;padding:2px 4px;border-radius:8px;cursor:pointer}
  .sw.hi{background:var(--mango);color:#fff}
  .sw.hasnote{background:#FFF3D6;box-shadow:inset 0 0 0 2px var(--mango);
    display:inline-flex;flex-direction:column;align-items:center;vertical-align:top}
  .wnote{display:block;margin-top:2px;font-family:'Noto Sans KR',sans-serif;font-weight:600;
    font-size:12px;line-height:1.25;color:var(--berry);background:#fff;
    border:1.5px solid var(--mango);border-radius:8px;padding:1px 6px;max-width:150px;
    white-space:normal;word-break:break-word;cursor:pointer}
  .readtip{background:#FFF6DF;border:2px dashed var(--mango);border-radius:16px;padding:12px;
    font-size:15px;line-height:1.5;color:#8A5A00;margin-top:14px}
  .mute{display:inline-block;background:#EDEAF8;color:var(--ink-soft);border-radius:999px;
    padding:2px 10px;font-size:13px;margin-bottom:8px}
  .dad{display:inline-flex;align-items:center;gap:5px;background:#E0F2FE;color:#075985;
    border-radius:999px;padding:3px 11px;font-size:13px;margin-bottom:6px}
  .bigword{font-family:'Fredoka',sans-serif;font-weight:700;font-size:60px;line-height:1.1;
    color:var(--grape);margin:16px 0 8px;word-break:break-all}
  .judge{display:flex;gap:10px;margin-top:14px}
  .judge .btn{flex:1;font-size:18px;padding:17px}
  .btn.no{background:#FFE4E6;color:#9F1239;box-shadow:0 6px 0 #FDA4AF}
  .btn.no:active{box-shadow:0 2px 0 #FDA4AF}
  .misschip{display:inline-block;background:#FFE4E6;color:#9F1239;border-radius:10px;
    padding:4px 9px;margin:3px 3px 0 0;font-family:'Fredoka',sans-serif;font-size:15px}
  .misschip b{font-size:11px;opacity:.75;font-family:'Jua',sans-serif}
  .storyline{background:#F7F5FF;border-radius:12px;padding:7px 10px;margin-bottom:6px;
    font-family:'Fredoka',sans-serif;font-size:14px;color:var(--ink-soft);text-align:left}
  .storyline.now{background:#FFF6DF;color:var(--ink);font-weight:600}
  .storyline.done{background:#F0FDF4;color:#166534}
  .poem{font-family:'Fredoka',sans-serif;font-weight:600;font-size:25px;line-height:1.65;text-align:center}
  .poem .pl{display:block}
  .spbtn{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:20px;padding:14px;
    margin-bottom:10px;font-family:inherit;text-align:left;cursor:pointer;background:#fff;box-shadow:var(--shadow);
    border-bottom:6px solid #E9E5F8}
  .spbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .spbtn.done{border-bottom-color:var(--mango)}
  .spbtn .ico{font-size:32px;flex:none}
  .spbtn .t{flex:1}
  .spbtn .t b{display:block;font-family:'Fredoka',sans-serif;font-size:17px}
  .spbtn .t small{color:var(--ink-soft);font-size:13px}
  .stz{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .sz{width:22px;height:6px;border-radius:3px;background:#E0DBF3}
  .sz.on{background:var(--grape)}.sz.ok{background:var(--melon)}
  .pbk{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:18px;padding:13px;
    margin-bottom:9px;font-family:inherit;text-align:left;cursor:pointer;background:#fff;
    box-shadow:var(--shadow);border-left:7px solid #A78BFA}
  .pbk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .pbk.done{border-left-color:var(--mango)}
  .pbk .ico{font-size:28px;flex:none}
  .pbk .t{flex:1;min-width:0}
  .pbk .t b{display:block;font-family:'Fredoka',sans-serif;font-size:15px;line-height:1.25}
  .pbk .t small{color:var(--ink-soft);font-size:12px}
  .pgnum{font-family:'Fredoka',sans-serif;font-weight:700;font-size:78px;color:var(--grape);line-height:1}
  .frm input{width:100%;padding:10px;border:2px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:15px;margin-bottom:8px}
  .sechd{font-size:15px;color:var(--ink-soft);margin:16px 0 8px;padding-left:4px}

  .qzbk{display:flex;align-items:center;gap:11px;width:100%;border:none;border-radius:18px;padding:13px;
    margin-bottom:9px;font-family:inherit;text-align:left;cursor:pointer;background:#fff;
    box-shadow:var(--shadow);border-left:7px solid #38BDF8}
  .qzbk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,32,74,.14)}
  .qzbk.done{border-left-color:var(--mango)}
  .qzbk .ico{font-size:26px;flex:none}
  .qzbk .t{flex:1;min-width:0}
  .qzbk .t b{display:block;font-family:'Fredoka',sans-serif;font-size:15px}
  .qzbk .t small{color:var(--ink-soft);font-size:12px}

  .qrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .qrow .qi{flex:1}
  .qrow .del{flex:none;background:#FFE4E6;color:#9F1239;border:none;border-radius:10px;
    width:38px;height:38px;font-size:17px;cursor:pointer;margin-top:1px}
  .qnum{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--ink-soft);
    width:22px;text-align:right;padding-top:9px;flex:none;font-size:13px}
  .defbox{background:#EAF6FF;border:2px solid #7CC6F5;border-radius:16px;padding:16px;
    text-align:center;margin:6px 0 12px}
  .defbox .dl{font-family:'Fredoka',sans-serif;font-size:20px;line-height:1.5;color:#0C4A6E}
  .qin{width:100%;padding:13px;border:2.5px solid var(--line);border-radius:14px;
    font-family:inherit;font-size:20px;text-align:center;margin-bottom:10px}
  .qin:focus{border-color:var(--grape);outline:none}
  .qin.eng{letter-spacing:.02em}
  .qlab{font-size:13px;color:var(--ink-soft);text-align:left;margin:2px 2px 4px}
  .ansbox{background:#F7F5FF;border-radius:14px;padding:12px;margin-bottom:6px;text-align:left}
  .ansbox .aw{font-family:'Fredoka',sans-serif;font-size:22px;color:var(--grape)}
  .ansbox .ak{font-size:17px;color:var(--ink);margin-top:2px}
  .ansbox .my{font-size:14px;color:var(--ink-soft);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
  .qprog{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 10px}
  .qp{width:16px;height:9px;border-radius:3px;background:#E0DBF3}
  .qp.ok{background:var(--melon)}.qp.now{background:var(--grape)}.qp.bad{background:var(--berry)}

  .traceTarget{font-family:'Fredoka',sans-serif;font-weight:700;font-size:56px;line-height:1.1;

<div id="app">

<script>
/* 무슨 일이 있어도 흰 화면으로 두지 않는다. 오류는 기록해서 설정 > 진단에서 볼 수 있다. */
var ERRS = [];
window.onerror = function(m, src, ln){ ERRS.push(String(m)+' @'+ln); return false; };
window.addEventListener('unhandledrejection', function(e){ ERRS.push('promise: '+e.reason); });
/* ══════════════════════════════════════════════════════
   ★ 앱스스크립트 API 주소 (배포 > 웹 앱의 /exec 주소) ★
   화면(이 파일)은 GitHub가, 데이터·로그인(진도)·발음은 아래 주소의 앱스스크립트가 담당합니다.
   ══════════════════════════════════════════════════════ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxgOsQMYfd42DaocuVEGVkxWi9ozWbJkJrj-ZkjMVaeNDey9NqSKjU0nZ5LMuBNw5V_/exec';

var OFFLINE = false;   /* 서버(앱스스크립트 API)와 연결이 안 된 상태 */
var SERVER_LOADED = false, needPush = false;  /* 진도 보존용 */

/* --- 앱스스크립트 REST 호출 --- */
function apiGet(action, cb){
  /* GET은 JSONP로 부른다 (GitHub 도메인 ↔ 앱스스크립트 크로스도메인 대응) */
  var name = '__pk_cb_' + (apiGet._n = (apiGet._n||0) + 1);
  var done = false;
  var t = setTimeout(function(){ if(done) return; done=true; cleanup(); cb(undefined); }, 12000);
  function cleanup(){ try{ delete window[name]; }catch(e){ window[name]=undefined; } if(sc&&sc.parentNode) sc.parentNode.removeChild(sc); clearTimeout(t); }
  window[name] = function(data){ if(done) return; done=true; cleanup(); cb(data); };
  var sc = document.createElement('script');
  sc.onerror = function(){ if(done) return; done=true; cleanup(); cb(undefined); };
  sc.src = GAS_URL + '?action=' + encodeURIComponent(action) + '&callback=' + name;
  document.head.appendChild(sc);
}
function apiPost(payload, cb){
  /* POST는 text/plain 으로 보내 프리플라이트 없이 크로스도메인 동작 */
  fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); })
    .then(function(j){ cb(j); })
    .catch(function(e){ cb(undefined, e); });
}
/* 서버에서 받은 진도에 '실제로 한 흔적'이 있는지 (빈 진도면 기기 것을 쓴다) */
function hasProgress(p){
  if(!p) return false;
  if(p.stars && Object.keys(p.stars).length) return true;
  var arrs = ['rewards','draws','quizzes','sents','bonus','cards','prizes','tests'];
  for(var i=0;i<arrs.length;i++){ if(p[arrs[i]] && p[arrs[i]].length) return true; }
  if(p.spec && Object.keys(p.spec).length) return true;
  if(p.books && Object.keys(p.books).length) return true;
  if(p.papers && p.papers.some && p.papers.some(function(b){ return b.read||b.done; })) return true;
  if(p.spent) return true;
  if(p.finalWon) return true;
  return false;
}
/* 진도의 '무게' — 더 진행된 쪽을 고르기 위한 점수 */
function progScore(p){
  if(!p) return -1;
  var n = 0;
  try{ n += Object.keys(p.stars||{}).length * 100; }catch(e){}
  ['rewards','draws','quizzes','sents','bonus','cards','prizes','tests'].forEach(function(k){ if(p[k]&&p[k].length) n += p[k].length; });
  if(p.spec) n += Object.keys(p.spec).length;
  if(p.books) n += Object.keys(p.books).length;
  if(p.papers && p.papers.forEach) p.papers.forEach(function(b){ if(b.read||b.done) n++; });
  n += (p.spent||0)/10;
  return n;
}
function readLocal(){
  try{ var raw = localStorage.getItem('phonics'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
var STARTED = false;   /* 첫 화면이 떴는가 */

/* 어디서든 터져서 첫 화면이 안 뜨면, 흰 화면/무한 대기 대신 원인을 보여준다 */
setTimeout(function(){
  if(STARTED) return;
  var box = document.getElementById('app');
  if(!box) return;

    '<p style="font-size:12.5px;color:#FF5C8A;word-break:break-all;line-height:1.6">'+
      (ERRS.length ? ERRS.slice(0,3).join('<br>') : '알 수 없는 오류') +'</p>'+
    '<button class="btn primary wide" onclick="location.reload()" style="margin-top:10px">🔄 다시 열기</button>'+
    '<p style="font-size:12px;margin-top:14px;color:#5B5680">이 화면을 캡처해서 아빠에게 보여주세요</p></div>';
}, 8000);

/* =========================================================
   1) 소리 데이터 — TTS로 낼 발음 근사값
   ========================================================= */
/* t = 기기 음성용 근사 철자 / ipa = AI 음성용 정확한 음소 / L = 글자 표기
   기기 음성은 'kuh' 같은 가짜 철자를 읽느라 발음이 뭉개진다.
   AI 음성은 <phoneme> 으로 진짜 /k/ 소리를 낸다. */
function SD(L,t,ipa){ return {t:t, ipa:ipa, L:L}; }
var SND = {
  a:SD('a','aah','æ'),  b:SD('b','buh','bə'), c:SD('c','kuh','kə'),  d:SD('d','duh','də'),
  e:SD('e','eh','ɛ'),   f:SD('f','fff','f'),  g:SD('g','guh','ɡə'),  h:SD('h','huh','h'),
  i:SD('i','ih','ɪ'),   j:SD('j','juh','dʒə'),k:SD('k','kuh','kə'),  l:SD('l','lll','l'),
  m:SD('m','mmm','m'),  n:SD('n','nnn','n'),  o:SD('o','awh','ɑ'),   p:SD('p','puh','pə'),
  q:SD('q','kwuh','kwə'),r:SD('r','rrr','ɹ'), s:SD('s','sss','s'),   t:SD('t','tuh','tə'),
  u:SD('u','uh','ʌ'),   v:SD('v','vvv','v'),  w:SD('w','wuh','w'),   x:SD('x','ks','ks'),
  y:SD('y','yuh','j'),  z:SD('z','zzz','z')
};
var DIGSND = { sh:SD('sh','shh','ʃ'), ch:SD('ch','chuh','tʃə'), th:SD('th','thuh','θ'),
               wh:SD('wh','wuh','w'), ph:SD('ph','fff','f'), ck:SD('ck','kuh','kə'), ng:SD('ng','ng','ŋ') };
var DIGS = ['sh','ch','th','wh','ph','ck','ng'];

function onsetParts(o){
  if(!o) return [];
  var out=[], i=0;
  while(i<o.length){
    var two=o.substr(i,2).toLowerCase();
    if(DIGS.indexOf(two)>=0){ out.push(DIGSND[two]); i+=2; }
    else { out.push(SND[o.charAt(i).toLowerCase()] || {t:o.charAt(i)}); i+=1; }
  }
  return out;
}

/* =========================================================
   2) 레벨 데이터
   ========================================================= */
function W(w,e,k,on,ri,pic){ return {w:w,e:e,k:k,on:on,ri:ri,pic:pic!==false}; }
function M(w,e,k,a,b,pic){ return {w:w,e:e,k:k,ch:[a,b],cs:[a,b],bl:[a,b],pic:pic!==false}; }
function E(w,e,k,b,en){ return {w:w,e:e,k:k,ch:[b,'＋'+en],cs:[b,w],bl:[b],pic:false}; }
function S(w,e,k){ return {w:w,e:e,k:k,on:'',ri:'',pic:false}; }

/* =========================================================
   3) 소리 재생 (Web Speech API)
   ========================================================= */
var voice=null, RATE=0.9;
var TTSMODE='device';                 /* 'device' = 기기 음성 · 'ai' = Google Cloud AI 음성 */
var AIVOICE='en-US-Neural2-F';
var AI_OK=false;                      /* 서버에 API 키가 있는가 */
var acache=new Map();                 /* 같은 소리는 한 번만 받아온다 */
var curAudio=null;

/* --- 기기 음성: 되도록 좋은 목소리를 고른다 --- */
function voiceScore(v){
  var n=(v.name||'')+' '+(v.voiceURI||''), s=0;
  if(/en[-_]US/i.test(v.lang)) s+=40; else if(/^en/i.test(v.lang)) s+=15;
  if(/Google/i.test(n)) s+=30;
  if(/Natural|Neural|Online/i.test(n)) s+=28;
  if(/Enhanced|Premium/i.test(n)) s+=25;
  if(/Samantha|Aria|Jenny|Zira|Ava|Allison/i.test(n)) s+=12;
  if(/Compact|eSpeak|espeak/i.test(n)) s-=100;
  if(v.localService===false) s+=8;
  return s;
}
function allVoices(){
  var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return vs.filter(function(v){ return /^en/i.test(v.lang); })
           .sort(function(a,b){ return voiceScore(b)-voiceScore(a); });
}
function pickVoice(){
  try{
    var vs = allVoices(); if(!vs.length) return;
    /* PROG는 이 아래에서 만들어진다. 아이패드는 목소리를 바로 주기 때문에
       여기서 PROG를 그냥 읽으면 undefined를 건드려 앱 전체가 죽는다. */
    var want = (typeof PROG !== 'undefined' && PROG && PROG.tts) ? PROG.tts.dev : '';
    if(want){
      var m = vs.filter(function(v){ return v.name===want; })[0];
      if(m){ voice=m; return; }
    }
    voice = vs[0];
  }catch(e){ ERRS.push('pickVoice: '+e); }
}
try{
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
}catch(e){ ERRS.push('speechSynthesis init: '+e); }

function utter(text, rate){
  var u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate = rate || RATE; u.pitch = 1.05;
  if(voice) u.voice = voice;
  return u;
}

/* --- 공통 --- */
function P(x){ return (typeof x === 'string') ? {t:x} : x; }
function xesc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stopAll(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; }
}
function ssmlOf(parts, gap){
  var g = '<break time="'+(gap||330)+'ms"/>', out = '';
  parts.forEach(function(p, i){
    var prevSilent = i>0 && parts[i-1].silent;
    if(i>0 && !p.silent && !prevSilent) out += g;
    if(p.silent)      out += '<break time="750ms"/>';
    else if(p.ipa)    out += '<phoneme alphabet="ipa" ph="'+xesc(p.ipa)+'">'+xesc(p.L||p.t)+'</phoneme>';
    else              out += xesc(p.t);
  });
  return '<speak>'+out+'</speak>';
}
function playB64(b64, onEnd, onTime){
  var a = new Audio('data:audio/mp3;base64,'+b64);
  curAudio = a;
  if(onTime) a.ontimeupdate = function(){ onTime(a.currentTime); };
  a.onended = function(){ if(curAudio===a) curAudio=null; if(onEnd) onEnd(); };
  a.onerror = function(){ if(onEnd) onEnd(); };
  a.play().catch(function(){ if(onEnd) onEnd(); });
}
function aiFetch(ssml, rate, marks, cb){
  var ck = ssml+'|'+AIVOICE+'|'+rate+'|'+marks;
  if(acache.has(ck)){ cb(acache.get(ck)); return; }
  if(!hasServer){ cb(null); return; }
  apiPost({action:'tts', ssml:ssml, voice:AIVOICE, rate:rate, marks:marks}, function(r){
    if(!r || r.error || !r.audio){ cb(null); return; }
    if(acache.size > 400) acache.clear();
    acache.set(ck, r); cb(r);
  });
}
function useAI(){ return TTSMODE==='ai' && AI_OK && hasServer; }

/* --- 조각들을 차례로 읽어준다 (AI면 한 덩어리 SSML, 아니면 기기 음성) --- */
function sayParts(parts, rate){
  parts = parts.map(P);
  stopAll();
  var r = rate || RATE;
  if(useAI()){
    aiFetch(ssmlOf(parts), r, false, function(res){
      if(res) playB64(res.audio); else devParts(parts, r);
    });
  } else devParts(parts, r);
}
function devParts(parts, r){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  parts.forEach(function(p){ speechSynthesis.speak(utter(p.t, r)); });
}
function say(text, rate){ sayParts([text], rate); }

/* --- 문장을 읽으며 단어를 하나씩 짚어준다 --- */
function speakWords(words, rate, onWord, onEnd){
  stopAll();
  var r = rate || RATE;
  if(useAI()){
    var ssml = '<speak>'+words.map(function(w,i){ return '<mark name="w'+i+'"/>'+xesc(w); }).join(' ')+'</speak>';
    aiFetch(ssml, r, true, function(res){
      if(!res){ devWords(words, r, onWord, onEnd); return; }
      var mk = (res.marks||[]).map(function(m){ return {i:parseInt(String(m.markName).slice(1),10), t:m.timeSeconds||0}; })
                              .sort(function(a,b){ return a.t-b.t; });
      var last = -2;
      playB64(res.audio,
        function(){ onWord(-1); if(onEnd) onEnd(); },
        function(ct){
          if(!mk.length) return;
          var cur = -1;
          for(var i=0;i<mk.length;i++){ if(ct >= mk[i].t - 0.02) cur = mk[i].i; }
          if(cur!==last){ last=cur; onWord(cur); }
        });
    });
  } else devWords(words, r, onWord, onEnd);
}
function devWords(words, r, onWord, onEnd){
  if(!window.speechSynthesis){ if(onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  words.forEach(function(w,i){
    var u = utter(w, r);
    u.onstart = function(){ onWord(i); };
    u.onend = function(){ if(i===words.length-1){ onWord(-1); if(onEnd) onEnd(); } };
    speechSynthesis.speak(u);
  });
}
/* 단어 하나를 어떻게 끊어 읽을지 — 첫소리 + 나머지 + 통째로 */
function blendOf(it){
  if(it.bl) return it.bl.concat([it.w]);        /* 2음절·어미 단어 */
  if(!it.on && !it.ri) return [it.w];
  return onsetParts(it.on).concat([it.ri, it.w]);
}

/* 미리 받아두면 하준이가 누를 때 안 기다린다 */
function prefetch(parts){
  if(!useAI()) return;
  aiFetch(ssmlOf(parts.map(P)), RATE, false, function(){});
}

/* 효과음 (파일 없이 WebAudio) */
var actx=null;
function beep(freqs, dur){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var t = actx.currentTime;
    freqs.forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*dur);
      g.gain.exponentialRampToValueAtTime(.25,t+i*dur+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t+i*dur); o.stop(t+i*dur+dur);
    });
  }catch(e){}
}

/**
 * 사파리(아이패드/아이폰)에서 API 응답이 늦거나 막혀도
 * 성공도 실패도 알리지 않고 조용히 멈추는 일이 있다. 그러면 화면이 영영 흰색이 된다.
 * → 5초 안에 답이 없으면 기기 저장분으로 그냥 시작한다.
 */
function loadProgress(cb){
  var done = false;
  function fin(){
    if(done) return; done = true;
    try{ cb(); }catch(e){ ERRS.push('start: '+e); bootFail(e); }
  }
  if(!hasServer){ OFFLINE = true; localLoad(); applyProg(); fin(); return; }

  var timer = setTimeout(function(){
    if(done) return;
    OFFLINE = true;                 /* 서버가 조용하다 → 기기에 저장된 걸로 진행 */
    ERRS.push('서버 응답 없음(5초) → 오프라인으로 시작');
    var m = document.getElementById('bootmsg');
    if(m) m.textContent = '서버가 느려요. 그냥 시작할게요…';
    localLoad(); applyProg(); fin();
  }, 5000);

  try{
    apiGet('load', function(p, err){
      clearTimeout(timer);
      if(done){ return; }   /* 이미 타임아웃으로 시작했으면 서버 저장을 켜지 않는다 */
      if(p === undefined){
        OFFLINE = true; ERRS.push('진도 불러오기 실패: '+err); localLoad();
      } else {
        SERVER_LOADED = true;
        var local = readLocal();
        var sHas = hasProgress(p), lHas = hasProgress(local);
        if(sHas && lHas){ PROG = (progScore(local) > progScore(p)) ? local : p; }
        else if(sHas){ PROG = p; }
        else if(lHas){ PROG = local; needPush = true; }
        else { PROG = p; }
      }
      applyProg();
      if(needPush && SERVER_LOADED && !OFFLINE){
        try{ apiPost({action:'save', prog:PROG}, function(){}); }catch(e){}
      }
      try{
        apiGet('ttsStatus', function(st){ AI_OK = !!(st && st.enabled); fin(); });
        setTimeout(fin, 4000);
      }catch(e){ fin(); }
    });
  }catch(e){
    clearTimeout(timer); OFFLINE = true;
    ERRS.push('API 호출 실패: '+e);
    localLoad(); applyProg(); fin();
  }
}

function normProg(){
  if(!PROG || typeof PROG!=='object') PROG={};
  if(!PROG.stars) PROG.stars={};
  if(!PROG.tests) PROG.tests={};
  if(!PROG.rewards) PROG.rewards=[];
  if(!PROG.draws) PROG.draws=[];
  if(!PROG.name) PROG.name='옥하준';
  if(!PROG.miss) PROG.miss={};
  if(!PROG.tts) PROG.tts={mode:'device', voice:'en-US-Neural2-F', dev:''};
  if(!PROG.spec) PROG.spec={};
  if(!PROG.bonus) PROG.bonus=[];
  if(!PROG.cards) PROG.cards=[];
  if(!PROG.prizes) PROG.prizes=[];
  if(typeof PROG.spent!=='number') PROG.spent=0;
  if(!PROG.quizzes) PROG.quizzes = [];
  if(!PROG.sents) PROG.sents = [];
  if(!PROG.hiddenSpecs) PROG.hiddenSpecs = [];
  if(!PROG.wordNotes) PROG.wordNotes = {};
  /* 옛 진도: 통과했는데 뽑은 별 기록이 없으면 예전 고정값으로 채운다 */
  PROG.quizzes.forEach(function(q){ if(q.done && typeof q.stars!=='number') q.stars = STAR_QUIZ; });
  PROG.sents.forEach(function(x){ if(x.done && typeof x.stars!=='number') x.stars = STAR_SENT; });
  /* 옛 스페셜: 통과했는데 뽑은 별 기록이 없으면 예전 고정값(10)으로 */
  if(PROG.spec) SPECIALS.forEach(function(sp){
    var r=PROG.spec[sp.id];
    if(r && r.passed && typeof r.stars!=='number') r.stars = STAR_SPEC;
  });
  if(!PROG.papers) PROG.papers = PAPER_PRESET.map(function(b){
    return {id:b.id, e:b.e, t:b.t, by:b.by, pages:b.pages, ko:b.ko, read:0, done:false};
  });
  /* 옛 종이책: 완독했는데 뽑은 별 기록이 없으면 예전 고정값으로 */
  PROG.papers.forEach(function(b){ if(b.done && typeof b.stars!=='number') b.stars = STAR_PAPER; });
  if(!PROG.books) PROG.books={};
  /* 옛 진도({r:종류번호}) → 새 슬롯({s:칸번호})으로 옮긴다 */
  if(PROG.rewards.some(function(x){ return x.s===undefined; })){
    var taken=[], out=[];
    PROG.rewards.forEach(function(x){
      if(x.r===11){ PROG.finalWon=true; return; }          /* 옛 닌텐도 */
      for(var i=0;i<SLOTS.length;i++){
        if(SLOTS[i]===x.r && taken.indexOf(i)<0){ taken.push(i); out.push({s:i, lv:x.lv||0, given:!!x.given}); return; }
      }

  }
  if(PROG.finalWon===undefined) PROG.finalWon=false;
}
function getStar(lv,act){ return (PROG.stars[lv] && PROG.stars[lv][act]) || 0; }
function setStar(lv,act,n){
  if(!PROG.stars[lv]) PROG.stars[lv]={};
  if(n > (PROG.stars[lv][act]||0)) PROG.stars[lv][act]=n;
  saveProgress();
}
function levelStars(L){ var s=0; L.acts.forEach(function(a){ s+=getStar(L.id,a); }); return s; }
function levelMax(L){ return L.acts.length*3; }
function levelDone(L){ return L.acts.every(function(a){ return getStar(L.id,a)>0; }); }
function unlocked(L){
  if(L.id===1) return true;
  var prev = LEVELS.filter(function(x){return x.id===L.id-1;})[0];
  return levelDone(prev);
}
/* ★ 닌텐도 게임 칩은 '별 400개'로 열린다.
   놀이만으로는 315개뿐이라 도달이 불가능하므로, 열심히 한 것에도 별을 준다.
   놀이 315 + 테스트 통과 48 + 책 완독 45 + 스페셜 20 = 만점 428
   목표를 바꾸려면 STAR_GOAL 숫자만 고치면 됩니다. */
var STAR_GOAL = 400;
var STAR_TEST = 30;   /* 단계 테스트 90점 통과(레벨업) 1개당 */
var STAR_BOOK = 3;    /* 이야기책 완독 1권당 */
var STAR_SPEC = 10;   /* 스페셜 테스트 통과 1편당 */

function actStars(){ var s=0; LEVELS.forEach(function(L){ s+=levelStars(L); }); return s; }
function testStars(){ return passedCount() * STAR_TEST; }
function bookStars(){ return books().filter(function(L){ return bookRead(L.id)>0; }).length * STAR_BOOK; }
function specStars(){ return SPECIALS.reduce(function(a,x){ var r=PROG.spec && PROG.spec[x.id]; return a + (r && r.passed ? (r.stars||STAR_SPEC) : 0); }, 0); }
/* 아빠가 주는 별 (심부름·약속 지키기 등) */
var DAD_PIN = '7084';      /* 아빠 비밀번호 — 바꾸시려면 이 줄만 고치세요 */
var MAX_BONUS = 5;         /* 한 번에 줄 수 있는 최대 별 — 바꾸시려면 이 숫자만 */
var BONUS_STARS = 5;       /* 처음 골라져 있는 개수 */
var CARD_PRICE = 100;      /* 축구카드 1장 값 */
function bonusStars(){ return (PROG.bonus||[]).reduce(function(a,b){ return a+b.n; }, 0); }
function giveBonus(n, memo){
  n = Math.max(1, Math.min(MAX_BONUS, parseInt(n, 10) || 1));   /* 1~5개로 제한 */
  if(!PROG.bonus) PROG.bonus=[];
  PROG.bonus.push({n:n, at:Date.now(), memo:memo||''});
  saveProgress();
  return n;
}
/* 지금까지 모은 별 (누적 기록용) */
function totalStars(){ return actStars() + testStars() + bookStars() + specStars() + paperStars() + bonusStars() + quizStars() + sentStars(); }
function spentStars(){ return PROG.spent || 0; }
/* 지금 가진 별 = 모은 별 − 카드로 쓴 별.
   ★ 닌텐도도 카드도 모두 '이 별'을 쓴다. 카드를 사면 닌텐도가 그만큼 멀어진다. */
function walletStars(){ return Math.max(0, totalStars() - spentStars()); }

/* --- 축구카드 (별 100개로 교환) --- */
function cards(){ return PROG.cards || []; }
function buyCard(){
  if(walletStars() < CARD_PRICE) return false;
  PROG.spent = spentStars() + CARD_PRICE;
  if(!PROG.cards) PROG.cards = [];
  PROG.cards.push({id:'c'+Date.now(), at:Date.now(), used:false});
  saveProgress();
  return true;
}

/* --- 아이템 2개 → 축구카드 1장 교환 ---
   안 쓴 보상 아이템(뽑은 것·예전 슬롯)을 2개 내면 카드 1장을 받는다.
   별은 쓰지 않는다 (이미 뽑을 때 냈으니까). 교환 개수를 바꾸려면 TRADE_NEED만. */
var TRADE_NEED = 2;   /* 카드 1장에 필요한 아이템 수 */
function tradeItems(){
  return bagItems().filter(function(x){ return !x.used && (x.kind==='draw' || x.kind==='slot'); });
}
function tradeForCard(keys){
  if(!keys || keys.length !== TRADE_NEED) return false;
  var pool = tradeItems();
  var picked = keys.map(function(k){ return pool.filter(function(x){ return x.key===k; })[0]; });
  if(picked.some(function(x){ return !x; })) return false;
  /* 낸 아이템은 가방에서 사라진다 */
  picked.forEach(function(x){
    if(x.kind==='draw') PROG.draws = draws().filter(function(r){ return r.id!==x.did; });
    else if(x.kind==='slot') PROG.rewards = (PROG.rewards||[]).filter(function(r){ return r.s!==x.si; });
  });
  if(!PROG.cards) PROG.cards = [];
  PROG.cards.push({id:'c'+Date.now(), at:Date.now(), used:false, via:'trade'});
  saveProgress();
  return true;
}

/* --- 가방에 든 것들 --- */
function bagItems(){
  var out = [];
  /* 별로 뽑은 보상들 (새 방식) */
  draws().forEach(function(rec){
    var k = kindById(rec.kid) || {e:'🎁', n:'보상'};
    out.push({key:'d'+rec.id, e:k.e, n:k.n, sub:'별 '+DRAW_PRICE+'개로 뽑음', used:!!rec.used, kind:'draw', did:rec.id});
  });
  /* 예전 슬롯 보상(있으면) */
  wonSlots().slice().sort(function(a,b){ return a-b; }).forEach(function(i){
    var k = kindOf(i), r = slotRec(i);
    out.push({key:'s'+i, e:k.e, n:k.n, sub:'예전 보상', used:!!(r && r.given), kind:'slot', si:i});
  });
  cards().forEach(function(c, idx){
    out.push({key:'c'+c.id, e:'🃏', n:'축구카드 1만원권',
      sub:(c.via==='trade' ? '아이템 '+TRADE_NEED+'개로 바꾼 카드' : '별 '+CARD_PRICE+'개로 바꾼 카드'),
      used:!!c.used, kind:'card', cid:c.id});
  });
  pkPrizes().forEach(function(pz){
    var k = pkPrizeById(pz.pid) || {e:'🎁', n:'상품'};
    out.push({key:'z'+pz.id, e:k.e, n:k.n, sub:'⚽ 페널티킥 상품', used:!!pz.used, kind:'prize', zid:pz.id});
  });
  if(hasFinal()) out.push({key:'final', e:FINAL.e, n:FINAL.n, sub:'별 '+STAR_GOAL+'개 달성!', used:!!PROG.finalUsed, kind:'final'});
  return out;
}
function useItem(it){
  if(it.kind==='draw'){ draws().forEach(function(r){ if(r.id===it.did) r.used = !r.used; }); }
  else if(it.kind==='slot'){ var r=slotRec(it.si); if(r) r.given = !r.given; }
  else if(it.kind==='card'){ cards().forEach(function(c){ if(c.id===it.cid) c.used = !c.used; }); }
  else if(it.kind==='prize'){ pkPrizes().forEach(function(z){ if(z.id===it.zid) z.used = !z.used; }); }
  else if(it.kind==='final'){ PROG.finalUsed = !PROG.finalUsed; }
  saveProgress();
}
function maxStars(){
  var a=0; LEVELS.forEach(function(L){ a += levelMax(L); });

}
/* 별이 목표에 닿는 순간 어디서든 특별 보상이 열린다 */

}

  var DI_C = {sh:'s',ch:'ch',th:'s',ph:'p',wh:'',ck:'k',qu:'k'};
  var DI_V = {oo:'u',ee:'i',ea:'i',ai:'e',ay:'e',oa:'o',ow:'o',ou:'a',oy:'oe',oi:'oe',
              ar:'a',or:'o',er:'eo',ir:'eo',ur:'eo',igh:'a',au:'o',aw:'o'};
  var VLONG = {a:'e',e:'i',i:'a',o:'o',u:'yu'};   /* 매직 e */
  var V = {a:'ae',e:'e',i:'i',o:'o',u:'eo'};
  function isV(c){ return 'aeiou'.indexOf(c)>=0; }

  var out='', k=0;
  while(k<s.length){
    var cho='', jung='', jong='';
    /* 초성: 이중자음 → 단자음 */
    var d2=s.substr(k,2);
    if(DI_C[d2]!==undefined && !isV(s[k])){ cho=DI_C[d2]; k+=2; }
    else if(!isV(s[k]) && s[k]!=='y' && CMAP[s[k]]!==undefined){ cho=CMAP[s[k]]; k++; }
    else if(s[k]==='y'){ cho=''; }
    /* 매직 e: (지금 위치)모음 + 자음 + e(끝) → 긴모음(다음절) + 자음, e 묵음 */
    if(isV(s[k]) && k+3===s.length && !isV(s[k+1]) && s[k+2]==='e' && !DI_C[s.substr(k+1,2)]){
      var LONGKO = {a:'에이',e:'이',i:'아이',o:'오',u:'유'};
      var CKO = {b:'브',c:'크',d:'드',f:'프',g:'그',k:'크',l:'ㄹ',m:'므',n:'느',p:'프',
                 r:'르',s:'스',t:'트',v:'브',z:'즈'};
      out += (cho?(({b:'브',k:'크',d:'드',p:'프',s:'스',t:'트',g:'그',m:'므',n:'느',r:'르',h:'흐',j:'즈',ch:'취'})[cho]||''):'')
             + (LONGKO[s[k]]||V[s[k]]) + (CKO[s[k+1]]||'');
      k+=3; continue;
    }
    /* 중성 */
    var v3=s.substr(k,3), v2=s.substr(k,2);
    if(DI_V[v3]){ jung=DI_V[v3]; k+=3; }
    else if(DI_V[v2]){ jung=DI_V[v2]; k+=2; }
    else if(isV(s[k])){ jung=V[s[k]]; k++; }
    else if(s[k]==='y'){ jung='i'; k++; }
    else { jung='eu'; }   /* 자음만 있으면 '으' 붙여 발음 */
    /* 받침: sh/ch/th 이중자음이 끝이면 받침으로 */
    var e2=s.substr(k,2);
    if(k<s.length && DI_C[e2]!==undefined && (k+2>=s.length)){
      jong = (DI_C[e2]==='ch'?'t':(DI_C[e2]||'s')); k+=2;
    } else if(k<s.length && !isV(s[k]) && s[k]!=='y' && CJONG[s[k]]!==undefined){
      var isEnd = (k+1>=s.length);
      var nextV = (k+1<s.length && (isV(s[k+1])||s[k+1]==='y'));
      if((isEnd || !nextV) && CJONG[s[k]]){ jong=CJONG[s[k]]; k++; }
    }
    out += syl(cho, jung, jong) || '';
  }
  return out || raw;
}

    };
    on('.pkdir', function(){ if(!busy) kick(this.dataset.dir); });
  }

  function kick(dir){
    busy = true;
    var scored = Math.random() < PK_GOAL_RATE;
    /* 골키퍼는 세 방향 중 하나로 슬라이딩.
       못 넣으면 골키퍼가 내가 찬 쪽으로 몸을 날려 막고,
       넣으면 다른 쪽으로 헛발질하게 해서 리얼하게 보인다. */
    var keeperDir;
    if(!scored) keeperDir = dir;
    else { var others = ['L','C','R'].filter(function(x){ return x!==dir; }); keeperDir = others[Math.floor(Math.random()*others.length)]; }

    var ball = document.getElementById('pkball');
    var keeper = document.getElementById('pkkeeperG');
    var msg = document.getElementById('msg');
    var flash = document.getElementById('flash');
    /* 골대 안 목표 지점 (SVG 좌표계 0~300 x, 0~150 y 기준) */
    var tx = dir==='L' ? 70 : dir==='R' ? 230 : 150;
    var ty = dir==='C' ? 66 : 58;
    /* 골키퍼 슬라이딩 변환 */
    var kx = keeperDir==='L' ? -78 : keeperDir==='R' ? 78 : 0;
    var krot = keeperDir==='L' ? -55 : keeperDir==='R' ? 55 : 0;
    keeper.style.transition = 'transform .38s cubic-bezier(.3,.8,.4,1)';
    keeper.style.transform = 'translate('+kx+'px,'+(keeperDir==='C'?-6:14)+'px) rotate('+krot+'deg)';

    /* 공: 점프대에서 목표 지점으로 포물선. CSS 좌표(px)로 변환해 이동 */
    ball.setAttribute('data-fly','1');
    ball.style.transition = 'transform .5s cubic-bezier(.25,.6,.5,1)';
    /* 시작점(발밑 x=150,y=200) → 목표(tx,ty). scale로 원근(멀어지며 작아짐) */
    var dx = tx-150, dy = ty-198;
    ball.style.transform = 'translate('+dx+'px,'+dy+'px) scale(.45)';
    beep([500,700],.06);

    /* 살짝 뒤에 골키퍼 결과 판정 */
    setTimeout(function(){
      shot++; shotLog[shot-1] = scored;
      if(scored){
        goals++; okSound(); confetti(24);
        flash.classList.add('show');
        msg.innerHTML='<b style="color:#16A34A;font-size:22px">⚽ 골인!! 🎉</b>';
        try{ beep([700,900,1100],.14); }catch(e){}
      } else {
        noSound();
        msg.innerHTML='<b style="color:var(--berry);font-size:20px">🧤 골키퍼가 막았다!</b>';
      }
      var sc=document.getElementById('score'); if(sc) sc.textContent='🥅 '+goals+'골 · '+shot+'/'+PK_SHOTS+'번';
      setTimeout(function(){
        if(shot >= PK_SHOTS) finish();
        else { busy=false; draw(); }
      }, scored ? 1250 : 950);
    }, 520);
  }

  function finish(){
    var won = goals >= PK_WIN_NEED;
    if(won){ starSound(); confetti(70); } else { noSound(); }
    app.innerHTML =
      '<div class="result">'+
        '<div class="big">'+(won?'🏆':'😅')+'</div>'+
        '<h2>'+(won?'승리!':'아쉬워요!')+'</h2>'+
        '<p>'+PK_SHOTS+'번 차서 <b>'+goals+'골</b>을 넣었어요!<br>'+
          (won ? '<b style="color:var(--melon)">'+PK_WIN_NEED+'골 이상 성공! 상품을 뽑으세요! 🎁</b>'
               : PK_WIN_NEED+'골 이상 넣으면 상품을 받아요. 다시 도전해봐요!')+'</p>'+
        '<div class="card" style="margin-bottom:12px;font-size:26px">'+
          shotLog.map(function(r){ return r?'⚽':'🧤'; }).join(' ')+
        '</div>'+
        (won ? '<button class="drawbtn" id="pzdraw">'+
                 '<span class="spk" style="left:14px;top:10px">✨</span>'+
                 '<span class="spk" style="right:16px;top:12px;animation-delay:.5s">🎁</span>'+
                 '<span class="spk" style="left:22px;bottom:10px;animation-delay:.9s">✨</span>'+
                 '🎰 상품 뽑기!'+
               '</button>' : '')+
        '<button class="btn primary wide" id="retry" style="margin-bottom:10px">🔁 다시 도전 (별 '+PK_PRICE+'개)</button>'+
        '<button class="btn go wide" id="home">🏠 그만하기</button>'+
      '</div>';
    if(document.getElementById('pzdraw')) document.getElementById('pzdraw').onclick = function(){
      modalPrizeDraw(function(pz){
        if(!PROG.prizes) PROG.prizes = [];
        PROG.prizes.push({id:'z'+Date.now(), pid:pz.id, at:Date.now(), used:false});
        saveProgress();
        var o = openMod('<div style="font-size:60px">'+pz.e+'</div>'+
          '<h2>상품 획득!</h2><p><b>'+pz.n+'</b>을(를) 받았어요!<br>가방에서 확인하세요 🎒</p>'+
          '<button class="btn primary wide" id="ok" style="font-size:19px;padding:16px">야호! 🎉</button>');
        o.querySelector('#ok').onclick = function(){ o.remove(); screenHome(); };
      });
    };
    document.getElementById('retry').onclick = startPKGame;
    document.getElementById('home').onclick = screenHome;
  }
}

/* 🎁 상품 뽑기 릴 — 전체 상품(KINDS) 중에서 하나 */
function modalPrizeDraw(cb){
  /* 전체 상품 = 페널티킥 전용(PK_PRIZES) + 일반 보상(KINDS) 모두 */
  var POOL = PK_PRIZES.concat(KINDS.map(function(k){ return {id:'k'+k.id, e:k.e, n:k.n}; }));
  var got = POOL[Math.floor(Math.random()*POOL.length)];
  var ov = openMod(
    '<div style="font-size:50px">🎁</div>'+
    '<h2>상품 뽑기!</h2>'+
    '<p>어떤 상품이 나올까?</p>'+
    '<div class="bigreel" id="reel"><div class="num" style="font-size:46px">🎁</div><div style="font-size:15px;color:var(--ink-soft)">눌러서 뽑기!</div></div>'+
    '<button class="drawbtn" id="go">'+
      '<span class="spk" style="left:14px;top:10px">✨</span>'+
      '<span class="spk" style="right:16px;top:12px;animation-delay:.5s">🎁</span>'+
      '🎰 상품 뽑기!'+
    '</button>'
  );
  var reel = ov.querySelector('#reel'), go = ov.querySelector('#go');
  go.onclick = function(){
    go.disabled=true; go.style.animation='none'; go.style.opacity='.6';
    reel.classList.add('spinning');
    var n=0, total=26;
    (function spin(){
      var r = POOL[Math.floor(Math.random()*POOL.length)];
      reel.innerHTML = '<div class="num" style="font-size:46px">'+r.e+'</div><div style="font-size:15px">'+r.n+'</div>';
      beep([440+n*15],.03); n++;
      if(n<total) setTimeout(spin, 38 + n*n*0.6);
      else {
        reel.classList.remove('spinning'); reel.classList.add('hit');
        reel.innerHTML = '<div class="num" style="font-size:52px">'+got.e+'</div><div style="font-size:17px;font-weight:800;color:var(--mango)">'+got.n+'!</div>';
        starSound(); confetti(24);
        go.style.display='none';
        var done = document.createElement('button');
        done.className='btn primary wide'; done.style.cssText='font-size:20px;padding:16px';
        done.textContent='야호! 받았다 🎉';
        done.onclick = function(){ ov.remove(); cb(got); };
        go.parentNode.appendChild(done);
      }
    })();
  };
}

function screenDad(){
  var pin = '', bad = false;
  function draw(){
    app.innerHTML =
      '<div class="topbar"><button class="iconbtn" id="back">←</button><h2>👨 아빠가 별 주기</h2><div style="width:44px"></div></div>'+

        '<div style="font-size:17px;margin-top:6px">아빠 비밀번호를 넣어주세요</div>'+
        '<div class="muted">하준이가 스스로 별을 줄 수는 없어요 🙂</div>'+
        '<div class="dots4">'+ [0,1,2,3].map(function(k){
          return '<div class="d4 '+(bad?'bad':(k<pin.length?'on':''))+'"></div>';
        }).join('') +'</div>'+
        '<div class="pin">'+
          [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-n="'+n+'">'+n+'</button>'; }).join('')+
          '<button data-n="del">←</button><button data-n="0">0</button><button data-n="ok">✓</button>'+
        '</div>'+
      '</div>';
    document.getElementById('back').onclick = screenHome;
    on('.pin button', function(){
      var v = this.dataset.n;
      bad = false;
      if(v==='del') pin = pin.slice(0,-1);
      else if(v==='ok'){
        if(pin===DAD_PIN){ okSound(); give(); return; }
        noSound(); bad = true; pin = ''; draw(); return;
      }
      else if(pin.length<4){ pin += v; beep([600+(+v)*20],.04); }
      if(pin.length===4 && v!=='del'){
        if(pin===DAD_PIN){ okSound(); give(); return; }
        noSound(); bad = true; pin = ''; draw(); return;
      }
      draw();
    });
  }
  /* 통과 → 별 주기 */
  function give(){
    var picks = ['심부름을 잘했어요','약속을 지켰어요','방을 정리했어요','동생/친구에게 잘했어요','숙제를 스스로 했어요','스스로 일어났어요'];
    var n = BONUS_STARS;   /* 아빠가 고른 별 개수 */
    var labels = ['','조금 잘했어요','잘했어요','아주 잘했어요','정말 대단해요','최고예요!'];
    app.innerHTML =
      '<div class="topbar"><button class="iconbtn" id="back">←</button><h2>👨 별 주기</h2><div style="width:44px"></div></div>'+
      '<div class="card" style="text-align:center">'+
        '<h3 style="margin:2px 0 2px;font-size:20px">별을 몇 개 줄까요?</h3>'+
        '<div class="muted">최대 '+MAX_BONUS+'개까지 줄 수 있어요</div>'+
        '<div class="starpick" id="sp"></div>'+
        '<div class="pickcnt" id="cnt"></div>'+
      '</div>'+
      '<div class="card" style="text-align:center;margin-top:12px">'+
        '<h3 style="margin:2px 0 2px;font-size:19px">하준이가 뭘 잘했나요?</h3>'+
        '<div class="muted" style="margin-bottom:10px">고르거나 직접 적어주세요 (안 적어도 돼요)</div>'+
        '<div class="chunks" style="margin:8px 0">'+ picks.map(function(t,i){
          return '<button class="chunk rime" style="font-family:inherit;font-size:14px;padding:8px 12px" data-t="'+esc(t)+'">'+esc(t)+'</button>';
        }).join('') +'</div>'+
        '<div class="frm"><input id="memo" placeholder="예: 혼자 신발 정리했어요"></div>'+
        '<button class="btn go wide" id="go" style="font-size:20px;padding:17px"></button>'+
      '</div>'+
      (PROG.bonus.length
        ? '<div class="card" style="margin-top:12px;text-align:left">'+
            '<div style="font-size:15px;margin-bottom:6px">📜 지금까지 준 별 · 총 <b>'+bonusStars()+'개</b></div>'+
            PROG.bonus.slice(-6).reverse().map(function(b){
              var dt = new Date(b.at);
              return '<div class="storyline" style="font-family:inherit;font-size:13px">⭐'+b.n+' · '+
                (dt.getMonth()+1)+'/'+dt.getDate()+(b.memo?' · '+esc(b.memo):'')+'</div>';
            }).join('')+
          '</div>'
        : '');
    document.getElementById('back').onclick = screenHome;
    on('.chunk', function(){ document.getElementById('memo').value = this.dataset.t; beep([700],.04); });

    /* 별 고르기 — 세 번째 별을 누르면 3개 */
    function drawStars(){
      var box = document.getElementById('sp'), out = '';
      for(var k=1; k<=MAX_BONUS; k++) out += '<button class="sp '+(k<=n?'on':'')+'" data-n="'+k+'">★</button>';
      box.innerHTML = out;
      document.getElementById('cnt').textContent = '⭐ '+n+'개 · '+labels[n];
      document.getElementById('go').textContent = '⭐ 별 '+n+'개 주기!';
      on('.sp', function(){
        n = +this.dataset.n;
        beep([620+n*70], .05);
        drawStars();
      });
    }
    drawStars();

    document.getElementById('go').onclick = function(){
      var got = giveBonus(n, document.getElementById('memo').value.trim());
      starSound(); confetti(10 + got*5);
      var ov = openMod('<div style="font-size:56px">'+ new Array(got+1).join('⭐') +'</div>'+
        '<h2>별 '+got+'개 획득!</h2>'+
        '<p>'+esc(PROG.name)+'이가 잘했어요!<br>쓸 수 있는 별 <b>⭐ '+walletStars()+'</b> · 모은 별 <b>'+totalStars()+'</b></p>'+
        '<button class="btn primary wide" id="ok" style="font-size:19px;padding:16px">고마워요! 🎉</button>');
      ov.querySelector('#ok').onclick = function(){ ov.remove(); checkFinal(function(){ screenHome(); }); };
    };
  }
  draw();
}

function books(){ return LEVELS.filter(function(L){ return L.story && L.story.p; }); }
function bookRead(id){ return (PROG.books && PROG.books[id]) || 0; }
function markRead(id){
  if(!PROG.books) PROG.books = {};
  PROG.books[id] = bookRead(id) + 1;
  saveProgress();
}

function screenLibrary(){
  var bs = books();
  var done = bs.filter(function(L){ return bookRead(L.id)>0; }).length;
  var html =
    '<div class="topbar">'+

    '</div>'+
    '<div class="shelf">';

  });
}

/* 책 읽기 — 한 쪽씩 넘기며, 소리는 하준이가 원할 때만 */
function screenBook(L){
  var pg = L.story.p, i = 0;
  function draw(){
    var line = pg[i][0], emo = pg[i][1], ws = line.split(' ');
    app.innerHTML =
      '<div class="topbar">'+
        '<button class="iconbtn" id="back">←</button>'+
        '<h2>'+L.story.e+' '+esc(L.story.t)+'</h2>'+
        '<div class="pill">'+(i+1)+'/'+pg.length+'</div>'+
      '</div>'+
      '<div class="page">'+
        '<div class="pe">'+emo+'</div>'+
        '<div class="pt">'+ws.map(function(w,k){ return '<span class="sw" data-i="'+k+'">'+esc(w)+'</span>'; }).join(' ')+'</div>'+
      '</div>'+
      '<div class="pdots">'+pg.map(function(_,k){ return '<div class="pdot '+(k===i?'on':'')+'"></div>'; }).join('')+'</div>'+
      '<div class="pnav">'+
        '<button class="btn" id="prev"'+(i===0?' disabled':'')+'>◀</button>'+
        '<button class="btn primary" id="play" style="flex:2">🔊 읽어주기</button>'+
        '<button class="btn" id="slow">🐢</button>'+
        '<button class="btn go" id="next">'+(i===pg.length-1?'끝 ✓':'▶')+'</button>'+
      '</div>'+
      '<div class="muted" style="text-align:center;margin-top:10px">단어를 누르면 그 단어만 들려주고 <b>메모</b>도 남길 수 있어요<br>먼저 소리내어 읽고, 그다음 눌러보세요!</div>';
    document.getElementById('back').onclick = function(){ stopAll(); screenLibrary(); };
    var bKey = 'book_' + L.id + '_' + i;   /* 이야기책: 레벨+쪽별로 메모 저장 */
    var spans = app.querySelectorAll('.sw');
    Array.prototype.forEach.call(spans, function(sp){
      paintNote(sp, bKey, ws[+sp.dataset.i]);
      sp.onclick = function(){
        var wd = ws[+this.dataset.i];
        say(wd, 0.85);
        openWordNote(bKey, wd, this);
      };
    });
    function readIt(rate){
      speakWords(ws, rate||RATE, function(k){
        Array.prototype.forEach.call(spans, function(x){ x.classList.remove('hi'); });
        if(k>=0 && spans[k]) spans[k].classList.add('hi');
      });
    }
    document.getElementById('play').onclick = function(){ readIt(); };
    document.getElementById('slow').onclick = function(){ readIt(0.6); };
    document.getElementById('prev').onclick = function(){ if(i>0){ i--; stopAll(); draw(); } };
    document.getElementById('next').onclick = function(){
      stopAll();
      if(i < pg.length-1){ i++; beep([700],.04); draw(); }
      else finish();
    };
  }
  function finish(){
    var first = bookRead(L.id)===0;
    markRead(L.id); starSound(); confetti(20);
    app.innerHTML =
      '<div class="result">'+
        '<div class="big">📖</div>'+
        '<h2>한 권 다 읽었다!</h2>'+
        '<p>'+esc(L.story.t)+'<br>'+esc(L.story.ko)+'</p>'+
        '<div class="card" style="margin-bottom:14px">'+
          pg.map(function(x){ return '<div class="storyline done">'+x[1]+' '+esc(x[0])+'</div>'; }).join('')+
        '</div>'+
        (first ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6">⭐ 첫 완독! 별 <b>'+STAR_BOOK+'개</b>를 받았어요</div>' : '')+
        '<button class="btn primary wide" id="again" style="margin-bottom:10px">🔁 다시 읽기</button>'+
        '<button class="btn go wide" id="lib">📚 도서관으로</button>'+
      '</div>';
    document.getElementById('again').onclick = function(){ i=0; draw(); };
    document.getElementById('lib').onclick = screenLibrary;
    checkFinal();
  }
  draw();
}
