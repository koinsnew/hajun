      if(!items.length){ noSound(); alert('\ub73b\ud480\uc774\uc640 \uc601\uc5b4 \ub2e8\uc5b4\ub294 \uaf2d \ub123\uc5b4\uc8fc\uc138\uc694. (\ud55c\uae00 \ub73b\uc740 \uc120\ud0dd)'); return; }
      if(!PROG.quizzes) PROG.quizzes = [];
      if(editing){ q.title=t; q.items=items; }
      else PROG.quizzes.push({id:'q'+Date.now(), title:t, items:items, done:false});
      saveProgress(); okSound(); toast('\ud83d\udcbe'); screenQuizList();
    };
    if(editing) document.getElementById('del').onclick = function(){
      if(!confirm('\u201c'+q.title+'\u201d \ub2e8\uc5b4\uc7a5\uc744 \uc9c0\uc6b8\uae4c\uc694?')) return;
      PROG.quizzes = quizzes().filter(function(x){ return x.id!==q.id; });
      saveProgress(); toast('\ud83d\uddd1'); screenQuizList();
    };
  }
  draw();
}

/* --- 시험 보기 --- */
function startQuiz(q){
  var order = shuffle(q.items.map(function(_,i){ return i; }));
  var pos = 0, round = 1, results = order.map(function(){ return null; });  /* null/ok/bad */
  runOne();

  function bar(){
    return '<div class="qprog">'+ order.map(function(_,k){
      var st = results[k];
      var cls = k===pos ? 'now' : (st==='ok'?'ok':(st==='bad'?'bad':''));
      return '<div class="qp '+cls+'"></div>';
    }).join('') +'</div>';
  }
  function head(sub){
    return '<div class="topbar">'+
      '<button class="iconbtn" id="qback">\u2190</button>'+
      '<h2>\ud83d\udcdd '+esc(q.title)+'</h2>'+
      '<div class="pill">'+(pos+1)+'/'+order.length+'</div>'+
    '</div>'+
    '<div class="muted" style="text-align:center;margin:-4px 0 8px">'+round+'\ubc88\uc9f8 \ub3c4\uc804 \u00b7 '+sub+'</div>'+ bar();
  }
  function bindBack(){ document.getElementById('qback').onclick = function(){ stopAll(); screenQuizList(); }; }

  /* 1단계: 뜻풀이 보여주고 소리로 들려줌 → 하준이가 타이핑 */
  /* \ub73b\ud480\uc774 \ubb38\uc7a5\uc758 \ud55c\uae00 \ud574\uc11d \u2014 \ud55c \ubc88 \ubc1b\uc73c\uba74 \ubb38\uc81c(it.dk)\uc5d0 \uc800\uc7a5\ud574 \ub2e4\uc2dc \uc548 \ubd80\ub978\ub2e4 */
  function sentKo(it, cb){
    if(it.dk){ cb(it.dk); return; }
    if(!hasServer){ cb(''); return; }
    apiPost({action:'trans', pin:DAD_PIN, text:it.def}, function(j){
      var v = j && j.ok && String(j.ko||'').trim();
      if(v){ it.dk = v; saveProgress(); cb(v); } else cb('', j);
    });
  }

  function runOne(){
    var it = q.items[order[pos]];
    app.innerHTML = head('\ub4e3\uace0 \ubcf4\uace0 \ud0c0\uc774\ud551!') +
      '<div class="card">'+
        '<div class="qlab" style="text-align:center">\uc774 \ub73b\ud480\uc774\uc758 \ub2e8\uc5b4\ub294?</div>'+
        '<div class="defbox">'+
          '<div class="dl" id="dlbox"></div>'+
          '<div id="dko" style="display:none"></div>'+
          '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">'+
            '<button class="btn" id="seeS" style="background:#FFF3D6;box-shadow:0 4px 0 #F1D08A">\ud83d\udc40 \ubb38\uc7a5 \ubcf4\uae30</button>'+
            '<button class="btn primary" id="say">\ud83d\udd0a \ub4e4\uc5b4\ubcf4\uae30</button>'+
            '<button class="btn" id="slow">\ud83d\udc22</button>'+
          '</div>'+
        '</div>'+
        '<div class="qlab">\u270f\ufe0f \uc601\uc5b4 \ub2e8\uc5b4\ub97c \uc790\ud310\uc73c\ub85c \uce58\uc138\uc694</div>'+
        '<input class="qin eng" id="ansW" placeholder="\uc5ec\uae30\uc5d0 \uc601\uc5b4 \ub2e8\uc5b4" autocomplete="off" autocapitalize="off" spellcheck="false">'+
        '<div class="qlab" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">'+
          '<span>\u270f\ufe0f \ud55c\uae00 \ub73b\ub3c4 \uce58\uc138\uc694 '+(it.k?'':'<span style="opacity:.6">(\uc774 \ubb38\uc81c\ub294 \ud55c\uae00 \ub73b\uc774 \uc5c6\uc5b4\uc694)</span>')+'</span>'+
          (it.k ? '<button class="btn" id="seeK" style="padding:6px 12px;font-size:14px;background:#E8F7EE;box-shadow:0 3px 0 #B7E4C7">\ud83d\udc40 \ud55c\uae00 \ub73b \ubcf4\uae30</button>' : '')+
        '</div>'+
        '<div id="kshow" style="display:none;text-align:center;font-size:22px;font-weight:800;color:#166534;background:#E8F7EE;border:2px solid #86D9A6;border-radius:14px;padding:8px;margin-bottom:10px"></div>'+
        '<input class="qin" id="ansK" placeholder="\uc5ec\uae30\uc5d0 \ud55c\uae00 \ub73b"'+(it.k?'':' disabled')+'>'+
        '<button class="btn go wide" id="done" style="font-size:18px;margin-top:6px">\u2705 \ub2e4 \uc37c\uc5b4\uc694! \ud655\uc778\ud558\uae30</button>'+
      '</div>';
    bindBack();
    var play = function(r){ speakWords(it.def.split(/\s+/), r||RATE, function(){}); };
    document.getElementById('say').onclick = function(){ play(); };
    document.getElementById('slow').onclick = function(){ play(0.6); };

    /* \uc601\uc5b4 \ub73b\ud480\uc774 \ubb38\uc7a5\uc740 \ucc98\uc74c\uc5d4 \uc228\uae40(\uc18c\ub9ac\ub9cc). [\ubb38\uc7a5 \ubcf4\uae30]\ub97c \ub204\ub974\uba74 \ubb38\uc7a5 + \ud55c\uae00 \ud574\uc11d, \ub2e4\uc2dc \ub204\ub974\uba74 \uc228\uae40 */
    var shown = false, myPos = pos;
    var dl = document.getElementById('dlbox'), dko = document.getElementById('dko'), seeS = document.getElementById('seeS');
    function paintDef(){
      if(!shown){
        dl.innerHTML = '<span style="opacity:.65">\ud83d\ude48 \ubb38\uc7a5\uc774 \uc228\uaca8\uc838 \uc788\uc5b4\uc694</span><br><span style="font-size:14px;opacity:.65">\uc18c\ub9ac\ub97c \ub4e3\uace0 \ub2e8\uc5b4\ub97c \ub9de\ud600 \ubcf4\uc138\uc694</span>';
        dko.style.display = 'none'; seeS.textContent = '\ud83d\udc40 \ubb38\uc7a5 \ubcf4\uae30';
      } else {
        dl.textContent = it.def; seeS.textContent = '\ud83d\ude48 \ubb38\uc7a5 \uc228\uae30\uae30';
        dko.style.display = 'block';
        dko.style.cssText = 'display:block;margin-top:8px;padding-top:8px;border-top:2px dashed #7CC6F5;font-size:17px;font-weight:700;color:#166534;line-height:1.45';
        if(it.dk) dko.textContent = '\ud83c\uddf0\ud83c\uddf7 '+it.dk;
        else {
          dko.textContent = '\ud83c\uddf0\ud83c\uddf7 \ud55c\uae00 \ub73b \ubd88\ub7ec\uc624\ub294 \uc911\u2026';
          sentKo(it, function(v, err){
            if(myPos !== pos || !document.body.contains(dko)) return;
            if(!shown) return;
            dko.textContent = v ? '\ud83c\uddf0\ud83c\uddf7 '+v : '\ud83c\uddf0\ud83c\uddf7 (\ud55c\uae00 \ud574\uc11d\uc744 \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc5b4\uc694: '+String(scanErrMsg(err)).split('\n')[0]+')';
          });
        }
      }
    }
    paintDef();
    seeS.onclick = function(){ shown = !shown; paintDef(); };
    if(document.getElementById('seeK')){
      var kOn = false;
      document.getElementById('seeK').onclick = function(){
        kOn = !kOn;
        var ks = document.getElementById('kshow');
        ks.style.display = kOn ? 'block' : 'none'; ks.textContent = kOn ? it.k : '';
        this.textContent = kOn ? '\ud83d\ude48 \ud55c\uae00 \ub73b \uc228\uae30\uae30' : '\ud83d\udc40 \ud55c\uae00 \ub73b \ubcf4\uae30';
      };
    }
    play();   /* 문제 나오면 자동으로 한 번 들려준다 */
    document.getElementById('done').onclick = function(){ stopAll(); judge(
      document.getElementById('ansW').value.trim(),
      document.getElementById('ansK').value.trim()
    ); };
  }

  /* 채점: 영어 단어만 자동으로 맞는지 확인한다 (대소문자·앞뒤 공백 무시).
     한글 뜻은 확인만 하고 채점에는 넣지 않는다. */
  function normW(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

  /* 2단계: 영어 단어 자동 채점 — 아빠가 없어도 넘어간다 */
  function judge(myW, myK){
    var it = q.items[order[pos]];
    var correct = normW(myW) === normW(it.w);
    results[order[pos]] = correct ? 'ok' : 'bad';
    if(correct){ okSound(); toast('\u2b55'); } else { beep([300],.1); }

    app.innerHTML = head(correct ? '\u2b55 \uc815\ub2f5!' : '\u274c \uc544\uc26c\uc6cc\uc694') +
      '<div class="card">'+
        '<div class="defbox"><div class="dl">'+esc(it.def)+'</div></div>'+
        '<div style="text-align:center;font-size:44px;margin:2px 0 8px">'+(correct?'\u2b55':'\u274c')+'</div>'+
        '<div class="ansbox">'+
          '<div class="qlab" style="margin:0 0 4px">\u2705 \uc815\ub2f5 \ub2e8\uc5b4</div>'+
          '<div style="display:flex;align-items:center;gap:10px">'+
            '<div class="aw" style="flex:1">'+esc(it.w)+'</div>'+
            '<button class="btn primary" id="sayW" style="flex:none">\ud83d\udd0a \ub4e4\uae30</button>'+
            '<button class="btn" id="slowW" style="flex:none">\ud83d\udc22</button>'+
          '</div>'+
          (it.k?'<div class="ak" style="margin-top:6px">\ub73b: '+esc(it.k)+'</div>':'')+
          '<div class="my">\u270f\ufe0f \ud558\uc900\uc774\uac00 \uc4f4 \ub2f5: \uc601\uc5b4 \u201c<b style="color:'+(correct?'var(--melon)':'var(--berry)')+'">'+
            (esc(myW)||'(\ube48\uce78)')+'</b>\u201d'+
            (it.k?' \u00b7 \ud55c\uae00 \u201c<b>'+(esc(myK)||'(\ube48\uce78)')+'</b>\u201d':'')+
          '</div>'+
        '</div>'+
      '</div>'+
      '<button class="btn go wide" id="nx" style="font-size:19px;padding:16px">'+
        (correct
          ? (pos < order.length-1 ? '\ub2e4\uc74c \ubb38\uc81c \u25b6' : '\uacb0\uacfc \ubcf4\uae30 \ud83c\udfc1')
          : '\u270f\ufe0f \ub530\ub77c\uc4f0\uace0 \uc678\uc6b0\uae30!')+'</button>';
    bindBack();
    /* 정답 단어를 또박또박이 아니라 통째로 자연스럽게 읽어준다 */
    var playW = function(r){ speakWords([it.w], r||RATE, function(){}); };
    document.getElementById('sayW').onclick = function(){ playW(); };
    document.getElementById('slowW').onclick = function(){ playW(0.6); };
    playW();   /* 채점되면 정답 발음을 자동으로 한 번 들려준다 */
    document.getElementById('nx').onclick = function(){
      stopAll();
      if(correct) next();
      else traceWord(it, next);   /* 틀리면 10번 따라쓰고 넘어간다 */
    };
  }

  /* 틀린 단어를 손가락으로 따라 그리며 외운다. 10번 그리면 넘어간다.
     희미한 글자를 밑그림으로 깔고, 그 위를 덧칠하듯 그린다.
     글자 획을 충분히 덮으면 1회로 인정한다. */
  function traceWord(it, after){
    var TIMES = 10, done_ = 0;

    function draw(){
      app.innerHTML =
        '<div class="topbar">'+
          '<button class="iconbtn" id="qback">\u2190</button>'+
          '<h2>\u270f\ufe0f \ub530\ub77c \uadf8\ub9ac\uae30</h2>'+
          '<div class="pill">'+done_+'/'+TIMES+'</div>'+
        '</div>'+
        '<div class="card" style="text-align:center">'+
          '<div class="traceBig">\uc774 \ub2e8\uc5b4\ub97c <b>'+TIMES+'\ubc88</b> \uc190\uac00\ub77d\uc73c\ub85c \ub530\ub77c \uadf8\ub824\uc694!</div>'+
          (it.k?'<div class="ak" style="margin:4px 0 2px">\ub73b: '+esc(it.k)+'</div>':'')+
          '<div class="row" style="justify-content:center"><button class="btn primary" id="sayW">\ud83d\udd0a \ub4e4\uae30</button>'+
            '<button class="btn" id="slowW">\ud83d\udc22</button></div>'+
          '<div class="traceCount">'+ (function(){
            var o='';
            for(var k=1;k<=TIMES;k++){
              var cls = k<=done_ ? 'done' : (k===done_+1 ? 'now' : '');
              o += '<div class="tc '+cls+'">'+(k<=done_?'\u2713':k)+'</div>';
            }
            return o;
          })() +'</div>'+
          (done_>=TIMES
            ? '<div class="drawTip">\ud83c\udf89 \ub2e4 \uadf8\ub838\uc5b4\uc694!</div>'
            : '<div class="drawTip">\ud76c\ubbf8\ud55c \uae00\uc790 \uc704\ub97c \uc190\uac00\ub77d\uc73c\ub85c \ub36e\uc5b4 \uadf8\ub824\uc694</div>')+
          '<div class="drawWrap"><canvas id="cv"></canvas></div>'+
          (done_>=TIMES
            ? '<button class="btn go wide" id="nx2" style="font-size:19px;padding:16px">\uc798 \uadf8\ub838\uc5b4\uc694! '+
              (pos < order.length-1 ? '\ub2e4\uc74c \ubb38\uc81c \u25b6':'\uacb0\uacfc \ubcf4\uae30 \ud83c\udfc1')+'</button>'
            : '<div class="drawBtns">'+
                '<button class="btn" id="clr">\u21ba \uc9c0\uc6b0\uace0 \ub2e4\uc2dc</button>'+
                '<button class="btn go" id="chk">\u2713 \ub2e4 \uadf8\ub838\uc5b4\uc694</button>'+
              '</div>'+
              '<button class="btn wide" id="skipTrace" style="margin-top:8px;background:#E7EEFB;box-shadow:0 4px 0 #D9CDB3">\u23ed \ub530\ub77c \uadf8\ub9ac\uae30 \uac74\ub108\ub6f0\uae30</button>')+
        '</div>';
      document.getElementById('qback').onclick = function(){ stopAll(); screenQuizList(); };
      if(document.getElementById('skipTrace')) document.getElementById('skipTrace').onclick = function(){ stopAll(); after(); };
      var playW = function(r){ speakWords([it.w], r||RATE, function(){}); };
      document.getElementById('sayW').onclick = function(){ playW(); };
      document.getElementById('slowW').onclick = function(){ playW(0.6); };
      if(document.getElementById('nx2')){
        document.getElementById('nx2').onclick = function(){ stopAll(); after(); };
        return;
      }
      setupCanvas();
      playW();   /* 화면 들어오면 발음 한 번 */
    }

    function setupCanvas(){
      var cv = document.getElementById('cv');
      var wrap = cv.parentNode;
      var W = Math.max(280, wrap.clientWidth || 320), H = 150;
      var DPR = window.devicePixelRatio || 1;
      cv.width = W*DPR; cv.height = H*DPR;
      cv.style.height = H+'px';
      var ctx = cv.getContext('2d');
      ctx.scale(DPR, DPR);

      /* 글자 크기를 폭에 맞춰 정한다 */
      var word = it.w;
      var fs = 96;
      ctx.font = '400 '+fs+'px "Patrick Hand", sans-serif';
      while(ctx.measureText(word).width > W-32 && fs > 26){ fs -= 2; ctx.font = '400 '+fs+'px "Patrick Hand", sans-serif'; }
      var tx = W/2, ty = H/2;

      /* 밑그림(희미한 글자)을 offscreen에 그려서, 어디가 글자 획인지 픽셀로 안다 */
      function drawGhost(){
        ctx.clearRect(0,0,W,H);
        ctx.font = '400 '+fs+'px "Patrick Hand", sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle = '#E8DFCC';
        ctx.fillText(word, tx, ty);
        /* 점선 외곽선으로 획을 더 또렷하게 */
        ctx.save(); ctx.setLineDash([4,4]); ctx.lineWidth=1.5; ctx.strokeStyle='#C2B28E';
        ctx.strokeText(word, tx, ty); ctx.restore();
      }

      /* 글자 영역 마스크 (덮었는지 판정용) */
      var mask = document.createElement('canvas');
      mask.width = W; mask.height = H;
      var mctx = mask.getContext('2d');
      mctx.font = '400 '+fs+'px "Patrick Hand", sans-serif';
      mctx.textAlign='center'; mctx.textBaseline='middle';
      mctx.lineWidth = 14; mctx.strokeStyle='#000'; mctx.fillStyle='#000';
      mctx.strokeText(word, tx, ty); mctx.fillText(word, tx, ty);
      var mdata = mctx.getImageData(0,0,W,H).data;
      /* 글자에 속하는 픽셀 수 세기 (샘플링 간격 4px) */
      var STEP = 4, total = 0, cells = {};
      for(var y=0;y<H;y+=STEP){ for(var x=0;x<W;x+=STEP){
        if(mdata[(y*W+x)*4+3] > 40){ total++; cells[x+'_'+y]=false; }
      }}

      drawGhost();

      /* 사용자가 그린 궤적 */
      var drawing=false, last=null, covered=0;
      ctx.lineCap='round'; ctx.lineJoin='round';

      function pos(e){
        var r = cv.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
      }
      function markCovered(x,y){
        /* 붓 반경 안의 글자 셀을 '덮음'으로 표시 */
        var R=12;
        for(var yy=Math.max(0,y-R); yy<=Math.min(H,y+R); yy+=STEP){
          for(var xx=Math.max(0,x-R); xx<=Math.min(W,x+R); xx+=STEP){
            var gx=Math.round(xx/STEP)*STEP, gy=Math.round(yy/STEP)*STEP;
            var key=gx+'_'+gy;
            if(cells[key]===false){
              var dx=xx-x, dy=yy-y;
              if(dx*dx+dy*dy <= R*R){ cells[key]=true; covered++; }
            }
          }
        }
      }
      function start(e){ e.preventDefault(); drawing=true; last=pos(e);
        ctx.strokeStyle='#2457C5'; ctx.lineWidth=PEN_TRACE; }
      function move(e){
        if(!drawing) return; e.preventDefault();
        var p=pos(e);
        ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
        markCovered(p.x,p.y); last=p;
      }
      function end(e){ if(!drawing) return; drawing=false; }

      cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move);
      window.addEventListener('mouseup',end);
      cv.addEventListener('touchstart',start,{passive:false});
      cv.addEventListener('touchmove',move,{passive:false});
      cv.addEventListener('touchend',end);

      /* "다 그렸어요" — 충분히 덮었으면 1회 인정 */
      var COVER_NEED = 0.55;   /* 글자 획의 55% 이상 덮으면 통과 */
      document.getElementById('chk').onclick = function(){
        var ratio = total ? covered/total : 1;
        if(ratio >= COVER_NEED){
          done_++;
          if(done_ >= TIMES){ starSound(); confetti(16); }
          else beep([620+done_*30],.05);
          setTimeout(draw, 180);
        } else {
          /* 덜 그렸으면 살짝 알려주고 계속 */
          noSound();
          var tip = wrap.previousElementSibling;
          if(tip && tip.classList.contains('drawTip')){
            tip.textContent = '\uc870\uae08 \ub354 \ub530\ub77c \uadf8\ub824\ubcf4\uc138\uc694! ('+Math.round(ratio*100)+'%)';
            tip.style.color = 'var(--berry)';
          }
        }
      };
      document.getElementById('clr').onclick = function(){
        covered=0; for(var k in cells) cells[k]=false; drawGhost();
      };
    }
    draw();
  }

  function next(){
    stopAll();
    pos++;
    if(pos < order.length){ runOne(); return; }
    /* 한 바퀴 끝 — 틀린 것만 모은다 */
    var wrong = order.filter(function(idx){ return results[idx]==='bad'; });
    if(!wrong.length){ pass(); return; }
    roundEnd(wrong);
  }

  /* 한 바퀴 끝, 틀린 게 있으면 섞어서 다시 */
  function roundEnd(wrong){
    app.innerHTML =
      '<div class="result">'+
        '<div class="big">\ud83d\udd01</div>'+
        '<h2>'+round+'\ubc88\uc9f8 \ub05d!</h2>'+
        '<p>'+order.length+'\ubb38\uc81c \uc911 <b>'+(order.length-wrong.length)+'\uac1c</b> \ub9de\ucd94\uace0<br>'+
          '<b style="color:var(--berry-ink)">'+wrong.length+'\uac1c</b>\ub97c \ud2c0\ub838\uc5b4\uc694.</p>'+
        '<div class="card" style="margin-bottom:12px">'+
          wrong.map(function(idx){ return '<span class="misschip">'+esc(q.items[idx].w)+'</span>'; }).join('')+
        '</div>'+
        '<p class="muted">\ud2c0\ub9b0 '+wrong.length+'\uac1c\ub97c <b>\uc21c\uc11c\ub97c \uc11e\uc5b4</b>\uc11c \ub2e4\uc2dc \ub0bc\uac8c\uc694.<br>\ub2e4 \ub9de\ucd94\uba74 \u2b50 '+STAR_PICK_MIN+'~'+STAR_PICK_MAX+'\uac1c \ubf51\uae30!</p>'+
        '<button class="btn primary wide" id="again" style="margin-bottom:10px">\ud83d\udd01 \ud2c0\ub9b0 \uac83\ub9cc \ub2e4\uc2dc!</button>'+
        '<button class="btn go wide" id="lst">\ub098\uc911\uc5d0 \ud560\ub798\uc694</button>'+
      '</div>';
    document.getElementById('again').onclick = function(){
      order = shuffle(wrong.slice());
      results = q.items.map(function(){ return null; });
      pos = 0; round++; beep([700,900],.06); runOne();
    };
    document.getElementById('lst').onclick = screenQuizList;
  }

  /* 다 맞음! — 통과하면 별을 뽑는다 (1~5개 랜덤) */
  function pass(){
    var justGot = null;
    starSound(); confetti(50);
    if(!q.done) pendAdd({key:'quiz:'+q.id, k:'quiz', id:q.id, lo:STAR_PICK_MIN, hi:STAR_PICK_MAX, t:'📝 '+q.title});
    render();
    if(q.done) checkFinal();

    function render(){
      var first = !q.done;
      app.innerHTML =
        '<div class="result">'+
          '<div class="big">\ud83c\udfc6</div>'+
          '<h2>\ub2e8\uc5b4 \ud14c\uc2a4\ud2b8 \ud1b5\uacfc!</h2>'+
          '<p>\u201c'+esc(q.title)+'\u201d<br><b>'+q.items.length+'\ubb38\uc81c\ub97c \ubaa8\ub450 \ub9de\ucd94\uc5c8\uc5b4\uc694!</b><br>'+
            '<span class="muted">'+round+'\ubc88 \ub3c4\uc804 \ub05d\uc5d0 \uc131\uacf5</span></p>'+
          (justGot!==null
            ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6;font-size:20px">'+
                new Array(justGot+1).join('\u2b50')+'<br><b>\ubcc4 '+justGot+'\uac1c</b>\ub97c \ubc1b\uc558\uc5b4\uc694!</div>'
            : (first
              ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6">\u2b50 \ubcc4 <b>'+STAR_PICK_MIN+'~'+STAR_PICK_MAX+'\uac1c</b>\ub97c \ubf51\uc744 \uc218 \uc788\uc5b4\uc694!</div>'+
                '<button class="btn primary wide" id="draw" style="font-size:20px;padding:17px;margin-bottom:10px">\u2b50 \ubcc4 \ubf51\uae30!</button>'
              : '<div class="card" style="margin-bottom:12px">\uc774\ubbf8 \ubcc4 <b>'+(q.stars||STAR_QUIZ)+'\uac1c</b>\ub97c \ubc1b\uc740 \ub2e8\uc5b4\uc7a5\uc774\uc5d0\uc694. \ub2e4\uc2dc \ub9de\ucd98 \uac83\ub3c4 \uba4b\uc838\uc694! \ud83d\udc4f</div>'))+
          ((justGot!==null || !first)
            ? '<button class="btn primary wide" id="again" style="margin-bottom:10px">\ud83d\udd01 \ud55c \ubc88 \ub354</button>'
            : '')+
          '<button class="btn go wide" id="lst">\ud83d\udcdd \ubaa9\ub85d\uc73c\ub85c</button>'+
        '</div>';
      if(document.getElementById('draw')) document.getElementById('draw').onclick = function(){
        modalStarDraw(function(got){
          q.done = true; q.stars = got; pendDone('quiz:'+q.id);
          justGot = got; render(); checkFinal();
        });
      };
      if(document.getElementById('again')) document.getElementById('again').onclick = function(){ startQuiz(q); };
      document.getElementById('lst').onclick = screenQuizList;
    }
  }
}

/* =========================================================
   2-F) 📖 문장 암기 테스트
   아빠가 [영어 문장 + 한글 뜻]을 등록한다.
   ① 배우기 — 문장을 소리로 듣고, 희미한 글자를 손가락으로 SENT_TIMES번 따라 그린다.
   ② 시험  — 한글 뜻만 보고 영어 문장을 빈 화면에 직접 써 본다 → 아빠가 ⭕/❌ 채점.
   전부 통과하면 별 STAR_SENT개.
   ========================================================= */
var STAR_SENT  = 1;    /* 문장 세트를 다 통과하면 받는 별 */
var SENT_TIMES = 5;    /* 문장 하나를 따라 그리는 횟수 — 힘들어하면 이 숫자를 줄이세요 */
var SENT_COVER = 0.5;  /* 따라 그리기 인정 비율 (0.5 = 글자 획의 50%) */
/* 펜 굵기 — 숫자가 작을수록 얇습니다. 손가락으로 또박또박 쓰려면 얇은 게 좋아요. */
var PEN_TRACE = 4;     /* 희미한 글자를 따라 그릴 때 (단어·문장 공통) */
var WRITE_LH = 84;      /* 직접 쓰는 칸의 한 줄(영어 4선 한 묶음 + 줄 사이) 높이(px) */
var WRITE_WPL = 4;      /* 직접 쓰기: 한 줄에 쓸 단어 수 — 줄 수 = 단어 수 ÷ 이 값 (올림) */
var TRACE_FS_MIN = 24;  /* 따라쓰기 글자를 줄일 때 최소 크기(px) */
var PEN_WRITE = 3;     /* 빈 칸에 직접 쓸 때 (문장 시험) */

function sents(){ return PROG.sents || []; }
function sentById(id){ return sents().filter(function(s){ return s.id===id; })[0]; }
function sentStars(){ return sents().reduce(function(a,s){ return a + (s.done ? (s.stars||STAR_SENT) : 0); }, 0); }

/* ===== 미매말 — 그림(사진) 보고 영어 문장 맞히기 =====
   PROG.mimemal = [{id, img(사진 dataURL 또는 ''), en(정답 영어문장), done, stars}]
   순서대로 진행, 맞히면 통과 / 틀리면 5번 따라쓰기, 다 통과하면 별 1~20개 뽑기. */
var MM_TIMES = 5;          /* 틀렸을 때 따라 쓰는 횟수 */
var MM_STAR_MIN = 1;       /* 미매말 다 통과 시 뽑는 별 최소 */
var MM_STAR_MAX = 20;      /* 미매말 다 통과 시 뽑는 별 최대 */
function mimemal(){ return PROG.mimemal || []; }
function mmById(id){ return mimemal().filter(function(m){ return m.id===id; })[0]; }
function mmStars(){ return mimemal().reduce(function(a,m){ return a + (m.done ? (m.stars||0) : 0); }, 0); }
function mmAllDone(){ var a=mimemal(); return a.length>0 && a.every(function(m){ return m.done; }); }


/* 긴 문장을 화면 폭에 맞춰 여러 줄로 나눈다 */
function wrapText(ctx, text, maxW){
  var words = String(text).split(/\s+/), lines = [], cur = '';
  for(var i=0;i<words.length;i++){
    var t = cur ? cur+' '+words[i] : words[i];
    if(cur && ctx.measureText(t).width > maxW){ lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}

/* 문장용 그리기 판.
   ghost=true  → 희미한 글자를 깔고 얼마나 덮었는지 센다 (배우기)
   ghost=false → 연한 줄만 그어주고 자유롭게 쓴다 (시험) */
function makeSentCanvas(cv, text, ghost, minH){
  var wrap = cv.parentNode;
  var W = Math.max(280, wrap.clientWidth || 320);
  var DPR = window.devicePixelRatio || 1;

  /* 3줄 안에 들어오도록 글자 크기를 자동으로 줄인다 */
  var mc = document.createElement('canvas').getContext('2d');
  /* 따라쓰기: 글자를 보여줘야 하니 3줄에 맞게 줄이되 TRACE_FS_MIN 까지만.
     직접 쓰기: 글자를 줄이지 않고 줄 높이를 WRITE_LH 로 고정 — 문장이 길면 칸이 세로로 늘어난다 */
  var fs = 40, lines = [], fsMin = ghost ? TRACE_FS_MIN : 40;
  while(true){
    mc.font = '400 '+fs+'px "Patrick Hand", sans-serif';
    lines = wrapText(mc, text, W-30);
    if(lines.length <= 3 || fs <= fsMin) break;
    fs -= 2;
  }
  if(!lines.length) lines = [String(text)];
  var lh = ghost ? Math.round(fs*1.6) : Math.max(WRITE_LH, Math.round(fs*1.6));
  /* 직접 쓰기 줄 수: 손글씨는 인쇄 글자보다 크니까 단어 수로도 세어 더 많은 쪽 */
  var rows = ghost ? lines.length : Math.max(lines.length, Math.ceil(String(text).split(/\s+/).filter(Boolean).length / WRITE_WPL));
  var H = ghost ? Math.max(minH||150, lines.length*lh + 40) : Math.max(minH||150, rows*lh + 24);

  cv.width = W*DPR; cv.height = H*DPR; cv.style.height = H+'px';
  var ctx = cv.getContext('2d'); ctx.scale(DPR,DPR);
  ctx.lineCap='round'; ctx.lineJoin='round';

  function lineY(i){ return 24 + lh*i + lh/2; }

  function base(){
    ctx.clearRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(ghost){
      ctx.font = '400 '+fs+'px "Patrick Hand", sans-serif';
      ctx.fillStyle = '#E8DFCC';
      lines.forEach(function(ln,i){ ctx.fillText(ln, W/2, lineY(i)); });
      ctx.save(); ctx.setLineDash([4,4]); ctx.lineWidth=1.4; ctx.strokeStyle='#C2B28E';
      lines.forEach(function(ln,i){ ctx.strokeText(ln, W/2, lineY(i)); });
      ctx.restore();
    } else {
      /* 빈 화면 — 영어 공책 4선: 윗줄 · 가운데 점선 · 진한 기준선(빨강) · 아랫줄
         (소문자는 가운데~기준선, 대문자·b·d는 윗줄까지, g·y·p는 아랫줄까지) */
      var gap = Math.round(lh*0.22), band = (lh - gap)/3;
      function hl(y, w, col, dash){
        ctx.setLineDash(dash || []); ctx.lineWidth = w; ctx.strokeStyle = col;
        ctx.beginPath(); ctx.moveTo(14,y); ctx.lineTo(W-14,y); ctx.stroke();
      }
      ctx.save();
      for(var r = 0; r < rows; r++){
        var y0 = 16 + r*lh + gap/2;
        hl(y0,          1.2, '#CDBF9F');
        hl(y0 + band,   1.2, '#CDBF9F', [6,6]);
        hl(y0 + band*2, 2,   '#F08A8A');
        hl(y0 + band*3, 1.2, '#CDBF9F');
      }
      ctx.restore();
    }
  }

  /* 덮었는지 판정용 마스크 (배우기에서만 쓴다) */
  var STEP=4, total=0, cells={}, covered=0;
  if(ghost){
    var mk = document.createElement('canvas'); mk.width=W; mk.height=H;
    var mx = mk.getContext('2d');
    mx.font = '400 '+fs+'px "Patrick Hand", sans-serif';
    mx.textAlign='center'; mx.textBaseline='middle';
    mx.lineWidth = 12; mx.strokeStyle='#000'; mx.fillStyle='#000';
    lines.forEach(function(ln,i){ mx.strokeText(ln, W/2, lineY(i)); mx.fillText(ln, W/2, lineY(i)); });
    var md = mx.getImageData(0,0,W,H).data;
    for(var y=0;y<H;y+=STEP){ for(var x=0;x<W;x+=STEP){
      if(md[(y*W+x)*4+3] > 40){ total++; cells[x+'_'+y]=false; }
    }}
  }

  base();

  var drawing=false, last=null, strokes=[], curS=null;   /* strokes: 한 획 지우기용 기록 */
  function pos(e){
    var r = cv.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
  }
  function mark(x,y){
    if(!ghost) return;
    var R=12;
    for(var yy=Math.max(0,y-R); yy<=Math.min(H,y+R); yy+=STEP){
      for(var xx=Math.max(0,x-R); xx<=Math.min(W,x+R); xx+=STEP){
        var gx=Math.round(xx/STEP)*STEP, gy=Math.round(yy/STEP)*STEP, key=gx+'_'+gy;
        if(cells[key]===false){
          var dx=xx-x, dy=yy-y;
          if(dx*dx+dy*dy <= R*R){ cells[key]=true; covered++; }
        }
      }
    }
  }
  function pen(){ ctx.strokeStyle='#2457C5'; ctx.lineWidth = ghost ? PEN_TRACE : PEN_WRITE; }
  function down(e){ e.preventDefault(); drawing=true; last=pos(e); curS=[last]; strokes.push(curS); pen(); }
  function move(e){
    if(!drawing) return; e.preventDefault();
    var p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    mark(p.x,p.y); last=p; if(curS) curS.push(p);
  }
  function up(){ drawing=false; }
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',up);

  return {
    clear: function(){ strokes=[]; covered=0; for(var k in cells) cells[k]=false; base(); },
    undo: function(){   /* 마지막 한 획만 지우고 나머지는 다시 그린다 */
      if(!strokes.length) return false;
      strokes.pop(); covered=0; for(var k in cells) cells[k]=false; base(); pen();
      strokes.forEach(function(st){
        for(var j=1;j<st.length;j++){ ctx.beginPath(); ctx.moveTo(st[j-1].x,st[j-1].y); ctx.lineTo(st[j].x,st[j].y); ctx.stroke(); }
        st.forEach(function(q){ mark(q.x,q.y); });
      });
      return true;
    },
    strokes: function(){ return strokes.length; },
    ratio: function(){ return total ? covered/total : 1; }
  };
}

/* --- 문장 만들기 / 고치기 (아빠가 직접 입력) --- */
function screenSentEdit(s){
  var editing = !!s;
  var title = s ? s.title : '';
  var rows = s ? s.items.map(function(it){ return {en:it.en, ko:it.ko}; })
               : [ {en:'',ko:''}, {en:'',ko:''}, {en:'',ko:''} ];
  function draw(){
    app.innerHTML =
      '<div class="topbar"><button class="iconbtn" id="back">←</button>'+
        '<h2>'+(editing?'✏️ 문장 고치기':'➕ 문장 만들기')+'</h2>'+
        '<div style="width:44px"></div></div>'+
      '<div class="card frm">'+
        '<div class="qlab">이름</div>'+
        '<input id="st" placeholder="예: 3학년 1단원 문장" value="'+esc(title)+'">'+
      '</div>'+
      '<button class="btn wide" id="scan" style="margin-bottom:12px;background:#E8F7EE;box-shadow:0 4px 0 #B7E4C7">📷 사진·PDF로 자동 입력</button>'+
      '<div class="sechd">문장 목록 <span style="font-size:12px">· 영어 문장 + 한글 뜻</span></div>'+
      '<div id="rows"></div>'+
      '<button class="btn wide" id="addrow" style="margin-bottom:14px">➕ 문장 한 줄 추가</button>'+
      '<button class="btn primary wide" id="save" style="font-size:18px">💾 저장하기</button>'+
      (editing ? '<button class="btn wide no" id="del" style="margin-top:9px;background:#FFE4E6;color:#9F1239;box-shadow:0 6px 0 #FDA4AF">🗑 이 문장 묶음 지우기</button>' : '')+
      '<div class="muted" style="text-align:center;margin-top:10px;line-height:1.6">'+
        '너무 길면 따라 그리기가 힘들어요. <b>한 줄 정도</b>가 좋아요.<br>'+
        '예: <b>I go to school every day</b> → 나는 매일 학교에 가요</div>';
    document.getElementById('rows').innerHTML = rows.map(function(r,i){
      return '<div class="card frm" style="margin-bottom:10px">'+
        '<div class="qlab">'+(i+1)+'. 영어 문장</div>'+
        '<input class="ren" data-i="'+i+'" placeholder="I go to school every day" value="'+esc(r.en)+'">'+
        '<div class="qlab" style="margin-top:8px">한글 뜻</div>'+
        '<input class="rko" data-i="'+i+'" placeholder="나는 매일 학교에 가요" value="'+esc(r.ko)+'">'+
        (rows.length>1 ? '<button class="btn wide" data-del="'+i+'" style="margin-top:8px">🗑 이 줄 지우기</button>' : '')+
      '</div>';
    }).join('');
    function collect(){
      title = document.getElementById('st').value.trim();
      Array.prototype.forEach.call(document.querySelectorAll('.ren'), function(el){ rows[+el.dataset.i].en = el.value; });
      Array.prototype.forEach.call(document.querySelectorAll('.rko'), function(el){ rows[+el.dataset.i].ko = el.value; });
    }
    document.getElementById('back').onclick = function(){ screenSentList(); };
    document.getElementById('addrow').onclick = function(){ collect(); rows.push({en:'',ko:''}); draw(); };
    document.getElementById('scan').onclick = function(){
      collect();
      scanImages('sent', function(d){
        var got = (d.items||[]).map(function(x){ return {en:String(x.en||'').trim(), ko:String(x.ko||'').trim()}; })
                               .filter(function(x){ return x.en; });
        if(!got.length){ noSound(); alert('사진에서 영어 문장을 찾지 못했어요. 더 또렷한 사진으로 해보세요.'); return; }
        rows = rows.filter(function(r){ return String(r.en||'').trim() || String(r.ko||'').trim(); }).concat(got);
        if(!String(title||'').trim() && d.title) title = String(d.title).trim();
        okSound(); draw();
        setTimeout(function(){ alert('✅ 문장 '+got.length+'개를 읽고 한글 뜻까지 채웠어요.\n해석이 어색하면 고친 뒤 「저장하기」를 눌러 주세요.'); }, 60);
      });
    };
    on('[data-del]', function(){ collect(); rows.splice(+this.dataset.del,1); draw(); });
    document.getElementById('save').onclick = function(){
      collect();
      var items = rows.filter(function(r){ return String(r.en).trim() && String(r.ko).trim(); })
                      .map(function(r){ return {en:String(r.en).trim(), ko:String(r.ko).trim()}; });
      if(!items.length){ noSound(); toast('문장을 넣어주세요'); return; }
      if(!PROG.sents) PROG.sents = [];
      if(editing){ s.title = title || '문장 암기'; s.items = items; }
      else PROG.sents.push({id:'s'+Date.now(), title:title||'문장 암기', items:items, done:false});
      saveProgress(); okSound(); toast('💾'); screenSentList();
    };
    if(document.getElementById('del')) document.getElementById('del').onclick = function(){
      PROG.sents = sents().filter(function(x){ return x.id!==s.id; });
      saveProgress(); toast('🗑'); screenSentList();
    };
  }
  draw();
}

/* --- 문장 암기 시험 진행 --- */
function startSent(s){
  var order = shuffle(s.items.map(function(_,i){ return i; }));
  var pos = 0, round = 1, results = order.map(function(){ return null; });
  learn();

  function head(sub){
    return '<div class="topbar">'+
        '<button class="iconbtn" id="sback">←</button>'+
        '<h2>'+sub+'</h2>'+
        '<div class="pill">'+(pos+1)+'/'+order.length+'</div>'+
      '</div>';
  }
  function backBind(){ document.getElementById('sback').onclick = function(){ stopAll(); screenSentList(); }; }
  function cur(){ return s.items[order[pos]]; }
  function say(r){ speakWords(cur().en.split(/\s+/), r||RATE, function(){}); }

  /* ① 배우기 — 듣고 SENT_TIMES번 따라 그리기 */
  function learn(){
    var n = 0, pad = null;
    function draw(){
      app.innerHTML = head('✏️ 따라 그리기') +
        '<div class="card" style="text-align:center">'+
          '<div class="traceBig">문장을 듣고 <b>'+SENT_TIMES+'번</b> 따라 그려요! '+
            '<span style="color:var(--grape)">('+n+'/'+SENT_TIMES+')</span></div>'+
          '<div class="sentEn">'+esc(cur().en)+'</div>'+
          '<div class="ak">'+esc(cur().ko)+'</div>'+
          '<div class="row" style="justify-content:center">'+
            '<button class="btn primary" id="say">🔊 듣기</button>'+
            '<button class="btn" id="slow">🐢</button>'+
          '</div>'+
          '<div class="traceCount">'+ (function(){
            var o='';
            for(var k=1;k<=SENT_TIMES;k++){
              var cls = k<=n ? 'done' : (k===n+1 ? 'now' : '');
              o += '<div class="tc '+cls+'">'+(k<=n?'✓':k)+'</div>';
            }
            return o;
          })() +'</div>'+
          '<div class="drawTip" id="tip">'+(n>=SENT_TIMES
            ? '🎉 다 그렸어요! 이제 시험이에요.'
            : '희미한 글자 위를 손가락으로 덮어 그려요')+'</div>'+
          '<div class="drawWrap"><canvas id="cv"></canvas></div>'+
          (n>=SENT_TIMES
            ? '<button class="btn go wide" id="go" style="font-size:19px;padding:16px">✍️ 이제 시험 볼래요!</button>'
            : '<div class="drawBtns">'+
                '<button class="btn" id="clr">↺ 지우고 다시</button>'+
                '<button class="btn go" id="chk">✓ 다 그렸어요</button>'+
              '</div>')+
        '</div>';
      backBind();
      document.getElementById('say').onclick = function(){ say(); };
      document.getElementById('slow').onclick = function(){ say(0.6); };
      pad = makeSentCanvas(document.getElementById('cv'), cur().en, true);
      if(n >= SENT_TIMES){
        document.getElementById('go').onclick = function(){ stopAll(); test(); };
        return;
      }
      document.getElementById('clr').onclick = function(){ pad.clear(); };
      document.getElementById('chk').onclick = function(){
        var r = pad.ratio();
        if(r >= SENT_COVER){
          n++;
          if(n>=SENT_TIMES){ starSound(); confetti(14); } else beep([620+n*25],.05);
          setTimeout(draw, 180);
        } else {
          noSound();
          var tip = document.getElementById('tip');
          if(tip){ tip.textContent = '조금 더 따라 그려보세요! ('+Math.round(r*100)+'%)'; tip.style.color='var(--berry)'; }
        }
      };
      say();
    }
    draw();
  }

  /* ② 시험 — 뜻만 보고 직접 쓰기, 아빠가 채점 */
  function test(){
    var shown = false, pad = null;
    function draw(){
      app.innerHTML = head('✍️ 문장 쓰기') +
        '<div class="card" style="text-align:center">'+
          '<div class="traceBig">뜻을 보고 <b>영어 문장</b>을 써 보세요!</div>'+
          '<div class="sentKo">'+esc(cur().ko)+'</div>'+
          (shown ? '<div class="sentHint">'+esc(cur().en)+'</div>' : '')+
          '<div class="drawTip">손가락으로 또박또박 써요</div>'+
          '<div class="drawWrap"><canvas id="cv"></canvas></div>'+
          '<div class="drawBtns">'+
            '<button class="btn" id="clr">↺ 지우고 다시</button>'+
            '<button class="btn" id="peek">'+(shown?'🔊 정답 듣기':'👁 정답 보기')+'</button>'+
          '</div>'+
          '<div class="sechd" style="margin-top:14px">👨 아빠가 채점해주세요</div>'+
          '<div class="judge2">'+
            '<button class="btn no" id="bad">❌ 다시</button>'+
            '<button class="btn go" id="ok">⭕ 통과</button>'+
          '</div>'+
        '</div>';
      backBind();
      pad = makeSentCanvas(document.getElementById('cv'), cur().en, false);
      document.getElementById('clr').onclick = function(){ pad.clear(); };
      document.getElementById('peek').onclick = function(){
        if(!shown){ shown = true; draw(); }
        else say();
      };
      document.getElementById('ok').onclick = function(){
        okSound(); toast('⭕'); results[pos]='ok'; next();
      };
      document.getElementById('bad').onclick = function(){
        beep([300],.1); results[pos]='bad'; next();
      };
    }
    draw();
  }

  function next(){
    stopAll();
    pos++;
    if(pos < order.length){ learn(); return; }
    var wrong = order.filter(function(_,k){ return results[k]==='bad'; });
    if(wrong.length) roundEnd(wrong); else pass();
  }

  /* 한 바퀴 끝 — 못 외운 게 있으면 섞어서 다시 */
  function roundEnd(wrong){
    app.innerHTML =
      '<div class="result">'+
        '<div class="big">🔁</div>'+
        '<h2>'+round+'번째 끝!</h2>'+
        '<p>'+order.length+'문장 중 <b>'+(order.length-wrong.length)+'개</b> 통과<br>'+
          '<b style="color:var(--berry-ink)">'+wrong.length+'개</b>를 다시 해요.</p>'+
        '<div class="card" style="margin-bottom:12px">'+
          wrong.map(function(idx){ return '<span class="misschip">'+esc(s.items[idx].ko)+'</span>'; }).join('')+
        '</div>'+
        '<p class="muted">못 외운 문장을 <b>다시 따라 그리고</b> 시험 봐요.<br>다 통과하면 ⭐ '+STAR_PICK_MIN+'~'+STAR_PICK_MAX+'개를 뽑아요!</p>'+
        '<button class="btn primary wide" id="again" style="margin-bottom:10px">🔁 못 외운 것만 다시!</button>'+
        '<button class="btn go wide" id="lst">나중에 할래요</button>'+
      '</div>';
    document.getElementById('again').onclick = function(){
      order = shuffle(wrong.slice());
      results = order.map(function(){ return null; });
      pos = 0; round++; beep([700,900],.06); learn();
    };
    document.getElementById('lst').onclick = screenSentList;
  }

  /* 다 통과! — 별을 뽑는다 (1~5개 랜덤) */
  function pass(){
    var justGot = null;
    starSound(); confetti(50);

/* 사진 축소 → dataURL (저장 용량 절약) */
function shrinkImage(file, maxSide, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var im = new Image();
    im.onload = function(){
      var w = im.width, h = im.height, sc = Math.min(1, maxSide/Math.max(w,h));
      var cw = Math.round(w*sc), ch = Math.round(h*sc);
      var cv = document.createElement('canvas'); cv.width=cw; cv.height=ch;
      cv.getContext('2d').drawImage(im, 0, 0, cw, ch);
      try{ cb(cv.toDataURL('image/jpeg', quality)); }
      catch(err){ cb(e.target.result); }
    };
    im.onerror = function(){ cb(e.target.result); };
    im.src = e.target.result;
  };
  reader.onerror = function(){ cb(''); };
  reader.readAsDataURL(file);
}

/* ══════════════════════════════════════════════════════
   📷 사진·PDF로 자동 입력 (단어장 · 읽을 책 · 문장) — PDF는 쪽마다 그림으로 바꿔 같은 방식으로 읽는다
   사진 → (축소) → 앱스스크립트 ocr → AI가 읽은 결과를 입력칸에 채워준다.
   조절 상수: SCAN_MAX_IMAGES(AI 한 번에 보내는 장수) · SCAN_TOTAL_MAX(한 번에 고르는 최대 장수) · SCAN_SIDE(긴 변 픽셀) · SCAN_QUALITY(JPEG 품질) · SCAN_TIMEOUT(초)
   ══════════════════════════════════════════════════════ */
var SCAN_MAX_IMAGES = 10;   /* AI에게 한 번에 보내는 장수 — 더 많이 고르면 10장씩 자동으로 나눠 읽는다 */
var SCAN_TOTAL_MAX = 60;    /* 한 번에 읽는 최대 장수 — PDF는 1쪽 = 1장 (더 있으면 나눠서 다시 「사진·PDF 추가」) */
var SCAN_SIDE = 1500, SCAN_QUALITY = 0.75, SCAN_TIMEOUT = 150;
function scanErrMsg(j){
  if(!j) return '서버에 연결하지 못했어요. 인터넷과 앱스스크립트 배포(새 버전)를 확인해 주세요.';
  var e = String(j.error||'');
  if(e === 'NO_KEY') return '아직 AI 키가 설정되지 않았어요.\n앱스스크립트에서 setGeminiKey 함수에 키를 넣고 한 번 실행한 뒤, 새 버전으로 배포해 주세요.';
  if(e === 'BAD_PIN') return '서버 비밀번호(OCR_PIN)가 맞지 않아요.';
  if(/^BUSY|HTTP 5\d\d|HTTP 429/.test(e)) return '구글 AI가 지금 붐벼서 읽지 못했어요.\n잠시(1~2분) 뒤에 다시 눌러 주세요.';
  if(e === 'DAILY_LIMIT') return '오늘 사진 읽기 횟수를 모두 썼어요. 내일 다시 하거나 Code.gs의 OCR_DAILY_MAX를 올려 주세요.';
  if(e === 'UNKNOWN_ACTION') return '서버에 이 기능이 아직 배포되지 않았어요.\nCode.gs를 새 버전으로 다시 배포해 주세요.';
  return '읽지 못했어요: '+(e||'알 수 없는 오류').slice(0,160);
}
/* 고른 파일 → 읽을 '장' 목록. 이미지는 1장, PDF는 쪽마다 1장으로 펼친다 */
function scanExpand(files, onMsg, cb){
  var out = [], i = 0;
  (function next(){
    if(out.length >= SCAN_TOTAL_MAX || i >= files.length) return cb(out.slice(0, SCAN_TOTAL_MAX), null);
    var f = files[i++];
    if(!/pdf$/i.test(f.type || '') && !/\.pdf$/i.test(f.name || '')){ out.push({file:f}); return next(); }
    onMsg('PDF 여는 중… ('+(f.name||'PDF')+')');
    loadPdfJs(function(lib, err){
      if(!lib) return cb(out, err);
      var rd = new FileReader();
      rd.onerror = function(){ cb(out, 'PDF 파일을 열지 못했어요.'); };
      rd.onload = function(){
        lib.getDocument({data: new Uint8Array(rd.result)}).promise.then(function(pdf){
          for(var n = 1; n <= pdf.numPages; n++) out.push({pdf:pdf, n:n, name:f.name});
          next();
        }, function(){ cb(out, 'PDF 파일을 열지 못했어요. (암호가 걸렸거나 깨진 파일일 수 있어요)'); });
      };
      rd.readAsArrayBuffer(f);
    });
  })();
}
/* 한 장 → JPEG base64 (사진은 줄이고, PDF 쪽은 그려서) */
function scanPrep(src, cb){
  if(src.file) return shrinkImage(src.file, SCAN_SIDE, SCAN_QUALITY, function(url){
    var m = /^data:image\/jpeg;base64,(.+)$/.exec(url||''); cb(m ? m[1] : null);
  });
  origRenderPage(src.pdf, src.n, SCAN_SIDE, function(cv){
    if(!cv) return cb(null);
    try{ var m = /^data:image\/jpeg;base64,(.+)$/.exec(cv.toDataURL('image/jpeg', SCAN_QUALITY)); cb(m ? m[1] : null); }catch(e){ cb(null); }
  });
}
function scanImages(kind, onResult){
  var inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*,application/pdf,.pdf'; inp.multiple=true; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange = function(){
    var picked = Array.prototype.slice.call(inp.files||[]);
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(!picked.length) return;

    var cancelled = false, timer = null, files = [], batches = [];
    var acc = {title:'', by:'', items:[], pages:[]}, doneN = 0;
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(30,20,60,.72);display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML = '<div style="background:#fff;border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center">'+
      '<div style="font-size:46px">🔍</div>'+
      '<div id="scanMsg" style="font-size:18px;font-weight:800;margin:8px 0 4px">파일을 준비하고 있어요…</div>'+
      '<div id="scanSub" style="font-size:13px;color:#666;line-height:1.5">화면을 닫지 말고 기다려 주세요.</div>'+
      '<button class="btn" id="scanCancel" style="margin-top:16px">✖ 취소</button></div>';
    document.body.appendChild(ov);
    function close(){ cancelled = true; clearTimeout(timer); if(ov.parentNode) ov.parentNode.removeChild(ov); }
    document.getElementById('scanCancel').onclick = function(){
      var had = doneN > 0;
      close();
      if(had && confirm('여기까지 읽은 '+doneN+'묶음은 입력칸에 넣을까요?')) onResult(acc);
    };
    function setMsg(t){ var m=document.getElementById('scanMsg'); if(m) m.textContent=t; }
    function tag(bi){ return batches.length>1 ? ' ('+(bi+1)+'/'+batches.length+'묶음)' : ''; }
    function fail(msg, bi){
      if(cancelled) return;
      close(); noSound();
      if(doneN > 0){
        /* 앞 묶음은 살리고, 실패한 장 번호를 알려준다 */
        onResult(acc);
        var from = bi*SCAN_MAX_IMAGES+1, to = files.length;
        setTimeout(function(){ alert(msg+'\n\n앞의 '+(from-1)+'장은 입력됐어요. '+from+'~'+to+'번째 장만 「사진·PDF 추가」로 다시 넣어 주세요.'); }, 80);
      } else alert(msg);
    }

    scanExpand(picked, setMsg, function(list, err){
      if(cancelled) return;
      if(!list.length) return fail(err || '읽을 사진이나 PDF가 없어요.', 0);
      files = list;
      for(var b0=0; b0<files.length; b0+=SCAN_MAX_IMAGES) batches.push(files.slice(b0, b0+SCAN_MAX_IMAGES));
      var sub = document.getElementById('scanSub');
      if(sub) sub.innerHTML = files.length+'장'+(batches.length>1?' · '+SCAN_MAX_IMAGES+'장씩 '+batches.length+'번에 나눠 읽어요':'')+
        '<br>한 묶음에 10~40초 걸려요. 화면을 닫지 말고 기다려 주세요.'+
        (files.length >= SCAN_TOTAL_MAX ? '<br><b>한 번에 '+SCAN_TOTAL_MAX+'장까지만 읽어요. 나머지는 끝난 뒤 이어서 넣어 주세요.</b>' : '')+
        (err ? '<br><b>'+esc(err)+'</b>' : '');
      runBatch(0);
    });

    function runBatch(bi){
      if(cancelled) return;
      if(bi >= batches.length){ close(); onResult(acc); return; }
      var fs = batches[bi], out = [];
      (function next(i){
        if(cancelled) return;
        if(i >= fs.length) return send();
        setMsg((fs[i].pdf ? 'PDF 쪽 준비 ' : '사진 준비 ')+(bi*SCAN_MAX_IMAGES+i+1)+'/'+files.length);
        scanPrep(fs[i], function(b64){ if(b64) out.push(b64); next(i+1); });   /* 못 여는 장은 건너뛴다 */
      })(0);
      function send(){
        if(!out.length){
          if(batches.length===1) return fail('파일을 열 수 없어요. 다른 사진(JPG/PNG)이나 PDF로 해보세요.', bi);
          return runBatch(bi+1);
        }
        setMsg('AI가 글자를 읽는 중…'+tag(bi));
        clearTimeout(timer);
        timer = setTimeout(function(){ fail('시간이 너무 오래 걸려요. 장수를 줄여서 다시 해보세요.', bi); }, SCAN_TIMEOUT*1000);
        apiPost({action:'ocr', kind:kind, pin:DAD_PIN, images:out}, function(j){
          if(cancelled) return;
          clearTimeout(timer);
          if(!j || j.error || !j.ok || !j.data) return fail(scanErrMsg(j), bi);
          var d = j.data;
          /* AI가 가끔 쪽마다 {title, items/pages}를 따로 만들어 배열로 보내면 서버가 {items:[{…},{…}]}로 넘긴다 → 하나로 합친다 */
          if(d.items && d.items.length && d.items.some(function(x){ return x && (Array.isArray(x.items) || Array.isArray(x.pages)); })){
            var w = d.items; d = {title: d.title || '', by: d.by || '', pages: (d.pages || []).slice(), items: []};
            w.forEach(function(x){
              if(!x) return;
              if(!d.title && x.title) d.title = x.title;
              if(!d.by && x.by) d.by = x.by;
              if(Array.isArray(x.items)) d.items = d.items.concat(x.items);
              else if(Array.isArray(x.pages)) d.pages = d.pages.concat(x.pages);
              else if(x.en || x.word) d.items.push(x);
            });
          }
          if(!acc.title && d.title) acc.title = d.title;
          if(!acc.by && d.by) acc.by = d.by;
          if(d.items && d.items.length) acc.items = acc.items.concat(d.items);
          if(d.pages && d.pages.length) acc.pages = acc.pages.concat(d.pages);
          doneN++;
          runBatch(bi+1);
        });
      }
    }
  };
  inp.click();
}

/* ── 쪽 목록 (읽을 책 추가 · 책 문장 넣기 공용) — ▲▼ 순서 바꾸기 / 🗑 지우기 ── */
function pageRowsHtml(lines){
  var n = lines.length;
  return lines.map(function(ln,i){
    return '<div class="card frm" style="margin-bottom:8px;padding:10px">'+

        '<div class="qlab" style="margin:0;flex:0 0 auto;min-width:38px">'+(i+1)+'쪽</div>'+

/* collect(): 입력값을 lines에 반영, rerender(): 다시 그리기 */
function bindPageRows(lines, collect, rerender){
  on('[data-up]', function(){ var i=+this.dataset.up; if(i<=0) return; collect(); var t=lines[i-1]; lines[i-1]=lines[i]; lines[i]=t; rerender(); });
  on('[data-dn]', function(){ var i=+this.dataset.dn; if(i>=lines.length-1) return; collect(); var t=lines[i+1]; lines[i+1]=lines[i]; lines[i]=t; rerender(); });
  on('[data-delpg]', function(){ collect(); lines.splice(+this.dataset.delpg, 1); if(!lines.length) lines.push(''); rerender(); });
}
/* 사진으로 읽은 쪽들을 lines 뒤에 이어 붙인다. 배열을 제자리에서 바꾼다 */

/* 새로 붙은 첫 쪽으로 화면을 내려준다 */
function scrollToPage(i){

function mergeScannedPages(lines, got){
  /* 이미 쓴 쪽은 그대로 두고 그 뒤에 이어 붙인다 (끝의 빈 칸만 걷어낸다) */
  var base = lines.slice();
  while(base.length && !String(base[base.length-1]||'').trim()) base.pop();
  var res = base.concat(got);
  lines.length = 0;
  Array.prototype.push.apply(lines, res.length ? res : ['']);
  return base.length;   /* 새로 들어간 첫 쪽 앞의 쪽 수 */
}

/* 미매말 시험 진행 — 순서대로, 맞히면 통과 / 틀리면 5번 따라쓰기 */

  var list = mimemal();

  /* ① 그림 보고 문장 쓰기 (아빠 채점) */

          '<div class="drawWrap big"><canvas id="cv"></canvas></div>'+
          '<div class="drawBtns">'+
            '<button class="btn" id="clr">↺ 지우고 다시</button>'+
            '<button class="btn" id="peek">'+(shown?'🔊 정답 듣기':'👁 정답 보기')+'</button>'+
          '</div>'+
          '<div class="sechd" style="margin-top:14px">👨 아빠가 채점해주세요</div>'+
          '<div class="judge2">'+

      };
      document.getElementById('ok').onclick = function(){ okSound(); toast('⭕'); results[pos]='ok'; next(); };
      document.getElementById('bad').onclick = function(){ beep([300],.1); trace(); };
    }
    draw();
  }

  /* 틀림 → 정답을 MM_TIMES번 따라 쓰기 */
  function trace(){
    var n = 0, pad = null;
    function draw(){
      var m = cur();
      app.innerHTML = head('✏️ 따라 쓰기') +
        '<div class="card" style="text-align:center">'+
          '<div class="traceBig">정답을 <b>'+MM_TIMES+'번</b> 따라 써요! '+

          '</div>'+

            var o=''; for(var k=1;k<=MM_TIMES;k++){ var cls=k<=n?'done':(k===n+1?'now':''); o+='<div class="tc '+cls+'">'+(k<=n?'✓':k)+'</div>'; } return o;
          })() +'</div>'+

      document.getElementById('chk').onclick = function(){

  /* 끝 — 모두 통과했으면 별 1~20 뽑기 */
  function finish(){
    var allOk = results.every(function(r){ return r==='ok'; });
    starSound(); confetti(50);
    var mmKey = 'mm:'+list.map(function(m){ return m.id; }).join(',');
    if(allOk) pendAdd({key:mmKey, k:'mm', ids:list.map(function(m){ return m.id; }), lo:MM_STAR_MIN, hi:MM_STAR_MAX, t:'📷 미매말'});

                  '<button class="btn primary wide" id="draw" style="font-size:20px;padding:17px;margin-bottom:10px">⭐ 별 뽑기!</button>')
            : '<div class="card" style="margin-bottom:12px">모든 문제를 <b>한 번에</b> 맞히면 별을 뽑을 수 있어요. 다시 도전해봐요!</div>')+
          '<button class="btn primary wide" id="again" style="margin-bottom:10px">🔁 한 번 더</button>'+
          '<button class="btn go wide" id="lst">📷 목록으로</button>'+
        '</div>';
      if(document.getElementById('draw')) document.getElementById('draw').onclick = function(){
        modalStarDraw(function(got){
          /* 통과 표시 + 별 저장 (문제별로 나눠 저장) */
          var per = Math.floor(got/list.length), rem = got - per*list.length;
          list.forEach(function(m,i){ m.done = true; m.stars = per + (i<rem?1:0); });
          pendDone(mmKey);
          justGot = got; render(); checkFinal();
        }, MM_STAR_MIN, MM_STAR_MAX);
      };
      document.getElementById('again').onclick = function(){ beep([700,900],.06); startMimemal(); };
      document.getElementById('lst').onclick = screenMimemal;
    }
  }

  ask();
}

/* =========================================================
   원서 테스트 — 원서(그림책) PDF 의 그림만 보고 영어 문장 쓰기
   PROG.orig = [{id, e, t, items:[{id,en,ko}], done, stars, at}]
   · 그림은 진도(PROG)에 넣지 않는다(용량). 서버(구글 드라이브, Code.gs imgPut/imgGet)가 원본이고 이 기기 IndexedDB 는 사본이다 (키 'o_세트id_문제id').
   · 시험 규칙은 스페셜 테스트와 같다: 아빠가 ⭕/❌ → ❌면 같은 문제를 다시 / 다 통과하면 별 뽑기
     (첫 통과 1~STAR_ORIG개, 다시 도전 STAR_ORIG_RE_LO~STAR_ORIG_RE_HI개를 기존 별에 합산).
   · 등록: PDF → 쪽마다 그림을 렌더 → AI(Code.gs ocr kind=orig)가 그림 위치·영어 문장·한글 해석을 읽음
     → 그림 위치는 화면 픽셀로 한 번 더 보정해서 그림만 잘라냄.
   조절 상수는 아래 ORIG_* / STAR_ORIG* 한 곳에 모아 두었다.
   ========================================================= */
var STAR_ORIG = 10;            /* 첫 통과 때 뽑는 별 최대 (스페셜과 같음) */
var STAR_ORIG_RE_LO = 1;       /* 다시 도전 별 최소 */
var STAR_ORIG_RE_HI = 3;       /* 다시 도전 별 최대 */
var ORIG_PAGES_PER_CALL = 5;   /* AI 한 번에 보내는 쪽 수 */
var ORIG_PDF_MAX_PAGES = 60;   /* PDF 한 번에 읽는 최대 쪽 수 (넘으면 몇 쪽부터인지 물어봄) */
var ORIG_RENDER_SIDE = 1400;   /* 쪽을 그릴 때 긴 변 픽셀 */
var ORIG_IMG_SIDE = 800;       /* 저장하는 그림의 긴 변 픽셀 */
var ORIG_IMG_QUALITY = 0.72;   /* 저장하는 그림의 JPEG 품질 */
var ORIG_PAGE_SIDE = 1100;     /* 그림 영역 조절용 쪽 사진의 긴 변 */
var ORIG_AI_QUALITY = 0.75;    /* AI에게 보내는 쪽 사진 품질 */
var ORIG_TIMEOUT = 150;
var ORIG_UNDO_MS = 3000;      /* ⭕ 누른 뒤 '↩ 취소'를 할 수 있는 시간(ms) — 아빠가 폰을 돌려주는 사이에도 남도록 */        /* AI 한 묶음 최대 기다림(초) */
var PDFJS_SRCS = [
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'
];

function origList(){ return PROG.orig || []; }
function origById(id){ return origList().filter(function(s){ return s.id===id; })[0]; }
function origStars(){ return origList().reduce(function(a,s){ return a + (s.done ? (s.stars||STAR_ORIG) : 0); }, 0); }
function origKey(setId, itemId){ return 'o_'+setId+'_'+itemId; }
function origNewId(){ return 'i'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36); }

/* ── 그림 저장소 (이 기기 IndexedDB) ── */
var ORIG_DB = null, ORIG_MEM = {};
function origDb(cb){
  if(ORIG_DB) return cb(ORIG_DB);
  if(ORIG_DB === false) return cb(null);
  try{
    var rq = indexedDB.open('hajun_orig', 1);
    rq.onupgradeneeded = function(){ try{ rq.result.createObjectStore('img'); }catch(e){} };
    rq.onsuccess = function(){ ORIG_DB = rq.result; cb(ORIG_DB); };
    rq.onerror = rq.onblocked = function(){ ORIG_DB = false; cb(null); };
  }catch(e){ ORIG_DB = false; cb(null); }
}
function origImgPut(key, url, cb){
  ORIG_MEM[key] = url;
  origDb(function(db){
    if(!db) return cb && cb(false);
    try{
      var tx = db.transaction('img','readwrite');
      tx.objectStore('img').put(url, key);
      tx.oncomplete = function(){ cb && cb(true); };
      tx.onerror = tx.onabort = function(){ cb && cb(false); };
    }catch(e){ cb && cb(false); }
  });
}
function origImgGet(key, cb){
  if(ORIG_MEM[key]) return cb(ORIG_MEM[key]);
  origDb(function(db){
    if(!db) return cb('');
    try{
      var rq = db.transaction('img','readonly').objectStore('img').get(key);
      rq.onsuccess = function(){ var v = rq.result || ''; if(v) ORIG_MEM[key] = v; cb(v); };
      rq.onerror = function(){ cb(''); };
    }catch(e){ cb(''); }
  });
}
function origImgDel(keys, cb){
  keys.forEach(function(k){ delete ORIG_MEM[k]; });
  if(!keys.length) return cb && cb();
  origDb(function(db){
    if(!db) return cb && cb();
    try{
      var tx = db.transaction('img','readwrite'), os = tx.objectStore('img');
      keys.forEach(function(k){ os.delete(k); });
      tx.oncomplete = tx.onerror = tx.onabort = function(){ cb && cb(); };
    }catch(e){ cb && cb(); }
  });
}
/* ── 그림 서버 저장 (구글 드라이브, Code.gs 의 imgPut/imgGet/imgDel) ──
   서버가 원본이고, 이 기기의 IndexedDB 는 빨리 보여주기 위한 사본이다.
   그래서 아빠가 올린 그림이 다른 기기에서도 보인다. */
function origErrMsg(j){
  var e = String((j && j.error) || '');
  if(!j) return '서버에 연결하지 못했어요. 인터넷을 확인해 주세요.';
  if(e === 'UNKNOWN_ACTION') return '서버에 그림 저장 기능이 아직 배포되지 않았어요.\nCode.gs를 새 버전으로 다시 배포해 주세요.';
  if(/^DRIVE/.test(e)) return '구글 드라이브에 저장하지 못했어요.\n앱스스크립트 편집기에서 authorizeDrive 함수를 한 번 실행해 권한을 허용하고, 새 버전으로 다시 배포해 주세요.\n('+e.slice(6,120)+')';
  if(e === 'BAD_PIN') return '서버 비밀번호(OCR_PIN)가 맞지 않아요.';
  if(e === 'BAD_IMAGE') return '그림이 너무 크거나 비어 있어요.';
  return '서버 저장 오류: '+(e||'알 수 없음').slice(0,120);
}
function origSrvPut(key, url, cb){
  if(!hasServer) return cb({error:'NO_SERVER'});

function origSrvGet(keys, cb){

}
function origSrvDel(keys, cb){

/* ── 원서 추가/고치기 초안 — 중간에 끊겨도(전화·새로고침) AI가 읽은 결과와 쓴 문장을 잃지 않게 이 기기에 둔다 ── */
function origDraftPut(key, obj){
  origDb(function(db){ if(!db) return; try{ db.transaction('img','readwrite').objectStore('img').put(obj, key); }catch(e){} });
}
function origDraftGet(key, cb){
  origDb(function(db){
    if(!db) return cb(null);
    try{
      var rq = db.transaction('img','readonly').objectStore('img').get(key);
      rq.onsuccess = function(){ var v = rq.result; cb(v && typeof v === 'object' && v.items ? v : null); };
      rq.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function origDraftDel(key){

}
/* 세트의 그림을 모두 불러와 {문제id: dataURL} 로 돌려준다 — 이 기기에 없으면 서버에서 받아 와 저장해 둔다.
   onProg(n, total): 서버에서 받는 중 진행 알림 */
var ORIG_FETCH_CHUNK = 4;      /* 서버에서 한 번에 받는 그림 수 */
function origLoadImgs(set, cb, onProg){
  var out = {}, items = set.items || [], k = 0, miss = [];
  (function local(){
    if(k >= items.length) return remote();
    var it = items[k++];
    origImgGet(origKey(set.id, it.id), function(u){ if(u) out[it.id] = u; else miss.push(it); local(); });
  })();
  function remote(){
    if(!miss.length || !hasServer) return cb(out);
    var pos = 0;
    (function chunk(){
      if(pos >= miss.length) return cb(out);
      var part = miss.slice(pos, pos + ORIG_FETCH_CHUNK);
      pos += ORIG_FETCH_CHUNK;
      if(onProg) onProg(Math.min(pos, miss.length), miss.length);
      origSrvGet(part.map(function(it){ return origKey(set.id, it.id); }), function(j){
        if(j && j.ok && j.imgs){
          part.forEach(function(it){
            var key = origKey(set.id, it.id), u = j.imgs[key];
            if(u){ out[it.id] = u; origImgPut(key, u); }
          });
        }

      });
    })();
  }
}
/* 서버에 아직 안 올라간 그림(s 표시가 없는 것)을 조용히 올린다 — 예전 버전에서 이 기기에만 저장했던 그림 구제용.
   목록 화면을 열 때 시도한다(30초에 한 번 이하). */
var ORIG_SYNC_AT = 0;
function origSyncUp(){
  if(!hasServer || Date.now() - ORIG_SYNC_AT < 30000) return;   /* 30초 안에 또 하지 않는다 */
  ORIG_SYNC_AT = Date.now();
  var todo = [];
  origList().forEach(function(set){ (set.items||[]).forEach(function(it){ if(!it.s) todo.push({set:set, it:it}); }); });
  if(!todo.length) return;
  var k = 0, upN = 0;
  (function next(){
    if(k >= todo.length){ if(upN){ saveProgress(); toast('☁️'); } return; }
    var t = todo[k++], key = origKey(t.set.id, t.it.id);
    origImgGet(key, function(u){
      if(!u) return next();
      origSrvPut(key, u, function(j){
        if(j && j.ok){ t.it.s = 1; upN++; next(); }
        else { ERRS.push('원서 그림 서버 저장 실패: '+(j && j.error)); if(upN){ saveProgress(); } }   /* 서버 문제면 나머지는 포기 */
      });
