          '<input class="qi-def" placeholder="\ub73b\ud480\uc774 (English Definition)" value="'+esc(r.def)+'" style="margin-bottom:6px">'+
          '<div style="display:flex;gap:6px">'+
            '<input class="qi-w" placeholder="\uc601\uc5b4 \ub2e8\uc5b4" value="'+esc(r.w)+'" style="flex:1;margin:0">'+
            '<input class="qi-k" placeholder="\ud55c\uae00 \ub73b" value="'+esc(r.k)+'" style="flex:1;margin:0">'+
          '</div>'+
        '</div>'+
        '<button class="del" data-del="'+i+'">\u2715</button>'+
      '</div>';
    }).join('');
    function sync(){
      Array.prototype.forEach.call(box.querySelectorAll('.qrow'), function(el){
        var i = +el.dataset.i;
        rows[i] = {
          def: el.querySelector('.qi-def').value,
          w:   el.querySelector('.qi-w').value,
          k:   el.querySelector('.qi-k').value
        };
      });
    }
    on('.del', function(){ sync(); rows.splice(+this.dataset.del,1); if(!rows.length) rows.push({def:'',w:'',k:''}); draw(); });
    document.getElementById('addrow').onclick = function(){ sync(); rows.push({def:'',w:'',k:''}); draw();
      setTimeout(function(){ var d=box.querySelectorAll('.qi-def'); if(d.length) d[d.length-1].focus(); }, 30); };
    document.getElementById('save').onclick = function(){
      sync();
      var t = document.getElementById('qt').value.trim();
      var items = rows.map(function(r){ return {def:(r.def||'').trim(), w:(r.w||'').trim(), k:(r.k||'').trim()}; })
                      .filter(function(r){ return r.def && r.w; });
      if(!t){ noSound(); alert('\ub2e8\uc5b4\uc7a5 \uc774\ub984\uc744 \ub123\uc5b4\uc8fc\uc138\uc694.'); return; }
      if(!items.length){ noSound(); alert('\ub73b\ud480\uc774\uc640 \uc601\uc5b4 \ub2e8\uc5b4\ub294 \uaf2d \ub123\uc5b4\uc8fc\uc138\uc694. (\ud55c\uae00 \ub73b\uc740 \uc120\ud0dd)'); return; }
      if(!PROG.quizzes) PROG.quizzes = [];
      if(editing){ q.title=t; q.items=items; }
      else PROG.quizzes.push({id:'q'+Date.now(), title:t, items:items, done:false});
      saveProgress(); okSound(); toast('\ud83d\udcbe'); screenQuizList();
    };
    if(editing) document.getElementById('del').onclick = function(){
      if(!confirm('\u201c'+q.title+'\u201d \ub2e8\uc5b4\uc7a5\uc744 \uc9c0\uc6b8\uae4c\uc694?')) return;
      PROG.quizzes = quizzes().filter(function(x){ return x.id!==q.id; });
      saveProgress(); toast('\ud83d\uddd1'); screenQuizList();
    };
  }
  draw();
}

/* --- 시험 보기 --- */
function startQuiz(q){
  var order = shuffle(q.items.map(function(_,i){ return i; }));
  var pos = 0, round = 1, results = order.map(function(){ return null; });  /* null/ok/bad */
  runOne();

  function bar(){
    return '<div class="qprog">'+ order.map(function(_,k){
      var st = results[k];
      var cls = k===pos ? 'now' : (st==='ok'?'ok':(st==='bad'?'bad':''));
      return '<div class="qp '+cls+'"></div>';
    }).join('') +'</div>';
  }
  function head(sub){
    return '<div class="topbar">'+
      '<button class="iconbtn" id="qback">\u2190</button>'+
      '<h2>\ud83d\udcdd '+esc(q.title)+'</h2>'+
      '<div class="pill">'+(pos+1)+'/'+order.length+'</div>'+
    '</div>'+
    '<div class="muted" style="text-align:center;margin:-4px 0 8px">'+round+'\ubc88\uc9f8 \ub3c4\uc804 \u00b7 '+sub+'</div>'+ bar();
  }
  function bindBack(){ document.getElementById('qback').onclick = function(){ stopAll(); screenQuizList(); }; }

  /* 1단계: 뜻풀이 보여주고 소리로 들려줌 → 하준이가 타이핑 */
  function runOne(){
    var it = q.items[order[pos]];
    app.innerHTML = head('\ub4e3\uace0 \ubcf4\uace0 \ud0c0\uc774\ud551!') +
      '<div class="card">'+
        '<div class="qlab" style="text-align:center">\uc774 \ub73b\ud480\uc774\uc758 \ub2e8\uc5b4\ub294?</div>'+
        '<div class="defbox"><div class="dl">'+esc(it.def)+'</div>'+
          '<button class="btn primary" id="say" style="margin-top:10px">\ud83d\udd0a \ub4e4\uc5b4\ubcf4\uae30</button>'+
          '<button class="btn" id="slow" style="margin-top:10px">\ud83d\udc22</button>'+
        '</div>'+
        '<div class="qlab">\u270f\ufe0f \uc601\uc5b4 \ub2e8\uc5b4\ub97c \uc790\ud310\uc73c\ub85c \uce58\uc138\uc694</div>'+
        '<input class="qin eng" id="ansW" placeholder="\uc5ec\uae30\uc5d0 \uc601\uc5b4 \ub2e8\uc5b4" autocomplete="off" autocapitalize="off" spellcheck="false">'+
        '<div class="qlab">\u270f\ufe0f \ud55c\uae00 \ub73b\ub3c4 \uce58\uc138\uc694 '+(it.k?'':'<span style="opacity:.6">(\uc774 \ubb38\uc81c\ub294 \ud55c\uae00 \ub73b\uc774 \uc5c6\uc5b4\uc694)</span>')+'</div>'+
        '<input class="qin" id="ansK" placeholder="\uc5ec\uae30\uc5d0 \ud55c\uae00 \ub73b"'+(it.k?'':' disabled')+'>'+
        '<button class="btn go wide" id="done" style="font-size:18px;margin-top:6px">\u2705 \ub2e4 \uc37c\uc5b4\uc694! \ud655\uc778\ud558\uae30</button>'+
      '</div>';
    bindBack();
    var play = function(r){ speakWords(it.def.split(/\s+/), r||RATE, function(){}); };
    document.getElementById('say').onclick = function(){ play(); };
    document.getElementById('slow').onclick = function(){ play(0.6); };
    play();   /* 문제 나오면 자동으로 한 번 들려준다 */
    document.getElementById('done').onclick = function(){ stopAll(); judge(
      document.getElementById('ansW').value.trim(),
      document.getElementById('ansK').value.trim()
    ); };
  }

  /* 채점: 영어 단어만 자동으로 맞는지 확인한다 (대소문자·앞뒤 공백 무시).
     한글 뜻은 확인만 하고 채점에는 넣지 않는다. */
  function normW(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

  /* 2단계: 영어 단어 자동 채점 — 아빠가 없어도 넘어간다 */
  function judge(myW, myK){
    var it = q.items[order[pos]];
    var correct = normW(myW) === normW(it.w);
    results[order[pos]] = correct ? 'ok' : 'bad';
    if(correct){ okSound(); toast('\u2b55'); } else { beep([300],.1); }

    app.innerHTML = head(correct ? '\u2b55 \uc815\ub2f5!' : '\u274c \uc544\uc26c\uc6cc\uc694') +
      '<div class="card">'+
        '<div class="defbox"><div class="dl">'+esc(it.def)+'</div></div>'+
        '<div style="text-align:center;font-size:44px;margin:2px 0 8px">'+(correct?'\u2b55':'\u274c')+'</div>'+
        '<div class="ansbox">'+
          '<div class="qlab" style="margin:0 0 4px">\u2705 \uc815\ub2f5 \ub2e8\uc5b4</div>'+
          '<div style="display:flex;align-items:center;gap:10px">'+
            '<div class="aw" style="flex:1">'+esc(it.w)+'</div>'+
            '<button class="btn primary" id="sayW" style="flex:none">\ud83d\udd0a \ub4e4\uae30</button>'+
            '<button class="btn" id="slowW" style="flex:none">\ud83d\udc22</button>'+
          '</div>'+
          (it.k?'<div class="ak" style="margin-top:6px">\ub73b: '+esc(it.k)+'</div>':'')+
          '<div class="my">\u270f\ufe0f \ud558\uc900\uc774\uac00 \uc4f4 \ub2f5: \uc601\uc5b4 \u201c<b style="color:'+(correct?'var(--melon)':'var(--berry)')+'">'+
            (esc(myW)||'(\ube48\uce78)')+'</b>\u201d'+
            (it.k?' \u00b7 \ud55c\uae00 \u201c<b>'+(esc(myK)||'(\ube48\uce78)')+'</b>\u201d':'')+
          '</div>'+
        '</div>'+
      '</div>'+
      '<button class="btn go wide" id="nx" style="font-size:19px;padding:16px">'+
        (correct
          ? (pos < order.length-1 ? '\ub2e4\uc74c \ubb38\uc81c \u25b6' : '\uacb0\uacfc \ubcf4\uae30 \ud83c\udfc1')
          : '\u270f\ufe0f \ub530\ub77c\uc4f0\uace0 \uc678\uc6b0\uae30!')+'</button>';
    bindBack();
    /* 정답 단어를 또박또박이 아니라 통째로 자연스럽게 읽어준다 */
    var playW = function(r){ speakWords([it.w], r||RATE, function(){}); };
    document.getElementById('sayW').onclick = function(){ playW(); };
    document.getElementById('slowW').onclick = function(){ playW(0.6); };
    playW();   /* 채점되면 정답 발음을 자동으로 한 번 들려준다 */
    document.getElementById('nx').onclick = function(){
      stopAll();
      if(correct) next();
      else traceWord(it, next);   /* 틀리면 10번 따라쓰고 넘어간다 */
    };
  }

  /* 틀린 단어를 손가락으로 따라 그리며 외운다. 10번 그리면 넘어간다.
     희미한 글자를 밑그림으로 깔고, 그 위를 덧칠하듯 그린다.
     글자 획을 충분히 덮으면 1회로 인정한다. */
  function traceWord(it, after){
    var TIMES = 10, done_ = 0;

    function draw(){
      app.innerHTML =
        '<div class="topbar">'+
          '<button class="iconbtn" id="qback">\u2190</button>'+
          '<h2>\u270f\ufe0f \ub530\ub77c \uadf8\ub9ac\uae30</h2>'+
          '<div class="pill">'+done_+'/'+TIMES+'</div>'+
        '</div>'+
        '<div class="card" style="text-align:center">'+
          '<div class="traceBig">\uc774 \ub2e8\uc5b4\ub97c <b>'+TIMES+'\ubc88</b> \uc190\uac00\ub77d\uc73c\ub85c \ub530\ub77c \uadf8\ub824\uc694!</div>'+
          (it.k?'<div class="ak" style="margin:4px 0 2px">\ub73b: '+esc(it.k)+'</div>':'')+
          '<div class="row" style="justify-content:center"><button class="btn primary" id="sayW">\ud83d\udd0a \ub4e4\uae30</button>'+
            '<button class="btn" id="slowW">\ud83d\udc22</button></div>'+
          '<div class="traceCount">'+ (function(){
            var o='';
            for(var k=1;k<=TIMES;k++){
              var cls = k<=done_ ? 'done' : (k===done_+1 ? 'now' : '');
              o += '<div class="tc '+cls+'">'+(k<=done_?'\u2713':k)+'</div>';
            }
            return o;
          })() +'</div>'+
          (done_>=TIMES
            ? '<div class="drawTip">\ud83c\udf89 \ub2e4 \uadf8\ub838\uc5b4\uc694!</div>'
            : '<div class="drawTip">\ud76c\ubbf8\ud55c \uae00\uc790 \uc704\ub97c \uc190\uac00\ub77d\uc73c\ub85c \ub36e\uc5b4 \uadf8\ub824\uc694</div>')+
          '<div class="drawWrap"><canvas id="cv"></canvas></div>'+
          (done_>=TIMES
            ? '<button class="btn go wide" id="nx2" style="font-size:19px;padding:16px">\uc798 \uadf8\ub838\uc5b4\uc694! '+
              (pos < order.length-1 ? '\ub2e4\uc74c \ubb38\uc81c \u25b6':'\uacb0\uacfc \ubcf4\uae30 \ud83c\udfc1')+'</button>'
            : '<div class="drawBtns">'+
                '<button class="btn" id="clr">\u21ba \uc9c0\uc6b0\uace0 \ub2e4\uc2dc</button>'+
                '<button class="btn go" id="chk">\u2713 \ub2e4 \uadf8\ub838\uc5b4\uc694</button>'+
              '</div>')+
        '</div>';
      document.getElementById('qback').onclick = function(){ stopAll(); screenQuizList(); };
      var playW = function(r){ speakWords([it.w], r||RATE, function(){}); };
      document.getElementById('sayW').onclick = function(){ playW(); };
      document.getElementById('slowW').onclick = function(){ playW(0.6); };
      if(document.getElementById('nx2')){
        document.getElementById('nx2').onclick = function(){ stopAll(); after(); };
        return;
      }
      setupCanvas();
      playW();   /* 화면 들어오면 발음 한 번 */
    }

    function setupCanvas(){
      var cv = document.getElementById('cv');
      var wrap = cv.parentNode;
      var W = Math.max(280, wrap.clientWidth || 320), H = 150;
      var DPR = window.devicePixelRatio || 1;
      cv.width = W*DPR; cv.height = H*DPR;
      cv.style.height = H+'px';
      var ctx = cv.getContext('2d');
      ctx.scale(DPR, DPR);

      /* 글자 크기를 폭에 맞춰 정한다 */
      var word = it.w;
      var fs = 96;
      ctx.font = '700 '+fs+'px Fredoka, sans-serif';
      while(ctx.measureText(word).width > W-32 && fs > 26){ fs -= 2; ctx.font = '700 '+fs+'px Fredoka, sans-serif'; }
      var tx = W/2, ty = H/2;

      /* 밑그림(희미한 글자)을 offscreen에 그려서, 어디가 글자 획인지 픽셀로 안다 */
      function drawGhost(){
        ctx.clearRect(0,0,W,H);
        ctx.font = '700 '+fs+'px Fredoka, sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle = '#E4DDF5';
        ctx.fillText(word, tx, ty);
        /* 점선 외곽선으로 획을 더 또렷하게 */
        ctx.save(); ctx.setLineDash([4,4]); ctx.lineWidth=1.5; ctx.strokeStyle='#B9ABE6';
        ctx.strokeText(word, tx, ty); ctx.restore();
      }

      /* 글자 영역 마스크 (덮었는지 판정용) */
      var mask = document.createElement('canvas');
      mask.width = W; mask.height = H;
      var mctx = mask.getContext('2d');
      mctx.font = '700 '+fs+'px Fredoka, sans-serif';
      mctx.textAlign='center'; mctx.textBaseline='middle';
      mctx.lineWidth = 14; mctx.strokeStyle='#000'; mctx.fillStyle='#000';
      mctx.strokeText(word, tx, ty); mctx.fillText(word, tx, ty);
      var mdata = mctx.getImageData(0,0,W,H).data;
      /* 글자에 속하는 픽셀 수 세기 (샘플링 간격 4px) */
      var STEP = 4, total = 0, cells = {};
      for(var y=0;y<H;y+=STEP){ for(var x=0;x<W;x+=STEP){
        if(mdata[(y*W+x)*4+3] > 40){ total++; cells[x+'_'+y]=false; }
      }}

      drawGhost();

      /* 사용자가 그린 궤적 */
      var drawing=false, last=null, covered=0;
      ctx.lineCap='round'; ctx.lineJoin='round';

      function pos(e){
        var r = cv.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
      }
      function markCovered(x,y){
        /* 붓 반경 안의 글자 셀을 '덮음'으로 표시 */
        var R=12;
        for(var yy=Math.max(0,y-R); yy<=Math.min(H,y+R); yy+=STEP){
          for(var xx=Math.max(0,x-R); xx<=Math.min(W,x+R); xx+=STEP){
            var gx=Math.round(xx/STEP)*STEP, gy=Math.round(yy/STEP)*STEP;
            var key=gx+'_'+gy;
            if(cells[key]===false){
              var dx=xx-x, dy=yy-y;
              if(dx*dx+dy*dy <= R*R){ cells[key]=true; covered++; }
            }
          }
        }
      }
      function start(e){ e.preventDefault(); drawing=true; last=pos(e);
        ctx.strokeStyle='#7C3AED'; ctx.lineWidth=PEN_TRACE; }
      function move(e){
        if(!drawing) return; e.preventDefault();
        var p=pos(e);
        ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
        markCovered(p.x,p.y); last=p;
      }
      function end(e){ if(!drawing) return; drawing=false; }

      cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move);
      window.addEventListener('mouseup',end);
      cv.addEventListener('touchstart',start,{passive:false});
      cv.addEventListener('touchmove',move,{passive:false});
      cv.addEventListener('touchend',end);

      /* "다 그렸어요" — 충분히 덮었으면 1회 인정 */
      var COVER_NEED = 0.55;   /* 글자 획의 55% 이상 덮으면 통과 */
      document.getElementById('chk').onclick = function(){
        var ratio = total ? covered/total : 1;
        if(ratio >= COVER_NEED){
          done_++;
          if(done_ >= TIMES){ starSound(); confetti(16); }
          else beep([620+done_*30],.05);
          setTimeout(draw, 180);
        } else {
          /* 덜 그렸으면 살짝 알려주고 계속 */
          noSound();
          var tip = wrap.previousElementSibling;
          if(tip && tip.classList.contains('drawTip')){
            tip.textContent = '\uc870\uae08 \ub354 \ub530\ub77c \uadf8\ub824\ubcf4\uc138\uc694! ('+Math.round(ratio*100)+'%)';
            tip.style.color = 'var(--berry)';
          }
        }
      };
      document.getElementById('clr').onclick = function(){
        covered=0; for(var k in cells) cells[k]=false; drawGhost();
      };
    }
    draw();
  }

  function next(){
    stopAll();
    pos++;
    if(pos < order.length){ runOne(); return; }
    /* 한 바퀴 끝 — 틀린 것만 모은다 */
    var wrong = order.filter(function(idx){ return results[idx]==='bad'; });
    if(!wrong.length){ pass(); return; }
    roundEnd(wrong);
  }

  /* 한 바퀴 끝, 틀린 게 있으면 섞어서 다시 */
  function roundEnd(wrong){
    app.innerHTML =
      '<div class="result">'+
        '<div class="big">\ud83d\udd01</div>'+
        '<h2>'+round+'\ubc88\uc9f8 \ub05d!</h2>'+
        '<p>'+order.length+'\ubb38\uc81c \uc911 <b>'+(order.length-wrong.length)+'\uac1c</b> \ub9de\ucd94\uace0<br>'+
          '<b style="color:var(--berry)">'+wrong.length+'\uac1c</b>\ub97c \ud2c0\ub838\uc5b4\uc694.</p>'+
        '<div class="card" style="margin-bottom:12px">'+
          wrong.map(function(idx){ return '<span class="misschip">'+esc(q.items[idx].w)+'</span>'; }).join('')+
        '</div>'+
        '<p class="muted">\ud2c0\ub9b0 '+wrong.length+'\uac1c\ub97c <b>\uc21c\uc11c\ub97c \uc11e\uc5b4</b>\uc11c \ub2e4\uc2dc \ub0bc\uac8c\uc694.<br>\ub2e4 \ub9de\ucd94\uba74 \u2b50 '+STAR_PICK_MIN+'~'+STAR_PICK_MAX+'\uac1c \ubf51\uae30!</p>'+
        '<button class="btn primary wide" id="again" style="margin-bottom:10px">\ud83d\udd01 \ud2c0\ub9b0 \uac83\ub9cc \ub2e4\uc2dc!</button>'+
        '<button class="btn go wide" id="lst">\ub098\uc911\uc5d0 \ud560\ub798\uc694</button>'+
      '</div>';
    document.getElementById('again').onclick = function(){
      order = shuffle(wrong.slice());
      results = q.items.map(function(){ return null; });
      pos = 0; round++; beep([700,900],.06); runOne();
    };
    document.getElementById('lst').onclick = screenQuizList;
  }

  /* 다 맞음! — 통과하면 별을 뽑는다 (1~5개 랜덤) */
  function pass(){
    var justGot = null;
    starSound(); confetti(50);
    render();
    if(q.done) checkFinal();

    function render(){
      var first = !q.done;
      app.innerHTML =
        '<div class="result">'+
          '<div class="big">\ud83c\udfc6</div>'+
          '<h2>\ub2e8\uc5b4 \ud14c\uc2a4\ud2b8 \ud1b5\uacfc!</h2>'+
          '<p>\u201c'+esc(q.title)+'\u201d<br><b>'+q.items.length+'\ubb38\uc81c\ub97c \ubaa8\ub450 \ub9de\ucd94\uc5c8\uc5b4\uc694!</b><br>'+
            '<span class="muted">'+round+'\ubc88 \ub3c4\uc804 \ub05d\uc5d0 \uc131\uacf5</span></p>'+
          (justGot!==null
            ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6;font-size:20px">'+
                new Array(justGot+1).join('\u2b50')+'<br><b>\ubcc4 '+justGot+'\uac1c</b>\ub97c \ubc1b\uc558\uc5b4\uc694!</div>'
            : (first
              ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6">\u2b50 \ubcc4 <b>'+STAR_PICK_MIN+'~'+STAR_PICK_MAX+'\uac1c</b>\ub97c \ubf51\uc744 \uc218 \uc788\uc5b4\uc694!</div>'+
                '<button class="btn primary wide" id="draw" style="font-size:20px;padding:17px;margin-bottom:10px">\u2b50 \ubcc4 \ubf51\uae30!</button>'
              : '<div class="card" style="margin-bottom:12px">\uc774\ubbf8 \ubcc4 <b>'+(q.stars||STAR_QUIZ)+'\uac1c</b>\ub97c \ubc1b\uc740 \ub2e8\uc5b4\uc7a5\uc774\uc5d0\uc694. \ub2e4\uc2dc \ub9de\ucd98 \uac83\ub3c4 \uba4b\uc838\uc694! \ud83d\udc4f</div>'))+
          ((justGot!==null || !first)
            ? '<button class="btn primary wide" id="again" style="margin-bottom:10px">\ud83d\udd01 \ud55c \ubc88 \ub354</button>'
            : '')+
          '<button class="btn go wide" id="lst">\ud83d\udcdd \ubaa9\ub85d\uc73c\ub85c</button>'+
        '</div>';
      if(document.getElementById('draw')) document.getElementById('draw').onclick = function(){
        modalStarDraw(function(got){
          q.done = true; q.stars = got; saveProgress();
          justGot = got; render(); checkFinal();
        });
      };
      if(document.getElementById('again')) document.getElementById('again').onclick = function(){ startQuiz(q); };
      document.getElementById('lst').onclick = screenQuizList;
    }
  }
}

/* =========================================================
   2-F) 📖 문장 암기 테스트
   아빠가 [영어 문장 + 한글 뜻]을 등록한다.
   ① 배우기 — 문장을 소리로 듣고, 희미한 글자를 손가락으로 SENT_TIMES번 따라 그린다.
   ② 시험  — 한글 뜻만 보고 영어 문장을 빈 화면에 직접 써 본다 → 아빠가 ⭕/❌ 채점.
   전부 통과하면 별 STAR_SENT개.
   ========================================================= */
var STAR_SENT  = 1;    /* 문장 세트를 다 통과하면 받는 별 */
var SENT_TIMES = 5;    /* 문장 하나를 따라 그리는 횟수 — 힘들어하면 이 숫자를 줄이세요 */
var SENT_COVER = 0.5;  /* 따라 그리기 인정 비율 (0.5 = 글자 획의 50%) */
/* 펜 굵기 — 숫자가 작을수록 얇습니다. 손가락으로 또박또박 쓰려면 얇은 게 좋아요. */
var PEN_TRACE = 4;     /* 희미한 글자를 따라 그릴 때 (단어·문장 공통) */
var PEN_WRITE = 3;     /* 빈 칸에 직접 쓸 때 (문장 시험) */

function sents(){ return PROG.sents || []; }
function sentById(id){ return sents().filter(function(s){ return s.id===id; })[0]; }
function sentStars(){ return sents().reduce(function(a,s){ return a + (s.done ? (s.stars||STAR_SENT) : 0); }, 0); }

/* 긴 문장을 화면 폭에 맞춰 여러 줄로 나눈다 */
function wrapText(ctx, text, maxW){
  var words = String(text).split(/\s+/), lines = [], cur = '';
  for(var i=0;i<words.length;i++){
    var t = cur ? cur+' '+words[i] : words[i];
    if(cur && ctx.measureText(t).width > maxW){ lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}

/* 문장용 그리기 판.
   ghost=true  → 희미한 글자를 깔고 얼마나 덮었는지 센다 (배우기)
   ghost=false → 연한 줄만 그어주고 자유롭게 쓴다 (시험) */
function makeSentCanvas(cv, text, ghost){
  var wrap = cv.parentNode;
  var W = Math.max(280, wrap.clientWidth || 320);
  var DPR = window.devicePixelRatio || 1;

  /* 3줄 안에 들어오도록 글자 크기를 자동으로 줄인다 */
  var mc = document.createElement('canvas').getContext('2d');
  var fs = 40, lines = [];
  while(fs > 14){
    mc.font = '700 '+fs+'px Fredoka, sans-serif';
    lines = wrapText(mc, text, W-30);
    if(lines.length <= 3) break;
    fs -= 2;
  }
  if(!lines.length) lines = [String(text)];
  var lh = Math.round(fs*1.6);
  var H = Math.max(150, lines.length*lh + 40);

  cv.width = W*DPR; cv.height = H*DPR; cv.style.height = H+'px';
  var ctx = cv.getContext('2d'); ctx.scale(DPR,DPR);
  ctx.lineCap='round'; ctx.lineJoin='round';

  function lineY(i){ return 24 + lh*i + lh/2; }

  function base(){
    ctx.clearRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(ghost){
      ctx.font = '700 '+fs+'px Fredoka, sans-serif';
      ctx.fillStyle = '#E4DDF5';
      lines.forEach(function(ln,i){ ctx.fillText(ln, W/2, lineY(i)); });
      ctx.save(); ctx.setLineDash([4,4]); ctx.lineWidth=1.4; ctx.strokeStyle='#B9ABE6';
      lines.forEach(function(ln,i){ ctx.strokeText(ln, W/2, lineY(i)); });
      ctx.restore();
    } else {
      /* 빈 화면 — 쓸 자리에 연한 줄만 그어준다 */
      ctx.save(); ctx.setLineDash([6,6]); ctx.lineWidth=1.4; ctx.strokeStyle='#DCD6F0';
      lines.forEach(function(_,i){
        var y = lineY(i) + fs*0.45;
        ctx.beginPath(); ctx.moveTo(14,y); ctx.lineTo(W-14,y); ctx.stroke();
      });
      ctx.restore();
    }
  }

  /* 덮었는지 판정용 마스크 (배우기에서만 쓴다) */
  var STEP=4, total=0, cells={}, covered=0;
  if(ghost){
    var mk = document.createElement('canvas'); mk.width=W; mk.height=H;
    var mx = mk.getContext('2d');
    mx.font = '700 '+fs+'px Fredoka, sans-serif';
    mx.textAlign='center'; mx.textBaseline='middle';
    mx.lineWidth = 12; mx.strokeStyle='#000'; mx.fillStyle='#000';
    lines.forEach(function(ln,i){ mx.strokeText(ln, W/2, lineY(i)); mx.fillText(ln, W/2, lineY(i)); });
    var md = mx.getImageData(0,0,W,H).data;
    for(var y=0;y<H;y+=STEP){ for(var x=0;x<W;x+=STEP){
      if(md[(y*W+x)*4+3] > 40){ total++; cells[x+'_'+y]=false; }
    }}
  }

  base();

  var drawing=false, last=null;
  function pos(e){
    var r = cv.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
  }
  function mark(x,y){
    if(!ghost) return;
    var R=12;
    for(var yy=Math.max(0,y-R); yy<=Math.min(H,y+R); yy+=STEP){
      for(var xx=Math.max(0,x-R); xx<=Math.min(W,x+R); xx+=STEP){
        var gx=Math.round(xx/STEP)*STEP, gy=Math.round(yy/STEP)*STEP, key=gx+'_'+gy;
        if(cells[key]===false){
          var dx=xx-x, dy=yy-y;
          if(dx*dx+dy*dy <= R*R){ cells[key]=true; covered++; }
        }
      }
    }
  }
  function down(e){ e.preventDefault(); drawing=true; last=pos(e);
    ctx.strokeStyle='#7C3AED'; ctx.lineWidth = ghost ? PEN_TRACE : PEN_WRITE; }
  function move(e){
    if(!drawing) return; e.preventDefault();
    var p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    mark(p.x,p.y); last=p;
  }
  function up(){ drawing=false; }
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',up);

  return {
    clear: function(){ covered=0; for(var k in cells) cells[k]=false; base(); },
    ratio: function(){ return total ? covered/total : 1; }
  };
}

/* --- 문장 만들기 / 고치기 (아빠가 직접 입력) --- */
function screenSentEdit(s){
  var editing = !!s;
  var title = s ? s.title : '';
  var rows = s ? s.items.map(function(it){ return {en:it.en, ko:it.ko}; })
               : [ {en:'',ko:''}, {en:'',ko:''}, {en:'',ko:''} ];
  function draw(){

      '<div id="rows"></div>'+

      (editing ? '<button class="btn wide no" id="del" style="margin-top:9px;background:#FFE4E6;color:#9F1239;box-shadow:0 6px 0 #FDA4AF">🗑 이 문장 묶음 지우기</button>' : '')+
      '<div class="muted" style="text-align:center;margin-top:10px;line-height:1.6">'+
        '너무 길면 따라 그리기가 힘들어요. <b>한 줄 정도</b>가 좋아요.<br>'+
        '예: <b>I go to school every day</b> → 나는 매일 학교에 가요</div>';
    document.getElementById('rows').innerHTML = rows.map(function(r,i){
      return '<div class="card frm" style="margin-bottom:10px">'+
        '<div class="qlab">'+(i+1)+'. 영어 문장</div>'+
        '<input class="ren" data-i="'+i+'" placeholder="I go to school every day" value="'+esc(r.en)+'">'+
        '<div class="qlab" style="margin-top:8px">한글 뜻</div>'+
        '<input class="rko" data-i="'+i+'" placeholder="나는 매일 학교에 가요" value="'+esc(r.ko)+'">'+

    }).join('');
    function collect(){
      title = document.getElementById('st').value.trim();

      Array.prototype.forEach.call(document.querySelectorAll('.rko'), function(el){ rows[+el.dataset.i].ko = el.value; });

    document.getElementById('back').onclick = function(){ screenSentList(); };
    document.getElementById('addrow').onclick = function(){ collect(); rows.push({en:'',ko:''}); draw(); };
    on('[data-del]', function(){ collect(); rows.splice(+this.dataset.del,1); draw(); });

      collect();
      var items = rows.filter(function(r){ return String(r.en).trim() && String(r.ko).trim(); })
                      .map(function(r){ return {en:String(r.en).trim(), ko:String(r.ko).trim()}; });

      if(editing){ s.title = title || '문장 암기'; s.items = items; }

      saveProgress(); okSound(); toast('💾'); screenSentList();
    };
    if(document.getElementById('del')) document.getElementById('del').onclick = function(){
      PROG.sents = sents().filter(function(x){ return x.id!==s.id; });
      saveProgress(); toast('🗑'); screenSentList();
    };
  }
  draw();
}

/* --- 문장 암기 시험 진행 --- */
function startSent(s){
  var order = shuffle(s.items.map(function(_,i){ return i; }));
  var pos = 0, round = 1, results = order.map(function(){ return null; });
  learn();

  function head(sub){
    return '<div class="topbar">'+
        '<button class="iconbtn" id="sback">←</button>'+
        '<h2>'+sub+'</h2>'+
        '<div class="pill">'+(pos+1)+'/'+order.length+'</div>'+
      '</div>';
  }
  function backBind(){ document.getElementById('sback').onclick = function(){ stopAll(); screenSentList(); }; }
  function cur(){ return s.items[order[pos]]; }
  function say(r){ speakWords(cur().en.split(/\s+/), r||RATE, function(){}); }

  /* ① 배우기 — 듣고 SENT_TIMES번 따라 그리기 */
  function learn(){
    var n = 0, pad = null;
    function draw(){
      app.innerHTML = head('✏️ 따라 그리기') +
        '<div class="card" style="text-align:center">'+
          '<div class="traceBig">문장을 듣고 <b>'+SENT_TIMES+'번</b> 따라 그려요! '+
            '<span style="color:var(--grape)">('+n+'/'+SENT_TIMES+')</span></div>'+
          '<div class="sentEn">'+esc(cur().en)+'</div>'+
          '<div class="ak">'+esc(cur().ko)+'</div>'+
          '<div class="row" style="justify-content:center">'+
            '<button class="btn primary" id="say">🔊 듣기</button>'+
            '<button class="btn" id="slow">🐢</button>'+
          '</div>'+
          '<div class="traceCount">'+ (function(){
            var o='';
            for(var k=1;k<=SENT_TIMES;k++){
              var cls = k<=n ? 'done' : (k===n+1 ? 'now' : '');
              o += '<div class="tc '+cls+'">'+(k<=n?'✓':k)+'</div>';
            }
            return o;
          })() +'</div>'+
          '<div class="drawTip" id="tip">'+(n>=SENT_TIMES
            ? '🎉 다 그렸어요! 이제 시험이에요.'
            : '희미한 글자 위를 손가락으로 덮어 그려요')+'</div>'+
          '<div class="drawWrap"><canvas id="cv"></canvas></div>'+
          (n>=SENT_TIMES
            ? '<button class="btn go wide" id="go" style="font-size:19px;padding:16px">✍️ 이제 시험 볼래요!</button>'
            : '<div class="drawBtns">'+
                '<button class="btn" id="clr">↺ 지우고 다시</button>'+
                '<button class="btn go" id="chk">✓ 다 그렸어요</button>'+
              '</div>')+
        '</div>';
      backBind();
      document.getElementById('say').onclick = function(){ say(); };
      document.getElementById('slow').onclick = function(){ say(0.6); };
      pad = makeSentCanvas(document.getElementById('cv'), cur().en, true);
      if(n >= SENT_TIMES){
        document.getElementById('go').onclick = function(){ stopAll(); test(); };
        return;
      }
      document.getElementById('clr').onclick = function(){ pad.clear(); };
      document.getElementById('chk').onclick = function(){
        var r = pad.ratio();
        if(r >= SENT_COVER){
          n++;
          if(n>=SENT_TIMES){ starSound(); confetti(14); } else beep([620+n*25],.05);
          setTimeout(draw, 180);
        } else {
          noSound();
          var tip = document.getElementById('tip');
          if(tip){ tip.textContent = '조금 더 따라 그려보세요! ('+Math.round(r*100)+'%)'; tip.style.color='var(--berry)'; }
        }
      };
      say();
    }
    draw();
  }

  /* ② 시험 — 뜻만 보고 직접 쓰기, 아빠가 채점 */
  function test(){
    var shown = false, pad = null;
    function draw(){
      app.innerHTML = head('✍️ 문장 쓰기') +
        '<div class="card" style="text-align:center">'+
          '<div class="traceBig">뜻을 보고 <b>영어 문장</b>을 써 보세요!</div>'+
          '<div class="sentKo">'+esc(cur().ko)+'</div>'+
          (shown ? '<div class="sentHint">'+esc(cur().en)+'</div>' : '')+
          '<div class="drawTip">손가락으로 또박또박 써요</div>'+
          '<div class="drawWrap"><canvas id="cv"></canvas></div>'+
          '<div class="drawBtns">'+
            '<button class="btn" id="clr">↺ 지우고 다시</button>'+
            '<button class="btn" id="peek">'+(shown?'🔊 정답 듣기':'👁 정답 보기')+'</button>'+
          '</div>'+
          '<div class="sechd" style="margin-top:14px">👨 아빠가 채점해주세요</div>'+
          '<div class="judge2">'+
            '<button class="btn no" id="bad">❌ 다시</button>'+
            '<button class="btn go" id="ok">⭕ 통과</button>'+
          '</div>'+
        '</div>';
      backBind();
      pad = makeSentCanvas(document.getElementById('cv'), cur().en, false);
      document.getElementById('clr').onclick = function(){ pad.clear(); };
      document.getElementById('peek').onclick = function(){
        if(!shown){ shown = true; draw(); }
        else say();
      };
      document.getElementById('ok').onclick = function(){
        okSound(); toast('⭕'); results[pos]='ok'; next();
      };
      document.getElementById('bad').onclick = function(){
        beep([300],.1); results[pos]='bad'; next();
      };
    }
    draw();
  }

  function next(){
    stopAll();
    pos++;
    if(pos < order.length){ learn(); return; }
    var wrong = order.filter(function(_,k){ return results[k]==='bad'; });
    if(wrong.length) roundEnd(wrong); else pass();
  }

  /* 한 바퀴 끝 — 못 외운 게 있으면 섞어서 다시 */
  function roundEnd(wrong){
    app.innerHTML =
      '<div class="result">'+
        '<div class="big">🔁</div>'+
        '<h2>'+round+'번째 끝!</h2>'+
        '<p>'+order.length+'문장 중 <b>'+(order.length-wrong.length)+'개</b> 통과<br>'+
          '<b style="color:var(--berry)">'+wrong.length+'개</b>를 다시 해요.</p>'+
        '<div class="card" style="margin-bottom:12px">'+
          wrong.map(function(idx){ return '<span class="misschip">'+esc(s.items[idx].ko)+'</span>'; }).join('')+
        '</div>'+
        '<p class="muted">못 외운 문장을 <b>다시 따라 그리고</b> 시험 봐요.<br>다 통과하면 ⭐ '+STAR_PICK_MIN+'~'+STAR_PICK_MAX+'개를 뽑아요!</p>'+
        '<button class="btn primary wide" id="again" style="margin-bottom:10px">🔁 못 외운 것만 다시!</button>'+
        '<button class="btn go wide" id="lst">나중에 할래요</button>'+
      '</div>';
    document.getElementById('again').onclick = function(){
      order = shuffle(wrong.slice());
      results = order.map(function(){ return null; });
      pos = 0; round++; beep([700,900],.06); learn();
    };
    document.getElementById('lst').onclick = screenSentList;
  }

  /* 다 통과! — 별을 뽑는다 (1~5개 랜덤) */
  function pass(){
    var justGot = null;
    starSound(); confetti(50);
    render();
    if(s.done) checkFinal();

    function render(){
      var first = !s.done;
      app.innerHTML =
        '<div class="result">'+
          '<div class="big">🏆</div>'+
          '<h2>문장 암기 통과!</h2>'+
          '<p>“'+esc(s.title)+'”<br><b>'+s.items.length+'문장을 모두 외웠어요!</b><br>'+
            '<span class="muted">'+round+'번 도전 끝에 성공</span></p>'+
          (justGot!==null
            ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6;font-size:20px">'+

  }
}

  function finish(){

/* ===== 스페셜 읽기: 모르는 단어 듣기 + 메모 =====
   단어를 눌러 소리를 듣고, 아래에 작은 메모를 남길 수 있다.
   메모는 시(spId)별로 '단어'를 키로 저장 → 다시 누르면 그 메모가 나온다. */
function noteKey(w){ return String(w||'').toLowerCase().replace(/[^a-z']/g,''); }
function getNote(spId, w){
  var k = noteKey(w); if(!k) return '';
  var m = (PROG.wordNotes && PROG.wordNotes[spId]) || null;
  return (m && m[k]) ? m[k] : '';
}
function setNote(spId, w, text){
  var k = noteKey(w); if(!k) return;
  if(!PROG.wordNotes) PROG.wordNotes = {};
  if(!PROG.wordNotes[spId]) PROG.wordNotes[spId] = {};
  text = String(text||'').trim();
  if(text) PROG.wordNotes[spId][k] = text;
  else delete PROG.wordNotes[spId][k];   /* 비우면 메모 삭제 */
  saveProgress();
}
/* 단어 아래에 메모를 '항상' 표시한다. 메모가 없으면 표시를 지운다. */
function paintNote(el, spId, w){
  if(!el) return;
  var note = getNote(spId, w);
  var tag = el.querySelector('.wnote');
  if(note){
    el.classList.add('hasnote');
    if(!tag){ tag = document.createElement('span'); tag.className = 'wnote'; el.appendChild(tag); }
    tag.textContent = note;
  } else {
    el.classList.remove('hasnote');
    if(tag) tag.parentNode.removeChild(tag);
  }
}
/* 단어 메모 팝오버 (el = 눌린 .sw 단어, 메모 저장 후 점 표시 갱신) */
function openWordNote(spId, w, el){
  var cur = getNote(spId, w);
  var ov = openMod(
    '<div style="text-align:center">'+
      '<div style="font-size:13px;color:var(--berry)">모르는 단어</div>'+
      '<div style="font-size:34px;font-weight:800;margin:2px 0 10px">'+esc(w)+'</div>'+
      '<button class="btn primary" id="wnhear" style="margin-bottom:10px">🔊 다시 듣기</button>'+
      '<div style="font-size:13px;color:#666;text-align:left;margin:4px 2px">✏️ 메모 (뜻·읽는 법 등을 적어두면 다음에 눌렀을 때 나와요)</div>'+
      '<textarea id="wnta" rows="3" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:15px;font-family:inherit;box-sizing:border-box" placeholder="예) 고양이 / 캣">'+esc(cur)+'</textarea>'+
      '<button class="btn primary wide" id="wnsave" style="margin-top:10px">💾 메모 저장</button>'+
      (cur ? '<button class="btn wide" id="wndel" style="margin-top:8px">🗑️ 메모 지우기</button>' : '')+
      '<button class="btn wide" id="wncls" style="margin-top:8px">닫기</button>'+
    '</div>');
  var ta = ov.querySelector('#wnta');
  setTimeout(function(){ try{ ta.focus(); }catch(e){} }, 50);
  ov.querySelector('#wnhear').onclick = function(){ say(w, 0.85); };
  ov.querySelector('#wnsave').onclick = function(){
    setNote(spId, w, ta.value); paintNote(el, spId, w); okSound(); toast('💾'); ov.remove();
  };
  if(ov.querySelector('#wndel')) ov.querySelector('#wndel').onclick = function(){
    setNote(spId, w, ''); paintNote(el, spId, w); toast('🗑️'); ov.remove();
  };
  ov.querySelector('#wncls').onclick = function(){ ov.remove(); };
}

function screenSpecial(sp){
  var i = 0, retry = 0;

  function head(){

        '<button class="iconbtn" id="sback">←</button>'+
        '<h2>'+sp.e+' '+esc(sp.t)+'</h2>'+

      }).join('') +'</div>';
  }
  function bindB(){ document.getElementById('sback').onclick = function(){ stopAll(); screenSpecials(); }; }

  /* 1단계: 소리 없이 보여주기 */
  function ask(){
    stopAll();
    var st = sp.st[i];

      '<div class="card" style="text-align:center">'+

        '<div class="poem" id="pm1" style="margin:14px 0">'+

            var n=0;
            return st.l.map(function(line){

              }).join(' ') +'</span>';

        '</div>'+
        '<div class="readtip">🗣️ 하준아, 이 '+st.l.length+'줄을 <b>소리내어</b> 읽어보자!'+
          '<br><span style="font-size:13px">모르는 단어는 눌러서 듣고 메모할 수 있어요</span>'+

    /* 1단계에서도 단어를 눌러 듣고 메모 (메모 있는 단어는 점 표시) */
    var spans1 = app.querySelectorAll('.sw');
    Array.prototype.forEach.call(spans1, function(x){
      paintNote(x, sp.id, flat[+x.dataset.i]);
      x.onclick = function(){
        var w = flat[+this.dataset.i];
        say(w, 0.85);
        openWordNote(sp.id, w, this);
      };
    });
    prefetch(st.l.join(' ').split(' '));
    var b = document.getElementById('check'), t = 4;
    b.textContent = '⏳ 읽는 중… '+t;
    var iv = setInterval(function(){
      t--;
      if(t<=0){ clearInterval(iv); b.disabled=false; b.textContent='🔊 다 읽었어요! 확인하기'; }
      else b.textContent = '⏳ 읽는 중… '+t;
    }, 1000);
    b.onclick = function(){ clearInterval(iv); check(); };
  }

  /* 2단계: 들려주고 아빠가 판정 */
  function check(){
    var st = sp.st[i];
    var flat = [];
    st.l.forEach(function(line){ line.split(' ').forEach(function(w){ flat.push(w); }); });
    app.innerHTML = head() +
      '<div class="card" style="text-align:center">'+
        '<div class="dad">👨 아빠가 듣고 눌러주세요</div>'+
        '<div class="poem" id="pm" style="margin:10px 0">'+
          (function(){
            var n=0;
            return st.l.map(function(line){
              return '<span class="pl">'+ line.split(' ').map(function(w){
                return '<span class="sw" data-i="'+(n++)+'">'+esc(w)+'</span>';
              }).join(' ') +'</span>';
            }).join('');
          })()+
        '</div>'+
        '<div class="row"><button class="btn primary" id="again">🔁 다시 듣기</button>'+
        '<button class="btn" id="slow">🐢 천천히</button></div>'+
        '<div class="muted" style="margin-top:8px">단어를 눌러도 소리가 나요</div>'+
      '</div>'+
      '<div class="judge">'+
        '<button class="btn no" id="no">❌ 다시 읽을래</button>'+
        '<button class="btn go" id="ok">⭕ 잘 읽었어요</button>'+
      '</div>';
    bindB();
    var spans = app.querySelectorAll('.sw');
    /* 메모가 있는 단어는 점(•)으로 표시해 둔다 */
    Array.prototype.forEach.call(spans, function(x){
      var w = flat[+x.dataset.i];
      paintNote(x, sp.id, w);
    });
    Array.prototype.forEach.call(spans, function(x){
      x.onclick = function(){
        var w = flat[+this.dataset.i];
        say(w, 0.85);                 /* ① 그 단어만 소리 */
        openWordNote(sp.id, w, this); /* ② 메모 보기/쓰기 팝오버 */
      };
    });
    function hl(rate){
      speakWords(flat, rate||RATE, function(k){
        Array.prototype.forEach.call(spans, function(x){ x.classList.remove('hi'); });
        if(k>=0 && spans[k]) spans[k].classList.add('hi');
      });
    }
    document.getElementById('again').onclick = function(){ hl(); };
    document.getElementById('slow').onclick  = function(){ hl(0.6); };
    document.getElementById('no').onclick = function(){ beep([300],.1); retry++; stopAll(); ask(); };
    document.getElementById('ok').onclick = function(){
      okSound(); toast('⭕'); stopAll(); retry = 0; i++;
      if(i >= sp.st.length) pass(); else ask();
    };
    hl();
  }

  /* 통과! — 첫 통과는 별 1~10개, 재통과는 별 1~3개를 뽑는다 */
  function pass(){
    if(!PROG.spec) PROG.spec = {};
    var wasBefore = specPassed(sp.id);   /* 이번 통과 전에 이미 통과했었나 = 재테스트 */
    confetti(50); starSound();
    var justGot = null, drawn = false;
    render();

    function render(){
      var rec = PROG.spec[sp.id] || {};
      var reMode = wasBefore;
      var lo = 1, hi = reMode ? 3 : STAR_SPEC;   /* 재테스트 1~3, 첫 통과 1~10 */
      app.innerHTML =
        '<div class="result">'+
          '<div class="big">🏆</div>'+
          '<h2>스페셜 테스트 통과!</h2>'+
          '<p>'+esc(sp.t)+'<br>'+esc(sp.ko)+'<br><b>'+(sp.st.length*4)+'줄을 다 읽었어요!</b></p>'+
          (justGot!==null
            ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6;font-size:20px">'+
                (reMode?'🔁 다시 도전 성공!':'🎖️ 새 트로피!')+'<br>'+
                new Array(justGot+1).join('⭐')+'<br><b>별 '+justGot+'개</b>를 받았어요!</div>'
            : '<div class="card" style="margin-bottom:12px;background:#FFF8E6">'+
                (reMode
                  ? '🔁 <b>다시 도전 성공!</b> 별 <b>'+lo+'~'+hi+'개</b>를 뽑을 수 있어요!'
                  : '🎖️ <b>새 트로피</b>! 그리고 별 <b>'+lo+'~'+hi+'개</b>를 뽑을 수 있어요!')+'</div>'+
                '<button class="drawbtn" id="sdraw">'+
                  '<span class="spk" style="left:14px;top:10px">✨</span>'+
                  '<span class="spk" style="right:16px;top:12px;animation-delay:.5s">⭐</span>'+
                  '<span class="spk" style="left:22px;bottom:10px;animation-delay:.9s">✨</span>'+
                  '🎰 별 뽑기!'+
                '</button>')+
          '<div class="card" style="margin-bottom:12px">'+
            sp.st.map(function(st){
              return '<div class="storyline done" style="text-align:center;font-size:13px">'+st.e+' '+esc(st.l.join(' / '))+'</div>';
            }).join('')+
          '</div>'+
          (drawn
            ? '<button class="btn primary wide" id="again2" style="margin-bottom:10px">🔁 처음부터 다시 (별 1~3개)</button>'
            : '')+
          '<button class="btn go wide" id="lst">🌟 목록으로</button>'+
        '</div>';
      if(document.getElementById('sdraw')) document.getElementById('sdraw').onclick = function(){
        modalStarDraw(function(got){
          var prev = (reMode && typeof rec.stars==='number') ? rec.stars : 0;
          PROG.spec[sp.id] = {passed:true, at:Date.now(), stars: prev + got}; saveProgress();
          justGot = got; drawn = true; wasBefore = true; render(); checkFinal();
        }, lo, hi);
      };
      if(document.getElementById('again2')) document.getElementById('again2').onclick = function(){
        i=0; retry=0; stopAll(); ask();
      };
      document.getElementById('lst').onclick = screenSpecials;
    }
    if(wasBefore && justGot===null) checkFinal();
  }
  ask();
}

var G = null;

function startGame(L, act, custom){
  G = {L:L, act:act, i:0, correct:0, total:0, hints:0, qs:[], wrong:[], back:null};
  if(custom)             G.qs = custom.slice();
  else if(act==='learn') G.qs = L.items.slice();
  else if(act==='listen') G.qs = pickN(L.items, Math.min(8, L.items.length));
  else if(act==='build')  G.qs = pickN(L.items, Math.min(6, L.items.length));
  else if(act==='picture')G.qs = pickN(L.items.filter(function(x){return x.pic;}), 6);
  else if(act==='firstsound') G.qs = pickN(L.items.filter(function(x){return x.first!==false;}), 8);
  else if(act==='sentence'){ var sh = L.sentences.filter(function(x){ return x.split(' ').length<=6; });
                             G.qs = shuffle(sh.length?sh:L.sentences).slice(0,4); }
  else if(act==='read')     G.qs = L.story.p.slice();      /* 책 순서대로 */
  else if(act==='wordread') G.qs = pickN(L.items, Math.min(12, L.items.length));
  G.total = G.qs.length;
  renderQ();
}

function gameHead(label){
  var pct = Math.round(G.i / G.total * 100);
  return '<div class="topbar">'+
      '<button class="iconbtn" id="gback">←</button>'+
      '<h2>'+ACTS[G.act].ico+' '+ACTS[G.act].name+'</h2>'+
      '<div class="pill">'+(G.i+1)+'/'+G.total+'</div>'+
    '</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="q">'+label+'</div>';
}
function bindBack(){ document.getElementById('gback').onclick = function(){ stopAll(); (G.back || function(){ screenLevel(G.L); })(); }; }

function nextQ(){
  G.i++;
  if(G.i >= G.total) screenResult();
  else renderQ();
}

function renderQ(){
  var f = {learn:qLearn, listen:qListen, build:qBuild, picture:qPicture, sentence:qSentence, firstsound:qFirst, read:qRead, wordread:qWordRead}[G.act];
  f();
  bindBack();
}

/* --- 9-1) 소리 듣기 (카드) --- */
function qLearn(){
  var it = G.qs[G.i];
  var isLetter = G.L.type==='letters';
  var body;
  if(isLetter){
    body =
      '<div class="card">'+
        '<div class="emoji">'+it.e+'</div>'+
        '<div class="word en" style="color:var(--grape)">'+it.w.toUpperCase()+' '+it.w+'</div>'+
        '<div class="ko">'+esc(it.k)+'</div>'+
        '<div class="row">'+
          '<button class="btn primary" id="s1">🔊 소리</button>'+
          '<button class="btn" id="s2">🍎 '+esc(it.kw)+'</button>'+
        '</div>'+
      '</div>';
  } else {
    var chunks = '';
    if(it.ch){                       /* 2음절 · 어미 단어 */
      chunks = '<div class="chunks">'+ it.ch.map(function(c,i){
        return '<button class="chunk '+(i===0?'onset':'rime')+'" data-c="'+i+'">'+esc(c)+'</button>';
      }).join('') +'</div>';
    } else if(it.on||it.ri){         /* 첫소리 + 나머지 */
      chunks = '<div class="chunks">'+
          (it.on ? '<button class="chunk onset" id="c1">'+esc(it.on)+'</button>' : '')+
          '<button class="chunk rime" id="c2">'+esc(it.ri)+'</button>'+
        '</div>';
    }
    body =
      '<div class="card">'+
        '<div class="emoji">'+it.e+'</div>'+
        '<div class="word en">'+esc(it.w)+'</div>'+
        '<div class="ko">'+esc(it.k)+'</div>'+
        chunks+
        '<div class="row">'+
          '<button class="btn primary" id="s1">🔊 이어서 듣기</button>'+
          '<button class="btn" id="s3">🐢 천천히</button>'+
        '</div>'+
      '</div>';
  }
  app.innerHTML = gameHead(isLetter ? '글자를 눌러 소리를 들어요' : '조각 소리를 듣고 이어 붙여요') + body +
    '<div class="row" style="margin-top:16px">'+
      (G.i>0 ? '<button class="btn" id="prev">◀ 앞으로</button>' : '')+
      '<button class="btn go" id="next" style="min-width:150px">'+(G.i===G.total-1?'다 했어요 ✓':'다음 ▶')+'</button>'+
    '</div>';

  if(isLetter){
    var play = function(){ sayParts([SND[it.w]||it.w, it.w+', '+it.kw], RATE); };
    document.getElementById('s1').addEventListener('click', play);
    document.getElementById('s2').addEventListener('click', function(){ say(it.kw, RATE); });
    play();
  } else {
    var b = blendOf(it);
    var play2 = function(r){ sayParts(b, r||RATE); };
    document.getElementById('s1').addEventListener('click', function(){ play2(); });
    document.getElementById('s3').addEventListener('click', function(){ play2(0.55); });
    on('.chunk', function(){
      this.classList.remove('pop'); void this.offsetWidth; this.classList.add('pop');
      if(this.dataset.c !== undefined) say(it.cs[+this.dataset.c], RATE);
      else if(this.id==='c1') sayParts(onsetParts(it.on), RATE);
      else say(it.ri, RATE);
    });
    play2();
  }
  if(document.getElementById('prev')) document.getElementById('prev').addEventListener('click', function(){ G.i--; renderQ(); });
  document.getElementById('next').addEventListener('click', function(){ G.correct++; nextQ(); });
}

/* --- 9-5) 단어 만들기 --- */
function qBuild(){
  var it = G.qs[G.i];
  var letters = it.w.split('');
  var bag = shuffle(letters.map(function(c,i){ return {c:c, id:i}; }));
  var placed = [];

  function draw(){
    var slots = letters.map(function(_,i){
      var p = placed[i];
      return '<div class="slot '+(p?'filled':'')+'" data-i="'+i+'">'+(p?esc(p.c):'')+'</div>';
    }).join('');
    var tiles = bag.map(function(t){
      var used = placed.some(function(p){ return p && p.id===t.id; });
      return '<button class="tile '+(used?'used':'')+'" data-id="'+t.id+'">'+esc(t.c)+'</button>';
    }).join('');
    app.innerHTML = gameHead('소리를 듣고 글자를 놓아요') +
      '<div class="card" style="text-align:center">'+
        '<div class="emoji" style="font-size:66px">'+it.e+'</div>'+
        '<div class="ko">'+esc(it.k)+'</div>'+
        '<div class="row"><button class="btn primary" id="play">🔊 듣기</button><button class="btn" id="slow">🐢 천천히</button><button class="btn" id="hint">💡 힌트</button></div>'+
        '<div class="slots">'+slots+'</div>'+
        '<div class="tiles">'+tiles+'</div>'+
      '</div>';
    bindBack();
    document.getElementById('play').addEventListener('click', function(){ sayParts(blendOf(it), RATE); });
    document.getElementById('slow').addEventListener('click', function(){ sayParts(blendOf(it), 0.6); });
    document.getElementById('hint').addEventListener('click', function(){
      G.hints++;
      var box = app.querySelector('.slots');
      box.innerHTML = '<div class="word en small" style="width:100%;color:var(--grape)">'+esc(it.w)+'</div>';
      setTimeout(draw, 1600);
    });
    on('.tile', function(){
      var id=+this.dataset.id;
      if(placed.some(function(p){return p && p.id===id;})) return;
      var slot = letters.findIndex(function(_,i){ return !placed[i]; });
      if(slot<0) return;
      placed[slot] = bag.filter(function(t){return t.id===id;})[0];
      beep([600],.05);
      if(placed.filter(Boolean).length===letters.length) check(); else draw();
    });
    on('.slot', function(){
      var i=+this.dataset.i;
      if(placed[i]){ placed[i]=null; beep([420],.05); draw(); }
    });
  }
  function check(){
    var made = letters.map(function(_,i){ return placed[i] ? placed[i].c : ''; }).join('');
    if(made===it.w){
      draw(); okSound(); toast('🎊'); G.correct++;
      sayParts(blendOf(it), RATE);
      setTimeout(nextQ, 1400);
    } else {
      noSound();
      draw();
      app.querySelector('.slots').classList.add('shake');
      setTimeout(function(){ placed=[]; draw(); }, 500);
    }
  }
  draw();
}

/* =========================================================
   10-B) 단계 테스트 (20문제 · 1문제 5점 · 90점 이상 통과)
   ========================================================= */
var T = null;
var PASS = 90;

function clean(w){ return w.replace(/[^A-Za-z]/g,'').toLowerCase(); }
/* 항목이 모자라도 20문제가 나오도록 섞어가며 뽑기 */
function cyc(arr, n){
  var out=[], pool=[];
  for(var i=0;i<n;i++){ if(!pool.length) pool=shuffle(arr); out.push(pool.pop()); }
  return out;
}
/* 20문제 중 14문제(70%)는 '글자를 읽어야만' 풀리는 문항으로 짠다.
   읽기 문항: lpic(글자→그림) · pic(단어→그림) · mean(단어→우리말 뜻) · cloze(문장→빈칸)
   듣기 문항: listen(소리→단어) · spell(소리→철자) · first(그림→첫글자)  */
var TEST_OPTS = 6;   /* 테스트는 6지선다 (찍기 25% → 17%) */
function makeTestQs(L){
  var qs=[], pics=L.items.filter(function(x){return x.pic;});
  var canFirst = L.items.filter(function(x){return x.first!==false;});
  if(L.type==='letters'){
    cyc(canFirst,14).forEach(function(it){ qs.push({t:'lpic',it:it}); });      /* 읽기 14 */
    cyc(L.items,3).forEach(function(it){ qs.push({t:'listen',it:it}); });
    cyc(canFirst,3).forEach(function(it){ qs.push({t:'first',it:it}); });
  } else if(pics.length >= TEST_OPTS){
    cyc(pics,8).forEach(function(it){ qs.push({t:'pic',it:it}); });            /* 읽기 8 */
    cyc(L.sentences,6).forEach(function(x){ qs.push({t:'cloze',s:x}); });      /* 읽기 6 */
    cyc(L.items,3).forEach(function(it){ qs.push({t:'listen',it:it}); });
    cyc(L.items,3).forEach(function(it){ qs.push({t:'spell',it:it}); });
  } else {                                    /* 그림이 없는 레벨 (사이트워드·어미) */
    cyc(L.sentences,8).forEach(function(x){ qs.push({t:'cloze',s:x}); });      /* 읽기 8 */
    cyc(L.items,6).forEach(function(it){ qs.push({t:'mean',it:it}); });        /* 읽기 6 */
    cyc(L.items,3).forEach(function(it){ qs.push({t:'listen',it:it}); });
    cyc(L.items,3).forEach(function(it){ qs.push({t:'spell',it:it}); });
  }
  return shuffle(qs);
}

function startTest(L){
  T = {L:L, qs:makeTestQs(L), i:0, correct:0, marks:[], lock:false};
  renderT();
}
function tHead(label){
  var pct = Math.round(T.i / T.qs.length * 100);
  var dots = '';
  for(var i=0;i<T.qs.length;i++){
    var m = T.marks[i];
    dots += '<div class="dot '+(m===1?'o':(m===0?'x':''))+'"></div>';
  }
  return '<div class="topbar">'+
      '<button class="iconbtn" id="tback">←</button>'+
      '<h2>🎯 단계 '+T.L.id+' 테스트</h2>'+
      '<div class="pill">'+(T.correct*5)+'점</div>'+
    '</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="q">'+(T.i+1)+'번 / 20문제 · '+label+'</div>';
}
function bindTBack(){
  document.getElementById('tback').onclick = function(){
    if(!confirm('테스트를 그만둘까요? 점수는 저장되지 않아요.')) return;
    stopAll();
    screenLevel(T.L);
  };
}
function tNext(){
  T.i++; T.lock=false;
  if(T.i>=T.qs.length) screenTestResult(); else renderT();
}
/* 정답 처리: 한 문제 한 번만 답할 수 있어요 */
function tAnswer(ok, showFn){
  if(T.lock) return; T.lock=true;
  T.marks[T.i] = ok?1:0;
  if(ok){ T.correct++; okSound(); toast('⚽'); } else { noSound(); }
  if(showFn) showFn();
  setTimeout(tNext, ok?750:1500);
}
function renderT(){
  var q = T.qs[T.i];
  ({listen:tListen, first:tFirst, pic:tPic, spell:tSpell, cloze:tCloze, lpic:tLPic, mean:tMean})[q.t](q);
  bindTBack();
}

function tListen(q){
  var it=q.it, isL=(T.L.type==='letters');
  var opts = shuffle(pickN(T.L.items.filter(function(x){return x.w!==it.w;}),TEST_OPTS-1).concat([it]));
  app.innerHTML = tHead('소리를 듣고 골라요') +
    '<div class="card" style="text-align:center">'+
      '<button class="btn primary" id="play" style="font-size:40px;padding:20px 36px;border-radius:24px">🔊</button>'+
    '</div>'+
    '<div class="opts">'+opts.map(function(o){
      return '<button class="opt en" data-w="'+esc(o.w)+'">'+esc(o.w)+'</button>';
    }).join('')+'</div>';
  var play=function(){ isL ? sayParts([SND[it.w]||it.w, SND[it.w]||it.w], RATE) : sayParts(blendOf(it), RATE); };
  document.getElementById('play').onclick = play;
  setTimeout(play,300);

function tSpell(q){
  var it=q.it, letters=it.w.split('');
  var bag = shuffle(letters.map(function(c,i){ return {c:c,id:i}; }));
  var placed=[];
  function draw(){
    app.innerHTML = tHead('소리를 듣고 글자를 놓아요') +
      '<div class="card" style="text-align:center">'+
        '<div class="emoji" style="font-size:58px">'+it.e+'</div>'+
        '<div class="ko">'+esc(it.k)+'</div>'+
        '<div class="row"><button class="btn primary" id="play">🔊 듣기</button><button class="btn" id="slow">🐢 천천히</button></div>'+
        '<div class="slots">'+letters.map(function(_,i){
          var pl=placed[i];
          return '<div class="slot '+(pl?'filled':'')+'" data-i="'+i+'">'+(pl?esc(pl.c):'')+'</div>';
        }).join('')+'</div>'+
        '<div class="tiles">'+bag.map(function(t){
          var used = placed.some(function(x){ return x && x.id===t.id; });
          return '<button class="tile '+(used?'used':'')+'" data-id="'+t.id+'">'+esc(t.c)+'</button>';
        }).join('')+'</div>'+
      '</div>';
    bindTBack();
    document.getElementById('play').onclick = function(){ sayParts(blendOf(it), RATE); };
    document.getElementById('slow').onclick = function(){ sayParts(blendOf(it), 0.6); };
    on('.tile', function(){
      if(T.lock) return;
      var id=+this.dataset.id;
      if(placed.some(function(x){return x && x.id===id;})) return;
      var slot = letters.findIndex(function(_,i){ return !placed[i]; });
      if(slot<0) return;
      placed[slot]=bag.filter(function(x){return x.id===id;})[0];
      beep([600],.05);
      if(placed.filter(Boolean).length===letters.length) check(); else draw();
    });
    on('.slot', function(){
      if(T.lock) return;
      var i=+this.dataset.i;
      if(placed[i]){ placed[i]=null; beep([420],.05); draw(); }
    });
  }
  function check(){
    var made = letters.map(function(_,i){ return placed[i]?placed[i].c:''; }).join('');
    var ok = (made===it.w);
    draw();
    tAnswer(ok, function(){
      var box=app.querySelector('.slots');
      if(ok){ box.classList.add('pop'); sayParts(blendOf(it),RATE); }
      else { box.classList.add('shake'); box.innerHTML='<div class="word en small" style="width:100%;color:var(--berry)">'+esc(it.w)+'</div>'; say(it.w,0.85); }
    });
  }
  draw();
}

function tCloze(q){
  var L=T.L, words=q.s.split(' ');
  var cands=[];
  words.forEach(function(w,i){
    var c=clean(w);
    if(L.items.some(function(x){ return x.w.toLowerCase()===c; })) cands.push(i);
  });
  if(!cands.length) cands = words.map(function(_,i){return i;}).filter(function(i){ return i>0; });
  /* 같은 단어가 문장에 두 번 나오면 한쪽만 가려도 다른 쪽에서 정답이 들린다 → 한 번만 나오는 단어를 먼저 고른다 */
  function times(c){ return words.filter(function(x){ return clean(x)===c; }).length; }
  var uniq = cands.filter(function(i){ return times(clean(words[i]))===1; });
  if(uniq.length) cands = uniq;
  var bi = cands[Math.floor(Math.random()*cands.length)];
  var ans = clean(words[bi]);
  /* 그래도 중복이면 모든 자리를 함께 가린다 */
  var idx = words.map(function(_,i){ return i; }).filter(function(i){ return clean(words[i])===ans; });
  var opts = shuffle(pickN(L.items.filter(function(x){ return x.w.toLowerCase()!==ans; }),TEST_OPTS-1).map(function(x){return x.w;}).concat([ans]));
  var shown = words.map(function(w,i){ return idx.indexOf(i)>=0 ? '<span style="color:var(--berry)">____</span>' : esc(w); }).join(' ');

  app.innerHTML = tHead('문장을 듣고 빈칸을 채워요') +
    '<div class="card" style="text-align:center">'+
      '<div class="sent">'+shown+'</div>'+
      '<div class="row"><button class="btn primary" id="play">🔊 문장 듣기</button><button class="btn" id="slow">🐢 천천히</button></div>'+
    '</div>'+
    '<div class="opts">'+opts.map(function(o){
      return '<button class="opt en" data-w="'+esc(o)+'">'+esc(o)+'</button>';
    }).join('')+'</div>';
  /* 정답 단어는 들려주지 않는다 — 하준이가 문장을 읽어서 채워야 한다 */
  var parts = [], buf = [];
  words.forEach(function(w,i){
    if(idx.indexOf(i)>=0){ if(buf.length){ parts.push(buf.join(' ')); buf=[]; } parts.push({t:'hmmm', silent:true}); }
    else buf.push(w);
  });
  if(buf.length) parts.push(buf.join(' '));
  var play = function(){ sayParts(parts, RATE); };
  var muted = words.map(function(w,i){ return idx.indexOf(i)>=0 ? {t:'hmmm', silent:true} : w; });
  document.getElementById('play').onclick = play;
  document.getElementById('slow').onclick = function(){ sayParts(muted, 0.6); };
  setTimeout(play,300);
  on('.opt', function(){
    var self=this, ok=(clean(self.dataset.w)===ans);
    tAnswer(ok, function(){
      self.classList.add(ok?'ok':'no');
      if(!ok) Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(e){ if(clean(e.dataset.w)===ans) e.classList.add('ok'); });
      say(q.s, 0.8);
    });
  });
}

        '• 글자만 보여주고 소리·그림은 숨깁니다. 하준이가 먼저 읽고, 그다음 ⭕/❌를 <b>아버님이</b> 눌러주세요.<br>'+
        '• ❌ 누른 단어는 홈의 <b>🔁 다시 볼 단어</b>에 모입니다. 다음 날 이것부터 5분 하면 됩니다.<br>'+
        '• ⭕를 받으면 목록에서 빠집니다. 목록이 비면 그 레벨은 진짜 읽을 수 있는 겁니다.<br>'+
        '• 판정은 <b>후하게</b> 해주세요. 소리를 더듬어도 결국 맞게 읽었으면 ⭕입니다. 자꾸 ❌면 앱을 안 엽니다.<br>'+
        '• 나머지 놀이(듣고 고르기·단어 만들기 등)는 하준이 혼자 해도 됩니다.<br><br>'+

        '<b>단계 테스트</b><br>'+

        '• 90점 이상 통과하면 캐릭터가 <b>레벨업</b>하고 <b>별 '+STAR_TEST+'개</b>를 받습니다. (16단계 전부 = 별 '+(LEVELS.length*STAR_TEST)+')<br>'+
        '• 특별 보상 <b>★ 닌텐도 게임 칩</b>은 <b>별 '+STAR_GOAL+'개</b>(만점 '+maxStars()+')를 모으면 열립니다.<br>'+
        '&nbsp;&nbsp;별: 놀이 '+LEVELS.reduce(function(a,L){ return a+levelMax(L); },0)+' + 레벨업 '+(LEVELS.length*STAR_TEST)+' + 책 '+(books().length*STAR_BOOK)+' + 스페셜 '+(SPECIALS.length*STAR_SPEC)+' + 종이책 '+(papers().length*STAR_PAPER)+' + 단어/문장테스트 '+((quizzes().length+sents().length)*STAR_PICK_MAX)+' (세트당 최대 '+STAR_PICK_MAX+')<br>'+
        '&nbsp;&nbsp;쉽게 하시려면 Index.html의 <b>STAR_GOAL</b> 숫자만 고치세요.<br>'+
        '• 다음 레벨은 테스트와 상관없이 놀이만 끝내면 열립니다. (막히지 않게)<br>'+
        '• 얻은 보상은 하준이 <b>🎒 가방</b>에 아이템으로 들어갑니다. 실제로 해주신 뒤 아이템을 눌러 <b>사용함</b>으로 바꿔주세요.<br><br>'+
        '<b>⭐ 별 경제</b><br>'+

        '• <b>🎁 보상 뽑기</b>: 별 '+DRAW_PRICE+'개 → 랜덤 보상 1개 (가방에서). 하준이가 직접 뽑습니다.<br>'+
        '• 별 '+CARD_PRICE+'개 → 축구카드 1만원권 1장 (가방에서). <b>뽑기·카드를 쓰면 그만큼 닌텐도가 멀어집니다.</b> 쓸 때 확인 창이 뜹니다.<br>'+
        '• 뽑기/카드로 별을 쓰면 닌텐도('+STAR_GOAL+')가 멀어지니, 모자란 만큼은 <b>👨 아빠 별</b>로 채워주시면 됩니다. (아빠 별은 무제한)<br>'+
        '• <b>👨 아빠가 별 주기</b>: 비밀번호 <b>'+DAD_PIN+'</b> · 잘한 만큼 <b>⭐1~'+MAX_BONUS+'개</b>를 골라서 주세요. 언제 뭘 잘했는지 기록이 남습니다.<br>'+
        '• 비밀번호·최대 별·뽑기 값·카드 값을 바꾸시려면 Index.html의 <b>DAD_PIN · MAX_BONUS · DRAW_PRICE · CARD_PRICE</b>를 고치세요.'+
      '</div>'+
    '</div>';
  document.getElementById('back').addEventListener('click', screenHome);
  document.getElementById('diag').onclick = screenDiag;
  if(document.getElementById('dorev')) document.getElementById('dorev').onclick = startReview;
  if(document.getElementById('clrmiss')) document.getElementById('clrmiss').onclick = function(){
    if(!confirm('못 읽은 단어 목록을 비울까요?')) return;
    PROG.miss={}; saveProgress(); toast('🧹'); screenSettings();
  };
  document.getElementById('rate').addEventListener('change', function(){ RATE=parseFloat(this.value); saveProgress(); });
  document.getElementById('test').addEventListener('click', function(){ sayParts([SND.c,'at','cat'], RATE); });
  document.getElementById('test2').addEventListener('click', function(){ speakWords(['The','cat','has','my','hat.'], RATE, function(){}); });
  on('.sg', function(){
    TTSMODE = this.dataset.m; PROG.tts.mode = TTSMODE; saveProgress();
    beep([700],.05); screenSettings();
  });
  drawVoices();
  document.getElementById('reset').addEventListener('click', function(){
    if(!confirm('모은 별과 진도가 모두 사라집니다. 초기화할까요?')) return;
    PROG={stars:{}, tests:{}, rewards:[], draws:[], miss:{}, books:{}, spec:{}, quizzes:[], sents:[], papers:null, bonus:[], cards:[],
          spent:0, finalWon:false, finalUsed:false, tts:PROG.tts, name:'옥하준', rate:RATE}; normProg();
    if(hasServer) apiPost({action:'reset'}, function(){});
    else { try{ localStorage.removeItem('phonics'); }catch(e){} }
    toast('🧹'); screenHome();
  });
}

/* 설정 화면의 목소리 고르기 */
function drawVoices(){
  var w = document.getElementById('vwrap');
  if(!w) return;
  if(TTSMODE==='device'){
    var vs = allVoices();
    if(!vs.length){ w.innerHTML = '<div class="muted">이 기기에서 영어 음성을 찾지 못했어요. 크롬 브라우저를 써보세요.</div>'; return; }
    w.innerHTML = '<label>목소리 <select id="dv" style="flex:1;padding:8px;border-radius:10px;border:2px solid var(--line);font-family:inherit">'+
      vs.map(function(v){
        var sel = (voice && v.name===voice.name) ? ' selected' : '';
        return '<option value="'+esc(v.name)+'"'+sel+'>'+esc(v.name)+'</option>';
      }).join('')+'</select></label>'+
      '<div class="muted" style="margin-top:4px">Google · Natural · Enhanced 가 붙은 목소리가 가장 좋아요.</div>';
    document.getElementById('dv').onchange = function(){
      PROG.tts.dev = this.value; saveProgress(); pickVoice();
      sayParts([SND.c,'at','cat'], RATE);
    };
  } else {
    if(!AI_OK){
      w.innerHTML = '<div class="muted" style="background:#FFF6DF;border-radius:12px;padding:10px;line-height:1.6">'+
        '⚠️ <b>AI 음성이 아직 켜지지 않았어요.</b><br>'+
        'Apps Script 편집기에서 <b>Code.gs</b> 맨 아래 <b>setTtsApiKey</b> 함수에 Google Cloud API 키를 넣고 한 번 실행하세요.<br>'+
        '(Neural2·Chirp3 음성은 월 100만 자까지 무료 · 이 앱은 월 2만 자 수준)<br>'+
        '지금은 기기 음성으로 나옵니다.</div>';
      return;
    }
    w.innerHTML = '<div class="muted">목소리를 불러오는 중…</div>';
    apiGet('voices', function(r){
      if(r === undefined) r = {error:'응답 없음'};
      (function(r){
      if(!r || r.error || !r.voices){
        w.innerHTML = '<div class="muted" style="color:var(--berry)">목소리 목록을 못 받았어요: '+esc(r && r.error ? r.error : '알 수 없음')+'</div>';
        return;
      }
      var rank = function(n){
        if(/Chirp3-HD/i.test(n)) return 0;
        if(/Neural2/i.test(n))  return 1;
        if(/Wavenet/i.test(n))  return 2;
        if(/Studio|Polyglot/i.test(n)) return 3;
        return 4;
      };
      var vs = r.voices.slice().sort(function(a,b){ return rank(a.name)-rank(b.name) || a.name.localeCompare(b.name); });
      w.innerHTML = '<label>목소리 <select id="av" style="flex:1;padding:8px;border-radius:10px;border:2px solid var(--line);font-family:inherit">'+
        vs.map(function(v){
          return '<option value="'+esc(v.name)+'"'+(v.name===AIVOICE?' selected':'')+'>'+esc(v.name)+' ('+esc(v.g||'')+')</option>';
        }).join('')+'</select></label>'+
        '<div class="muted" style="margin-top:4px">Neural2 = 자연스럽고 음소 발음이 정확 (추천)<br>Chirp3-HD = 가장 사람 같지만 음소 기능이 없을 수 있어요</div>';
      document.getElementById('av').onchange = function(){
        AIVOICE = this.value; PROG.tts.voice = AIVOICE; saveProgress();
        acache.clear(); sayParts([SND.c,'at','cat'], RATE);
      };
      })(r);
    });
  }
}

/* =========================================================
   11-B) 🩺 진단 — 안 될 때 원인을 눈으로 보는 화면
   ========================================================= */
function screenDiag(){

  var rows = [
    ['서버 연결 (앱스스크립트 API)', hasServer ? (OFFLINE ? '❌ 응답 없음 (오프라인으로 동작 중)' : '✅ 정상') : '⚪ 주소 없음 (이 기기에만 저장)'],
    ['진도 저장 위치', OFFLINE || !hasServer ? '📱 이 기기에만' : '☁️ 구글 + 📱 기기'],
    ['기기 저장(localStorage)', (function(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return '✅ 사용 가능'; }catch(e){ return '❌ 막힘 — 사파리 설정 확인'; } })()],
    ['영어 음성 개수', v.length ? '✅ '+v.length+'개' : '❌ 0개 (화면을 한 번 터치하면 잡히기도 해요)'],
    ['고른 목소리', voice ? voice.name : '(없음)'],
    ['AI 음성', hasServer ? (AI_OK ? '✅ 켜짐' : '⚪ 꺼짐 (API 키 없음)') : '⚪ 확인 불가'],
    ['소리 엔진', TTSMODE==='ai' ? 'AI 음성' : '기기 음성'],
    ['화면 크기', window.innerWidth+' × '+window.innerHeight],
    ['모은 별 / 지갑', totalStars()+' / '+walletStars()],
    ['별 내역', '놀이 '+actStars()+' + 레벨업 '+testStars()+' + 책 '+bookStars()+' + 스페셜 '+specStars()+' + 종이책 '+paperStars()+' + 단어 '+quizStars()+' + 문장 '+sentStars()+' + 아빠 '+bonusStars()+' − 쓴 별 '+spentStars()],
    ['브라우저', navigator.userAgent]
  ];
  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="back">←</button><h2>🩺 진단</h2><div style="width:44px"></div></div>'+
    (OFFLINE
      ? '<div class="card" style="margin-bottom:12px;background:#FFF6DF;line-height:1.7">'+
          '<b>⚠️ 서버와 연결이 안 됩니다</b><div class="muted" style="margin-top:6px">'+
          '<b>아이패드·아이폰</b>이라면 대부분 이것 때문입니다:<br>'+
          '<b>설정 → 앱 → Safari → 고급 → 사이트간 추적 방지 끄기</b><br>'+
          '(또는 설정 → Safari → 개인정보 보호 → 사이트간 추적 방지 끄기)<br><br>'+
          '끄신 뒤 앱을 완전히 닫고 다시 열어주세요.</div></div>'
      : '<div class="card" style="margin-bottom:12px;background:#F0FDF4;text-align:center"><b>✅ 다 정상입니다</b></div>')+
    '<div class="sheet">'+ rows.map(function(r){
      return '<div style="padding:7px 0;border-bottom:1px solid var(--line)">'+
        '<div style="font-size:13px;color:var(--ink-soft)">'+esc(r[0])+'</div>'+
        '<div style="font-size:14px;word-break:break-all">'+esc(String(r[1]))+'</div></div>';
    }).join('') +'</div>'+
    '<div class="sheet">'+
      '<h3>⚠️ 오류 기록 '+ERRS.length+'건</h3>'+
      (ERRS.length
        ? '<div class="muted" style="word-break:break-all;line-height:1.7">'+ERRS.slice(-10).map(esc).join('<br>')+'</div>'
        : '<div class="muted">없어요 👍</div>')+
    '</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn primary" id="reload" style="flex:1">🔄 다시 열기</button>'+
    '<button class="btn" id="copy" style="flex:1">📋 내용 복사</button></div>';
  document.getElementById('back').onclick = screenSettings;
  document.getElementById('reload').onclick = function(){ location.reload(); };
  document.getElementById('copy').onclick = function(){
    var t = rows.map(function(r){ return r[0]+': '+r[1]; }).join('\n') + '\n오류: ' + ERRS.join(' | ');
    try{ navigator.clipboard.writeText(t); toast('📋'); }
    catch(e){ alert(t); }
  };
}

/* =========================================================
   12) 시작
   ========================================================= */
try{
  loadProgress(screenIntro);
}catch(e){
  ERRS.push('부팅: '+e);
  try{ localLoad(); normProg(); screenIntro(); }catch(e2){ bootFail(e2); }
}
