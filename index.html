}

/* ── 그림 찾기 (화면 픽셀 분석) ──
   쪽 이미지에서 배경색(가장자리)과 다르면서 속이 꽉 찬 덩어리를 '그림'으로 보고 [ymin,xmin,ymax,xmax](0~1000) 목록을 돌려준다.
   글자(얇은 획)는 속이 비어 있어서 걸러진다. */
function findPictureBoxes(d, w, h, opt){
  opt = opt || {};
  var cell = Math.max(3, Math.round(Math.max(w,h)/200));
  var gw = Math.ceil(w/cell), gh = Math.ceil(h/cell);
  var band = Math.max(2, Math.round(Math.min(w,h)*0.02)), rs=[], gs=[], bs=[];
  function samp(x,y){ var i=(y*w+x)*4; rs.push(d[i]); gs.push(d[i+1]); bs.push(d[i+2]); }
  var x, y;
  for(x=0; x<w; x+=3){ for(y=0; y<band; y++){ samp(x,y); samp(x,h-1-y); } }
  for(y=0; y<h; y+=3){ for(x=0; x<band; x++){ samp(x,y); samp(w-1-x,y); } }
  function med(a){ a.sort(function(p,q){ return p-q; }); return a[a.length>>1]; }
  var br=med(rs), bg=med(gs), bb=med(bs);
  var TH = opt.th || 38, FULL = opt.full || 0.6;
  var on = new Uint8Array(gw*gh), gx, gy;
  for(gy=0; gy<gh; gy++){
    for(gx=0; gx<gw; gx++){
      var cnt=0, tot=0, x0=gx*cell, y0=gy*cell, x1=Math.min(w,x0+cell), y1=Math.min(h,y0+cell), xx, yy;
      for(yy=y0; yy<y1; yy++){
        for(xx=x0; xx<x1; xx++){
          var i=(yy*w+xx)*4;
          if(Math.max(Math.abs(d[i]-br), Math.abs(d[i+1]-bg), Math.abs(d[i+2]-bb)) > TH) cnt++;
          tot++;
        }
      }
      on[gy*gw+gx] = (tot && cnt/tot >= FULL) ? 1 : 0;
    }
  }
  /* 한 칸 부풀려 작은 틈을 메우고, 연결된 덩어리로 묶는다 */
  var on2 = new Uint8Array(on), oy, ox;
  for(gy=0; gy<gh; gy++) for(gx=0; gx<gw; gx++){
    if(!on[gy*gw+gx]) continue;
    for(oy=-1; oy<=1; oy++) for(ox=-1; ox<=1; ox++){
      var ny=gy+oy, nx=gx+ox; if(ny>=0&&ny<gh&&nx>=0&&nx<gw) on2[ny*gw+nx]=1;
    }
  }
  var seen = new Uint8Array(gw*gh), out = [], s;
  for(s=0; s<on2.length; s++){
    if(!on2[s] || seen[s]) continue;
    var stack=[s], c={solid:0,sx0:gw,sy0:gh,sx1:-1,sy1:-1}; seen[s]=1;
    while(stack.length){
      var cur=stack.pop(), cy=(cur/gw)|0, cx=cur-cy*gw;
      if(on[cur]){ c.solid++; if(cx<c.sx0)c.sx0=cx; if(cx>c.sx1)c.sx1=cx; if(cy<c.sy0)c.sy0=cy; if(cy>c.sy1)c.sy1=cy; }
      for(oy=-1; oy<=1; oy++) for(ox=-1; ox<=1; ox++){
        var ny2=cy+oy, nx2=cx+ox; if(ny2<0||ny2>=gh||nx2<0||nx2>=gw) continue;
        var ni=ny2*gw+nx2; if(on2[ni] && !seen[ni]){ seen[ni]=1; stack.push(ni); }
      }
    }
    if(c.sx1 < 0) continue;
    var bw=c.sx1-c.sx0+1, bh=c.sy1-c.sy0+1;
    /* 그림 조건: 가로·세로가 쪽의 10% 이상이고 속이 꽉 차 있을 것 (글줄·밑줄 제외) */
    if(bw < gw*0.10 || bh < gh*0.10) continue;
    if(c.solid/(bw*bh) < 0.45) continue;
    out.push([ Math.round(c.sy0/gh*1000), Math.round(c.sx0/gw*1000), Math.round((c.sy1+1)/gh*1000), Math.round((c.sx1+1)/gw*1000) ]);
  }
  return out;
}
function boxArea(b){ return Math.max(0,b[2]-b[0])*Math.max(0,b[3]-b[1]); }
function boxIou(a,b){
  var y0=Math.max(a[0],b[0]), x0=Math.max(a[1],b[1]), y1=Math.min(a[2],b[2]), x1=Math.min(a[3],b[3]);
  var i=Math.max(0,y1-y0)*Math.max(0,x1-x0), u=boxArea(a)+boxArea(b)-i;
  return u>0 ? i/u : 0;
}
/* AI 가 짚은 대략 위치(ai)와 픽셀로 찾은 덩어리(found)를 합쳐 최종 그림 영역을 정한다.
   픽셀 결과가 AI 위치와 너무 다르거나(선화 등) 없으면 AI 위치를 조금 넓혀 쓴다. how: 'pixel' | 'ai' */
function cropBox(ai, found){
  var ah=ai[2]-ai[0], aw=ai[3]-ai[1], m=0.15;
  var ex=[ai[0]-ah*m, ai[1]-aw*m, ai[2]+ah*m, ai[3]+aw*m], hit=[];
  found.forEach(function(f){
    var cy=(f[0]+f[2])/2, cx=(f[1]+f[3])/2;
    if(cy>=ex[0] && cy<=ex[2] && cx>=ex[1] && cx<=ex[3]) hit.push(f);
  });
  if(hit.length){
    var u=[1000,1000,0,0];
    hit.forEach(function(f){ u[0]=Math.min(u[0],f[0]); u[1]=Math.min(u[1],f[1]); u[2]=Math.max(u[2],f[2]); u[3]=Math.max(u[3],f[3]); });
    if(boxIou(u,ai) >= 0.35 && boxArea(u) >= boxArea(ai)*0.5) return {box:u, how:'pixel'};
  }
  var py=ah*0.03, px=aw*0.03;
  return {box:[Math.max(0,ai[0]-py), Math.max(0,ai[1]-px), Math.min(1000,ai[2]+py), Math.min(1000,ai[3]+px)], how:'ai'};
}
function origNormBox(raw){
  if(!raw || raw.length !== 4) return null;
  var b = raw.map(function(v){ v = +v; return isFinite(v) ? Math.max(0, Math.min(1000, v)) : NaN; });
  if(b.some(function(v){ return isNaN(v); })) return null;
  if(b[2]-b[0] < 30 || b[3]-b[1] < 30) return null;
  return b;
}
/* 이미지/캔버스에서 box(0~1000)만 잘라 JPEG dataURL 로 */
function origCropToUrl(src, box, side, q){
  var W = src.naturalWidth || src.width, H = src.naturalHeight || src.height;
  var x0 = Math.max(0, Math.round(box[1]/1000*W)), y0 = Math.max(0, Math.round(box[0]/1000*H));
  var x1 = Math.min(W, Math.round(box[3]/1000*W)), y1 = Math.min(H, Math.round(box[2]/1000*H));
  var w = Math.max(8, x1-x0), h = Math.max(8, y1-y0);
  var sc = Math.min(1, side/Math.max(w,h));
  var out = document.createElement('canvas'); out.width = Math.max(1,Math.round(w*sc)); out.height = Math.max(1,Math.round(h*sc));
  var cx = out.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,out.width,out.height);
  cx.drawImage(src, x0, y0, w, h, 0, 0, out.width, out.height);
  return out.toDataURL('image/jpeg', q);
}

/* ── PDF 읽기 도구(pdf.js) 불러오기 — 원서 PDF 를 열 때만 내려받는다 ── */
function loadPdfJs(cb){
  if(window.pdfjsLib && window.pdfjsLib.getDocument) return cb(window.pdfjsLib, null);
  var k = 0;
  (function tryNext(){
    if(k >= PDFJS_SRCS.length) return cb(null, 'PDF 읽는 도구를 내려받지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.');
    var src = PDFJS_SRCS[k++], sc = document.createElement('script');
    sc.src = src;
    sc.onload = function(){
      var lib = window.pdfjsLib;
      if(!lib || !lib.getDocument) return tryNext();
      var wsrc = src.replace('pdf.min.js','pdf.worker.min.js');
      function ready(u){ try{ lib.GlobalWorkerOptions.workerSrc = u; }catch(e){} cb(lib, null); }
      /* 다른 주소의 worker 는 브라우저가 막는 일이 있어서 내려받아 blob 으로 쓴다 */
      try{
        fetch(wsrc).then(function(r){ if(!r.ok) throw new Error('w'); return r.blob(); })
          .then(function(b){ ready(URL.createObjectURL(new Blob([b], {type:'text/javascript'}))); })
          .catch(function(){ ready(wsrc); });
      }catch(e){ ready(wsrc); }
    };
    sc.onerror = function(){ if(sc.parentNode) sc.parentNode.removeChild(sc); tryNext(); };
    document.head.appendChild(sc);
  })();
}
function origRenderPage(pdf, n, side, cb){
  pdf.getPage(n).then(function(page){
    var v0 = page.getViewport({scale:1}), sc = side/Math.max(v0.width, v0.height);
    var vp = page.getViewport({scale:sc});
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(vp.width)); cv.height = Math.max(1, Math.round(vp.height));
    page.render({canvasContext: cv.getContext('2d'), viewport: vp, background: 'rgb(255,255,255)'}).promise
      .then(function(){ cb(cv, null); }, function(e){ cb(null, e); });
  }, function(e){ cb(null, e); });
}

/* ── 파일 → 그림 + 영어 문장 + 한글 해석 ──
   kind: 'pdf' = PDF 한 개 / 'img' = 이미지 파일 여러 장(AI가 문장을 읽음, 문장이 없으면 그림만 넣고 직접 입력)
         / 'pic' = 이미지 파일 여러 장(AI 없이 그림만, 문장은 직접 입력)
   onResult(items, info): items=[{id,en,ko,img,box,how,pgl,src,dirty}] / info={name,total,from,to,next,failed,kind,empty} */
function origImageCanvas(file, side, cb){
  var rd = new FileReader();
  rd.onerror = function(){ cb(null); };
  rd.onload = function(){
    var im = new Image();
    im.onload = function(){
      var iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
      var sc = Math.min(1, side/Math.max(iw, ih)), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(iw*sc)); cv.height = Math.max(1, Math.round(ih*sc));
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(im, 0, 0, cv.width, cv.height);
      cb(cv);
    };
    im.onerror = function(){ cb(null); };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function origPageSrc(cv){   /* 그림 영역 조절용 쪽 사진 */
  var sc = Math.min(1, ORIG_PAGE_SIDE/Math.max(cv.width, cv.height)), t = document.createElement('canvas');
  t.width = Math.round(cv.width*sc); t.height = Math.round(cv.height*sc);
  t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height);
  return t.toDataURL('image/jpeg', 0.7);
}
/* 사진 한 장을 문제로 — 문장은 비워 둔다(직접 입력).
   페이지 사진에는 원문 문장이 같이 찍혀 있기 쉬워서, 그림 덩어리를 픽셀로 찾아 그 부분만 자른다(how:'auto').
   못 찾으면 사진 전체(how:'whole') — 저장 전에 그림 영역을 확인하라고 알린다. */
function origWholeItem(cv, label){
  var box = [0,0,1000,1000], how = 'whole';
  try{
    var found = findPictureBoxes(cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height);
    if(found.length){
      var u = [1000,1000,0,0];
      found.forEach(function(f){ u[0]=Math.min(u[0],f[0]); u[1]=Math.min(u[1],f[1]); u[2]=Math.max(u[2],f[2]); u[3]=Math.max(u[3],f[3]); });
      if(boxArea(u) >= 1000*1000*0.12 && boxArea(u) <= 1000*1000*0.97){ box = u; how = 'auto'; }
    }
  }catch(e){}
  return {id: origNewId(), en: '', ko: '', img: origCropToUrl(cv, box, ORIG_IMG_SIDE, ORIG_IMG_QUALITY),
          box: box, how: how, pgl: label, src: origPageSrc(cv), dirty: true};
}
function origScan(kind, startHint, onResult){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = kind === 'pdf' ? 'application/pdf,.pdf' : 'image/*'; inp.multiple = kind !== 'pdf';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function(){
    var files = Array.prototype.slice.call(inp.files || []);
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(!files.length) return;
    if(kind !== 'pdf' && files.length > ORIG_PDF_MAX_PAGES){
      alert('한 번에 '+ORIG_PDF_MAX_PAGES+'장까지 넣을 수 있어요. 앞의 '+ORIG_PDF_MAX_PAGES+'장만 넣고,\n나머지는 다 끝난 뒤 「이미지 더 추가」로 이어서 넣어 주세요.');
      files = files.slice(0, ORIG_PDF_MAX_PAGES);
    }
    var file = files[0], cancelled = false, timer = null, acc = [], pdfRef = null;
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(30,20,60,.72);display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML = '<div style="background:#fff;border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center">'+
      '<div style="font-size:46px">📘</div>'+
      '<div id="ogMsg" style="font-size:18px;font-weight:800;margin:8px 0 4px">'+(kind==='pdf'?'PDF를 여는 중…':'그림을 준비하는 중…')+'</div>'+
      '<div style="font-size:13px;color:#666;line-height:1.5">'+(kind==='pic'?'그림을 넣고 있어요.':'그림과 문장을 읽어요.')+'<br>화면을 닫지 말고 기다려 주세요.</div>'+
      '<button class="btn" id="ogCancel" style="margin-top:16px">✖ 취소</button></div>';
    document.body.appendChild(ov);
    function setMsg(t){ var m = document.getElementById('ogMsg'); if(m) m.textContent = t; }
    function close(){ cancelled = true; clearTimeout(timer); try{ if(pdfRef) pdfRef.destroy(); }catch(e){} if(ov.parentNode) ov.parentNode.removeChild(ov); }
    var info = {name: (kind==='pdf' || files.length===1) ? String(file.name||'').replace(/\.[A-Za-z0-9]+$/,'') : '',
                total: 0, from: 1, to: 0, next: 1, failed: false, kind: kind, empty: 0};
    document.getElementById('ogCancel').onclick = function(){
      var had = acc.length > 0;
      close();
      if(had && confirm('여기까지 읽은 '+acc.length+'개 문제를 넣을까요?')){ info.failed = true; onResult(acc, info); }
    };
    function fail(msg){
      if(cancelled) return;
      close(); noSound();
      info.failed = true;
      if(acc.length){
        onResult(acc, info);
        setTimeout(function(){
          alert(msg+'\n\n앞쪽 '+acc.length+'개 문제는 입력됐어요. 이어서 하려면 '+
            (kind==='pdf' ? '「PDF 더 추가」를 누르고 '+info.next+'쪽부터' : '「이미지 더 추가」로 '+info.next+'번째 이미지부터')+' 읽으세요.');
        }, 80);
      } else alert(msg);
    }
    function finish(src){
      close();
      info.next = (kind === 'pdf' && src.end < src.total) ? src.end + 1 : 1;
      onResult(acc, info);
    }

    /* 한 쪽(그림 한 장)씩 AI 에게 보낸다 — ORIG_PAGES_PER_CALL 장씩 묶어서 */
    function run(src){
      info.total = src.total; info.from = src.start; info.to = src.end; info.next = src.start;
      if(kind === 'pic') return runPic();
      runBatch(src.start);
      function runPic(){
        (function one(n){
          if(cancelled) return;
          if(n > src.end) return finish(src);
          setMsg('그림 넣는 중 '+n+'/'+src.end);
          src.render(n, function(cv){
            if(cancelled) return;
            if(cv) acc.push(origWholeItem(cv, src.label(n)));
            info.next = n + 1;
            setTimeout(function(){ one(n + 1); }, 0);
          });
        })(src.start);
      }
      function runBatch(p0){
        if(cancelled) return;
        if(p0 > src.end) return finish(src);
        var p1 = Math.min(src.end, p0 + ORIG_PAGES_PER_CALL - 1), cvs = [], nos = [], b64 = [];
        (function render(p){
          if(cancelled) return;
          if(p > p1) return send();
          setMsg('그림 준비 '+p+'/'+src.end);
          src.render(p, function(cv){
            if(cv){
              var m = /^data:image\/jpeg;base64,(.+)$/.exec(cv.toDataURL('image/jpeg', ORIG_AI_QUALITY) || '');
              if(m){ cvs.push(cv); nos.push(p); b64.push(m[1]); }
            }
            setTimeout(function(){ render(p + 1); }, 0);
          });
        })(p0);
        function send(){
          if(cancelled) return;
          if(!b64.length){ info.next = p1 + 1; return runBatch(p1 + 1); }
          setMsg('AI가 그림과 문장을 읽는 중… ('+p0+(p1>p0?'~'+p1:'')+' / 전체 '+src.end+')');
          clearTimeout(timer);
          timer = setTimeout(function(){ fail('시간이 너무 오래 걸려요. 잠시 뒤 다시 해 주세요.'); }, ORIG_TIMEOUT*1000);
          apiPost({action:'ocr', kind:'orig', pin:DAD_PIN, images:b64}, function(j){
            if(cancelled) return;
            clearTimeout(timer);
            if(!j || j.error || !j.ok || !j.data) return fail(scanErrMsg(j));
            var byIdx = {}, srcCache = {};
            (j.data.items || []).forEach(function(x){
              var idx = (+x.page || 0) - 1;
              if(!(idx >= 0 && idx < cvs.length)) return;
              var en = String(x.en == null ? '' : x.en).replace(/\s+/g,' ').trim();
              if(!en) return;
              var ko = String(x.ko == null ? '' : x.ko).replace(/\s+/g,' ').trim();
              var cv = cvs[idx];
              if(!cv._found){
                try{ cv._found = findPictureBoxes(cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height); }
                catch(e){ cv._found = []; }
              }
              var ai = origNormBox(x.box || x.box_2d);
              var res = ai ? cropBox(ai, cv._found) : {box:[0,0,1000,1000], how:'page'};
              if(!srcCache[idx]) srcCache[idx] = origPageSrc(cv);
              (byIdx[idx] = byIdx[idx] || []).push({id: origNewId(), en: en, ko: ko,
                img: origCropToUrl(cv, res.box, ORIG_IMG_SIDE, ORIG_IMG_QUALITY),
                box: res.box, how: res.how, pgl: src.label(nos[idx]), src: srcCache[idx], dirty: true});
            });
            for(var q = 0; q < cvs.length; q++){
              var arr = byIdx[q] || [];
              if(arr.length) arr.forEach(function(it){ acc.push(it); });
              else if(kind === 'img'){ acc.push(origWholeItem(cvs[q], src.label(nos[q]))); info.empty++; }   /* 문장이 없는 그림 → 그림만 넣고 직접 입력 */
            }
            info.next = p1 + 1;
            runBatch(p1 + 1);
          });
        }
      }
    }

    if(kind !== 'pdf'){
      return run({total: files.length, start: 1, end: files.length,
        render: function(n, cb){ origImageCanvas(files[n-1], ORIG_RENDER_SIDE, cb); },
        label: function(n){ return '그림 '+n+'번'; }});
    }
    var fr = new FileReader();
    fr.onerror = function(){ fail('PDF 파일을 읽지 못했어요.'); };
    fr.onload = function(){
      if(cancelled) return;
      setMsg('PDF 읽는 도구를 준비하는 중…');
      loadPdfJs(function(lib, err){
        if(cancelled) return;
        if(!lib) return fail(err);
        lib.getDocument({data: new Uint8Array(fr.result)}).promise.then(function(pdf){
          if(cancelled){ try{ pdf.destroy(); }catch(e){} return; }
          pdfRef = pdf;
          var total = pdf.numPages, start = 1;
          if(startHint > 1 && startHint <= total){
            var a = prompt('이어서 몇 쪽부터 읽을까요? (1~'+total+')', String(startHint));
            if(a === null){ close(); return; }
            start = Math.max(1, Math.min(total, parseInt(a,10) || startHint));
          } else if(total > ORIG_PDF_MAX_PAGES){
            var a2 = prompt('이 PDF는 '+total+'쪽이에요. 한 번에 '+ORIG_PDF_MAX_PAGES+'쪽까지 읽어요.\n몇 쪽부터 읽을까요? (1~'+total+')', '1');
            if(a2 === null){ close(); return; }
            start = Math.max(1, Math.min(total, parseInt(a2,10) || 1));
          }
          run({total: total, start: start, end: Math.min(total, start + ORIG_PDF_MAX_PAGES - 1),
            render: function(n, cb){ origRenderPage(pdf, n, ORIG_RENDER_SIDE, function(cv){ cb(cv); }); },
            label: function(n){ return 'PDF '+n+'쪽'; }});
        }, function(){ fail('PDF를 열 수 없어요. 암호가 걸렸거나 손상된 파일일 수 있어요.'); });
      });
    };
    fr.readAsArrayBuffer(file);
  };
  inp.click();
}

/* ── 그림 영역 조절 (슬라이더 4개) ── */
function origCropModal(it, onApply){
  var box = (it.box || [0,0,1000,1000]).map(Math.round), img = new Image();
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(30,20,60,.72);display:flex;align-items:center;justify-content:center;padding:14px';
  function sl(id, label){ return '<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:46px;font-size:13px;font-weight:700">'+label+'</span><input type="range" id="'+id+'" min="0" max="1000" step="2" style="flex:1"></div>'; }
  ov.innerHTML = '<div style="background:#fff;border-radius:20px;padding:14px;max-width:420px;width:100%;max-height:94vh;overflow:auto">'+
    '<div style="font-weight:800;font-size:16px;text-align:center;margin-bottom:8px">✂️ 그림 영역 조절</div>'+
    '<canvas id="ogcv" style="width:100%;border-radius:10px;border:2px solid #ddd;display:block"></canvas>'+
    '<div class="ognote" style="margin:8px 0">빨간 테두리의 <b>모서리나 변</b>을 손가락으로 끌어서 맞춰요. 안쪽을 끌면 통째로 옮겨져요.</div>'+
    '<details class="ogfine"><summary>⚙️ 세밀하게 조절 ▾</summary>'+sl('ogT','위')+sl('ogB','아래')+sl('ogL','왼쪽')+sl('ogR','오른쪽')+'</details>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="ogNo" style="flex:1">취소</button><button class="btn primary" id="ogOk" style="flex:1">✅ 이 영역으로</button></div></div>';
  document.body.appendChild(ov);
  var cv = ov.querySelector('#ogcv'), T = ov.querySelector('#ogT'), B = ov.querySelector('#ogB'), L = ov.querySelector('#ogL'), R = ov.querySelector('#ogR');
  function paint(){
    if(!img.width) return;
    var W = 400, H = Math.round(400*img.height/img.width);
    cv.width = W; cv.height = H;
    var c = cv.getContext('2d'); c.drawImage(img, 0, 0, W, H);
    var x0 = box[1]/1000*W, y0 = box[0]/1000*H, x1 = box[3]/1000*W, y1 = box[2]/1000*H;
    c.fillStyle = 'rgba(0,0,0,.5)';
    c.fillRect(0,0,W,y0); c.fillRect(0,y1,W,H-y1); c.fillRect(0,y0,x0,y1-y0); c.fillRect(x1,y0,W-x1,y1-y0);
    c.strokeStyle = '#E11D48'; c.lineWidth = 3; c.strokeRect(x0, y0, x1-x0, y1-y0);
    /* 끌 수 있는 손잡이 (모서리 4 + 변 가운데 4) */
    var hs = 9, mx = (x0+x1)/2, my = (y0+y1)/2;
    [[x0,y0],[x1,y0],[x0,y1],[x1,y1],[mx,y0],[mx,y1],[x0,my],[x1,my]].forEach(function(q){
      c.fillStyle = '#fff'; c.fillRect(q[0]-hs, q[1]-hs, hs*2, hs*2);
      c.lineWidth = 2.5; c.strokeRect(q[0]-hs, q[1]-hs, hs*2, hs*2);
    });
  }
  function sync(){ T.value = box[0]; B.value = box[2]; L.value = box[1]; R.value = box[3]; paint(); }
  var MINS = 40;
  T.oninput = function(){ box[0] = Math.min(+T.value, box[2]-MINS); sync(); };
  B.oninput = function(){ box[2] = Math.max(+B.value, box[0]+MINS); sync(); };
  L.oninput = function(){ box[1] = Math.min(+L.value, box[3]-MINS); sync(); };
  R.oninput = function(){ box[3] = Math.max(+R.value, box[1]+MINS); sync(); };
  /* 끌어서 자르기: 모서리·변을 끌면 크기, 안쪽을 끌면 위치 */
  var drag = null;
  cv.style.touchAction = 'none';
  function pt(e){ var r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*1000, y:(e.clientY-r.top)/r.height*1000, tol:Math.max(30, 26/r.width*1000)}; }
  cv.addEventListener('pointerdown', function(e){
    var q = pt(e), t = q.tol;
    var inX = q.x > box[1]-t && q.x < box[3]+t, inY = q.y > box[0]-t && q.y < box[2]+t;
    var m = {l: Math.abs(q.x-box[1]) < t && inY, r: Math.abs(q.x-box[3]) < t && inY, t: Math.abs(q.y-box[0]) < t && inX, b: Math.abs(q.y-box[2]) < t && inX};
    if(!m.l && !m.r && !m.t && !m.b){
      if(q.x > box[1] && q.x < box[3] && q.y > box[0] && q.y < box[2]) m.move = true; else return;
    }
    drag = {m: m, q0: q, b0: box.slice()};
    try{ cv.setPointerCapture(e.pointerId); }catch(er){}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function(e){
    if(!drag) return;
    var q = pt(e), dx = q.x - drag.q0.x, dy = q.y - drag.q0.y, b0 = drag.b0, m = drag.m;
    if(m.move){
      var w = b0[3]-b0[1], hh = b0[2]-b0[0];
      var nx = Math.max(0, Math.min(1000-w, b0[1]+dx)), ny = Math.max(0, Math.min(1000-hh, b0[0]+dy));
      box = [ny, nx, ny+hh, nx+w];
    } else {
      if(m.l) box[1] = Math.max(0, Math.min(b0[1]+dx, box[3]-MINS));
      if(m.r) box[3] = Math.min(1000, Math.max(b0[3]+dx, box[1]+MINS));
      if(m.t) box[0] = Math.max(0, Math.min(b0[0]+dy, box[2]-MINS));
      if(m.b) box[2] = Math.min(1000, Math.max(b0[2]+dy, box[0]+MINS));
    }
    box = box.map(Math.round); sync();
  });
  function endDrag(){ drag = null; }
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  img.onload = sync; img.src = it.src;
  function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.querySelector('#ogNo').onclick = close;
  ov.querySelector('#ogOk').onclick = function(){
    it.img = origCropToUrl(img, box, ORIG_IMG_SIDE, ORIG_IMG_QUALITY);
    it.box = box.slice(); it.how = 'manual'; it.dirty = true;
    close(); onApply();
  };
}

    function inkCount(){
      try{
        var d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, n = 0;
        for(var k = 3; k < d.length; k += 16) if(d[k] > 0) n++;
        return n;
      }catch(e){ return -1; }
    }
    var inkBase = inkCount();
    function inked(){ var n = inkCount(); return n < 0 || n > inkBase + 40; }
    document.getElementById('done').onclick = function(){
      if(!inked()){
        noSound();
        var tp = document.getElementById('tip');
        tp.innerHTML = '✏️ 먼저 아래 칸에 <b>영어 문장</b>을 써 주세요!'; tp.classList.add('ogwarn');
        return;
      }
      stopAll(); okSound();
      document.getElementById('mine').src = cv.toDataURL('image/png');
      document.getElementById('stW').hidden = true;
      document.getElementById('stG').hidden = false;
      window.scrollTo(0, 0);
    };
    document.getElementById('more').onclick = function(){
      stopAll();
      document.getElementById('stG').hidden = true;
      document.getElementById('stW').hidden = false;
    };
    /* ❌ = 하준이 글씨와 정답을 나란히 본 다음

       · 시험: 정답을 방금 봤으니 바로 베껴 쓰지 않게, 이 그림은 맨 뒤로 보내 나중에 다시 (마지막 그림이면 바로 다시) */
    var bar = document.querySelector('#stG .ogjudge'), hd = document.querySelector('#stG .oggrade-h');
    var judgeHtml = bar.innerHTML, headTxt = hd.textContent;
    function bindJudge(){
      document.getElementById('bad').onclick = onBad;
      document.getElementById('ok').onclick = onOk;
    }
    function restoreJudge(){   /* 잘못 눌렀을 때: 채점 화면 그대로 되돌리기 */
      hd.textContent = headTxt; hd.classList.remove('ogmiss');
      document.getElementById('more').hidden = false;
      bar.innerHTML = judgeHtml; bindJudge();
    }
    function onBad(){
      beep([300],.1); stopAll();
      hd.textContent = '😅 아쉬워요! 정답이랑 비교해 봐요'; hd.classList.add('ogmiss');

      var later = full && i < items.length - 1;
      bar.innerHTML = '<button class="btn ogundo" id="badundo" aria-label="채점 취소">↩ 취소</button>'+
        '<button class="btn primary ogdone" id="retry">'+(later ? '▶ 다음 그림 (나중에 다시)' : '✏️ 다시 써 볼게요')+'</button>';

    document.getElementById('pgrows').innerHTML = pageRowsHtml(lines);
    function collect(){
      meta.t = document.getElementById('pt').value;
      meta.by = document.getElementById('pb').value;

    document.getElementById('scan').onclick = function(){

        if(!got.length && !d.title){ noSound(); alert('사진에서 책 내용을 찾지 못했어요. 더 또렷한 사진으로 해보세요.'); return; }
        if(!String(meta.t||'').trim() && d.title) meta.t = String(d.title).trim();

        var at = got.length ? mergeScannedPages(lines, got) : 0;
        okSound(); draw(); if(got.length) scrollToPage(at);
        setTimeout(function(){ alert('✅ '+got.length+'쪽을 읽어서 '+(at?(at+1)+'쪽부터 이어 ':'')+'채웠어요. (지금 모두 '+lines.length+'쪽)\n쪽 순서와 글자가 맞는지 확인하고 고친 뒤 「책 등록하기」를 눌러 주세요.\n더 남은 사진은 「사진·PDF 더 추가해서 이어 입력」으로 넣으세요.'); }, 200);
      });
    };
    bindPageRows(lines, collect, draw);
    document.getElementById('save').onclick = function(){
      collect();

      if(!t){ noSound(); alert('책 제목을 꼭 넣어주세요.'); return; }
      var arr = lines.map(function(x){ return String(x||'').replace(/\s+/g,' ').trim(); });
      /* 끝쪽부터 빈 칸은 잘라내되, 최소 1쪽은 남긴다 (쪽수 = 칸 개수) */
      var last = arr.length-1;
      while(last>0 && !arr[last]) last--;
      arr = arr.slice(0, last+1);
      var pages = arr.length;
      PROG.papers.push({
        id: 'p'+Date.now(),
        e: (meta.e||'').trim() || '📕',
        t: t,
        by: (meta.by||'').trim() || '',
        ko: (meta.ko||'').trim() || '',
        pages: pages, read: 0, done: false,
        lines: arr
      });
      saveProgress(); okSound(); toast('📕'); screenSpecials();
    };
  }
  draw();
}

/* 종이책 읽기 — 한 쪽씩, 아빠가 ⭕ 해야 넘어간다. 진도는 저장된다. */
function screenPaper(b){
  /* 완독한 책은 처음부터 다시 읽게, 아니면 이어서 */

  function draw(){

        (function(){

          if(ln){

          }
          return '<div style="font-size:17px;margin-top:4px">쪽을 펴서 <b>소리내어</b> 읽어요</div>'+
            '<div class="readtip" style="margin-top:12px">📕 화면이 아니라 <b>책</b>을 보세요!<br>'+
              '<span style="font-size:13px">이 쪽은 문장이 등록 안 됐어요. 쪽수와 별만 세어줘요.</span></div>';
        })()+
      '</div>'+
      '<div class="judge">'+
        '<button class="btn no" id="no">❌ 다시 읽을래</button>'+
        '<button class="btn go" id="ok">⭕ 잘 읽었어요</button>'+
      '</div>'+
      '<div class="row" style="margin-top:10px">'+
        '<button class="btn" id="prev" style="flex:1"'+(i===0?' disabled':'')+'>◀ 앞쪽</button>'+
        '<button class="btn" id="jump" style="flex:1">↪ 쪽 고르기</button>'+
      '</div>'+
      '<button class="btn wide" id="edlines" style="margin-top:8px;font-size:14px">✏️ 책 문장 넣기/고치기 (아빠)</button>'+
      '<div class="muted" style="text-align:center;margin-top:10px">여기까지 읽은 건 저장돼요. 다음에 이어서 하면 됩니다.</div>';
    document.getElementById('back').onclick = function(){ stopAll(); screenSpecials(); };
    var ln = (b.lines||[])[i];
    if(document.getElementById('sayL')){
      var sayLine = function(rate){ speakWords(ln.split(/\s+/), rate||RATE, function(){}); };
      document.getElementById('sayL').onclick = function(){ sayLine(); };
      document.getElementById('slowL').onclick = function(){ sayLine(0.6); };
      /* 문장 속 단어를 눌러 그 단어만 듣고 메모 (책별로 저장) */

      var pwords = ln.split(' ');
      var psp = app.querySelectorAll('#pmp .sw');
      Array.prototype.forEach.call(psp, function(x, idx){
        paintNote(x, pKey, pwords[idx]);
        x.onclick = function(){
          var wd = pwords[idx];
          say(wd, 0.85);
          openWordNote(pKey, wd, this);

    }
    document.getElementById('prev').onclick = function(){ if(i>0){ stopAll(); i--; beep([420],.05); draw(); } };
    document.getElementById('jump').onclick = function(){
      var v = prompt('몇 쪽부터 할까요? (1~'+b.pages+')', String(i+1));
      var n = parseInt(v,10);
      if(n>=1 && n<=b.pages){ i=n-1; draw(); }

    document.getElementById('edlines').onclick = function(){ stopAll(); needDad(editLines, function(){ screenPaper(b); }); };
    document.getElementById('ok').onclick = function(){

  /* 아빠가 책 문장을 쪽마다 따로 입력/수정한다 (쪽 수만큼 입력칸) */
  function editLines(){
    var lines = (b.lines||[]).slice();
    while(lines.length < b.pages) lines.push('');
    if(!lines.length) lines = [''];
    function render(){
      app.innerHTML =
        '<div class="topbar"><button class="iconbtn" id="back">←</button><h2>✏️ 책 문장 넣기</h2><div style="width:44px"></div></div>'+
        '<div class="card" style="margin-bottom:10px">'+
          '<div class="muted"><b>'+esc(b.t)+'</b> · 칸 개수가 곧 <b>쪽수</b> (현재 <b id="pgcnt">'+lines.length+'</b>쪽)<br>'+
            '쪽마다 문장을 넣거나 고치세요. 넣은 쪽은 읽기 화면에 문장과 🔊 소리가 나와요.<br>'+
            '<b>비워두면</b> 그 쪽은 문장 없이 쪽수만 세어져요.</div>'+

        '<button class="btn wide" id="addpg" style="margin-bottom:14px">➕ 쪽 추가</button>'+

      function collect(){ Array.prototype.forEach.call(document.querySelectorAll('.pgin'), function(el){ lines[+el.dataset.pg] = el.value; }); }
      document.getElementById('back').onclick = function(){ draw(); };
      document.getElementById('addpg').onclick = function(){ collect(); lines.push(''); render(); };

      document.getElementById('scan').onclick = function(){

        scanImages('paper', function(d){
          var got = (d.pages||[]).map(function(x){ return String(x==null?'':x).replace(/\s+/g,' ').trim(); });
          if(!got.length){ noSound(); alert('사진에서 책 내용을 찾지 못했어요. 더 또렷한 사진으로 해보세요.'); return; }
          var at = mergeScannedPages(lines, got);
          okSound(); render(); scrollToPage(at);
          setTimeout(function(){ alert('✅ '+got.length+'쪽을 읽어서 '+(at?(at+1)+'쪽부터 이어 ':'')+'채웠어요. (지금 모두 '+lines.length+'쪽)\n확인하고 고친 뒤 「저장하기」를 눌러 주세요.'); }, 200);
        });
      };
      document.getElementById('save').onclick = function(){
        collect();
        var arr = lines.map(function(x){ return String(x||'').replace(/\s+/g,' ').trim(); });
        /* 끝쪽부터 빈 칸은 잘라내되 최소 1쪽 남긴다. 쪽수 = 칸 개수 */
        var last = arr.length-1;
        while(last>0 && !arr[last]) last--;
        arr = arr.slice(0, last+1);
        b.lines = arr;
        b.pages = arr.length;            /* 쪽수 자동 갱신 */
        if(b.read > b.pages) b.read = b.pages;
        saveProgress(); okSound(); toast('💾'); draw();
      };
    }
    render();
  }

  function finish(){
    var wasBefore = b.done;
    b.done = true; b.read = b.pages; saveProgress();
    pendAdd({key:'paper:'+b.id, k:'paper', id:b.id, re:!!wasBefore, lo:1, hi:wasBefore?3:STAR_PAPER, t:'📕 '+b.t});
    starSound(); confetti(40);
    var justGot = null, drawn = false;
    render();

    function render(){
      var reMode = wasBefore;
      var lo = 1, hi = reMode ? 3 : STAR_PAPER;

          '<div class="big">📕</div>'+

                  : '🏆 <b>새 트로피</b>! 그리고 별 <b>'+lo+'~'+hi+'개</b>를 뽑을 수 있어요!')+'</div>'+
                '<button class="drawbtn" id="pdraw">'+

                '</button>')+

      if(document.getElementById('pdraw')) document.getElementById('pdraw').onclick = function(){

          b.stars = prev + got; pendDone('paper:'+b.id);
          justGot = got; drawn = true; wasBefore = true; render(); checkFinal();
        }, lo, hi);
      };
      if(document.getElementById('again')) document.getElementById('again').onclick = function(){ i=0; draw(); };
      document.getElementById('lst').onclick = screenSpecials;

}

/* ===== 스페셜 읽기: 모르는 단어 듣기 + 메모 =====
   단어를 눌러 소리를 듣고, 아래에 작은 메모를 남길 수 있다.
   메모는 시(spId)별로 '단어'를 키로 저장 → 다시 누르면 그 메모가 나온다. */
function noteKey(w){ return String(w||'').toLowerCase().replace(/[^a-z']/g,''); }
function getNote(spId, w){
  var k = noteKey(w); if(!k) return '';
  var m = (PROG.wordNotes && PROG.wordNotes[spId]) || null;
  return (m && m[k]) ? m[k] : '';
}
function setNote(spId, w, text){
  var k = noteKey(w); if(!k) return;
  if(!PROG.wordNotes) PROG.wordNotes = {};
  if(!PROG.wordNotes[spId]) PROG.wordNotes[spId] = {};
  text = String(text||'').trim();
  if(text) PROG.wordNotes[spId][k] = text;
  else delete PROG.wordNotes[spId][k];   /* 비우면 메모 삭제 */
  saveProgress();
}
/* ── 모르는 단어 한글 발음 (구글 Gemini, 앱스스크립트 'hangul') ──
   단어를 누르면 소리와 함께 실제 미국식 한글 발음을 불러와 단어 아래에 큰 글씨로 계속 보여준다.
   다시 누르거나 ✕를 누르기 전에는 계속 보인다. 단어별로 진도(PROG.wpron)에 저장돼 모든 기기·모든 책에서 같다.
   (✏️ 를 누르면 메모도 남길 수 있다)
   조절 상수: WPRON_KEEP(저장해 두는 단어 발음 최대 개수) */
var WPRON_KEEP = 800;
var wpBusy = {};   /* 1 = 받아오는 중, 2 = 받는 중에 지움 */
/* 저장 형태: PROG.wpron[단어] = {p:'한글 발음', m:'한글 뜻'} (예전 글자 형태도 읽어준다) */
function wpGet(w){
  var k = noteKey(w); var o = (k && PROG.wpron) ? PROG.wpron[k] : null;
  if(!o) return null;
  if(typeof o === 'string') return {p:o, m:''};
  return o.p ? o : null;
}
/* 단어가 들어 있는 문장 — 문맥에 맞는 뜻을 고르는 데 쓴다 */
function wpCtx(el, w){
  try{
    var par = el && el.parentNode; if(!par) return w;
    var ws = [];
    Array.prototype.forEach.call(par.querySelectorAll('.sw'), function(e){ if(e.parentNode===par) ws.push(e._w || ''); });
    var t = ws.join(' ').replace(/\s+/g,' ').trim();
    return t.length>=String(w).length ? t.slice(0,300) : String(w);
  }catch(e){ return w; }
}
var wpTried = {};
function repaintWords(){
  Array.prototype.forEach.call(app.querySelectorAll('.sw'), function(el){
    if(el._sp !== undefined) paintNote(el, el._sp, el._w);
  });
}
function wpRemove(w){
  var k = noteKey(w);
  if(PROG.wpron) delete PROG.wpron[k];
  if(wpBusy[k]) wpBusy[k] = 2;
  saveProgress(); repaintWords();
}
function wpShow(w, el){
  var k = noteKey(w); if(!k) return;
  var clean = String(w).replace(/[^A-Za-z']/g,'');
  if(!clean) return;
  if(!hasServer){ alert('서버 연결이 안 돼서 한글 발음을 불러올 수 없어요.'); return; }
  wpBusy[k] = 1; repaintWords();
  apiPost({action:'word', pin:DAD_PIN, word:clean, ctx:wpCtx(el, w)}, function(j){
    var cancelled = (wpBusy[k] === 2);
    delete wpBusy[k];
    if(cancelled){ repaintWords(); return; }
    var v = j && j.ok && String(j.p||'').trim();
    if(v){
      if(!PROG.wpron) PROG.wpron = {};
      PROG.wpron[k] = {p:v, m:String(j.m||'').trim()};
      var ks = Object.keys(PROG.wpron);   /* 너무 많아지면 오래된 것부터 정리 */
      if(ks.length > WPRON_KEEP) ks.slice(0, ks.length-WPRON_KEEP).forEach(function(x){ delete PROG.wpron[x]; });
      saveProgress();
    } else {
      noSound(); alert(scanErrMsg(j).replace('사진 읽기','한글 발음'));
    }
    repaintWords();
  });
}
/* 단어를 눌렀을 때: 발음이 안 떠 있으면 한글 발음을 불러와 보여주고, 떠 있으면 지운다 */
function openWordNote(spId, w, el){
  var k = noteKey(w); if(!k) return;
  if(el){ el._sp = spId; el._w = w; }
  if(wpGet(w) || wpBusy[k] === 1){ wpRemove(w); return; }
  wpShow(w, el);
}
/* 예전에 뜻 없이 저장된 발음은 한 번만 뜻을 채운다 (조용히) */
function wpFillMeaning(w, el){
  var k = noteKey(w), o = wpGet(w);
  if(!o || o.m || wpTried[k] || !hasServer) return;
  wpTried[k] = 1;
  apiPost({action:'word', pin:DAD_PIN, word:String(w).replace(/[^A-Za-z']/g,''), ctx:wpCtx(el, w)}, function(j){
    var cur = PROG.wpron && PROG.wpron[k];
    if(!cur || !(j && j.ok && j.m)) return;
    if(typeof cur === 'string') cur = PROG.wpron[k] = {p:cur, m:''};
    cur.m = String(j.m).trim(); saveProgress(); repaintWords();
  });
}

/* 단어 아래에 한글 발음(큰 글씨)과 메모를 '항상' 표시한다. 없으면 표시를 지운다. */
function paintNote(el, spId, w){
  if(!el) return;
  el._sp = spId; el._w = w;
  var k = noteKey(w);
  var pr = wpGet(w), loading = (wpBusy[k] === 1);
  var pt = el.querySelector('.wpron');
  if(pr || loading){
    el.classList.add('haspron');
    if(!pt){
      pt = document.createElement('span'); pt.className = 'wpron';
      el.insertBefore(pt, el.querySelector('.wnote') || null);
    }
    pt.innerHTML =
      '<button class="wpx" data-x="1" title="지우기">✕</button>'+
      (loading
        ? '<span class="wrow"><span class="wph busy">불러오는 중…</span></span>'

    pt.onclick = function(ev){ ev.stopPropagation(); };

    var bx = pt.querySelector('[data-x]'); if(bx) bx.onclick = function(ev){ ev.stopPropagation(); wpRemove(w); };
    var bm = pt.querySelector('[data-m]'); if(bm) bm.onclick = function(ev){ ev.stopPropagation(); openWordMemo(spId, w, el); };
  } else {
    el.classList.remove('haspron');
    if(pt) pt.parentNode.removeChild(pt);
  }
  var note = getNote(spId, w);
  var tag = el.querySelector('.wnote');

  if(note){
    el.classList.add('hasnote');

    tag.onclick = function(ev){ ev.stopPropagation(); openWordMemo(spId, w, el); };

    el.classList.remove('hasnote');
    if(tag) tag.parentNode.removeChild(tag);
  }
}

function screenSpecial(sp){
  var i = 0, retry = 0;

  function head(){
    return '<div class="topbar">'+
        '<button class="iconbtn" id="sback">←</button>'+
        '<h2>'+sp.e+' '+esc(sp.t)+'</h2>'+

  }
  function bindB(){ document.getElementById('sback').onclick = function(){ stopAll(); screenSpecials(); }; }

  /* 1단계: 소리 없이 보여주기 */
  function ask(){
    stopAll();
    var st = sp.st[i];
    var flat = [];
    st.l.forEach(function(line){ line.split(' ').forEach(function(w){ flat.push(w); }); });
    app.innerHTML = head() +
      '<div class="card" style="text-align:center">'+
        '<div class="mute">🔇 소리 꺼짐</div>'+
        '<div style="font-size:52px;line-height:1">'+st.e+'</div>'+

          (function(){
            var n=0;

    bindB();
    /* 1단계에서도 단어를 눌러 듣고 메모 (메모 있는 단어는 점 표시) */
    var spans1 = app.querySelectorAll('.sw');
    Array.prototype.forEach.call(spans1, function(x){
      paintNote(x, sp.id, flat[+x.dataset.i]);
      x.onclick = function(){
        var w = flat[+this.dataset.i];
        say(w, 0.85);
        openWordNote(sp.id, w, this);
      };
    });
    prefetch(st.l.join(' ').split(' '));
    var b = document.getElementById('check'), t = 4;
    b.textContent = '⏳ 읽는 중… '+t;
    var iv = setInterval(function(){
      t--;
      if(t<=0){ clearInterval(iv); b.disabled=false; b.textContent='🔊 다 읽었어요! 확인하기'; }
      else b.textContent = '⏳ 읽는 중… '+t;
    }, 1000);
    b.onclick = function(){ clearInterval(iv); check(); };
  }

  /* 2단계: 들려주고 아빠가 판정 */
  function check(){
    var st = sp.st[i];
    var flat = [];
    st.l.forEach(function(line){ line.split(' ').forEach(function(w){ flat.push(w); }); });
    app.innerHTML = head() +
      '<div class="card" style="text-align:center">'+
        '<div class="dad">👨 아빠가 듣고 눌러주세요</div>'+
        '<div class="poem" id="pm" style="margin:10px 0">'+

            var n=0;

              return '<span class="pl">'+ line.split(' ').map(function(w){
                return '<span class="sw" data-i="'+(n++)+'">'+esc(w)+'</span>';
              }).join(' ') +'</span>';
            }).join('');
          })()+

      '</div>'+

        '<button class="btn go" id="ok">⭕ 잘 읽었어요</button>'+
      '</div>';
    bindB();
    var spans = app.querySelectorAll('.sw');
    /* 메모가 있는 단어는 점(•)으로 표시해 둔다 */
    Array.prototype.forEach.call(spans, function(x){
      var w = flat[+x.dataset.i];
      paintNote(x, sp.id, w);
    });
    Array.prototype.forEach.call(spans, function(x){
      x.onclick = function(){
        var w = flat[+this.dataset.i];
        say(w, 0.85);                 /* ① 그 단어만 소리 */
        openWordNote(sp.id, w, this); /* ② 메모 보기/쓰기 팝오버 */
      };
    });
    function hl(rate){
      speakWords(flat, rate||RATE, function(k){
        Array.prototype.forEach.call(spans, function(x){ x.classList.remove('hi'); });
        if(k>=0 && spans[k]) spans[k].classList.add('hi');
      });
    }
    document.getElementById('again').onclick = function(){ hl(); };
    document.getElementById('slow').onclick  = function(){ hl(0.6); };
    document.getElementById('no').onclick = function(){ beep([300],.1); retry++; stopAll(); ask(); };
    document.getElementById('ok').onclick = function(){
      okSound(); toast('⭕'); stopAll(); retry = 0; i++;
      if(i >= sp.st.length) pass(); else ask();
    };
    hl();
  }

  /* 통과! — 첫 통과는 별 1~10개, 재통과는 별 1~3개를 뽑는다 */
  function pass(){
    if(!PROG.spec) PROG.spec = {};
    var wasBefore = specPassed(sp.id);   /* 이번 통과 전에 이미 통과했었나 = 재테스트 */
    pendAdd({key:'spec:'+sp.id, k:'spec', id:sp.id, re:wasBefore, lo:1, hi:wasBefore?3:STAR_SPEC, t:'🌟 '+sp.t});
    confetti(50); starSound();
    var justGot = null, drawn = false;
    render();

    function render(){
      var rec = PROG.spec[sp.id] || {};
      var reMode = wasBefore;
      var lo = 1, hi = reMode ? 3 : STAR_SPEC;   /* 재테스트 1~3, 첫 통과 1~10 */
      app.innerHTML =
        '<div class="result">'+
          '<div class="big">🏆</div>'+
          '<h2>스페셜 테스트 통과!</h2>'+
          '<p>'+esc(sp.t)+'<br>'+esc(sp.ko)+'<br><b>'+(sp.st.length*4)+'줄을 다 읽었어요!</b></p>'+
          (justGot!==null
            ? '<div class="card" style="margin-bottom:12px;background:#FFF8E6;font-size:20px">'+
                (reMode?'🔁 다시 도전 성공!':'🎖️ 새 트로피!')+'<br>'+
                new Array(justGot+1).join('⭐')+'<br><b>별 '+justGot+'개</b>를 받았어요!</div>'
            : '<div class="card" style="margin-bottom:12px;background:#FFF8E6">'+
                (reMode
                  ? '🔁 <b>다시 도전 성공!</b> 별 <b>'+lo+'~'+hi+'개</b>를 뽑을 수 있어요!'
                  : '🎖️ <b>새 트로피</b>! 그리고 별 <b>'+lo+'~'+hi+'개</b>를 뽑을 수 있어요!')+'</div>'+
                '<button class="drawbtn" id="sdraw">'+
                  '<span class="spk" style="left:14px;top:10px">✨</span>'+
                  '<span class="spk" style="right:16px;top:12px;animation-delay:.5s">⭐</span>'+
                  '<span class="spk" style="left:22px;bottom:10px;animation-delay:.9s">✨</span>'+
                  '🎰 별 뽑기!'+
                '</button>')+
          '<div class="card" style="margin-bottom:12px">'+
            sp.st.map(function(st){
              return '<div class="storyline done" style="text-align:center;font-size:13px">'+st.e+' '+esc(st.l.join(' / '))+'</div>';
            }).join('')+
          '</div>'+
          (drawn
            ? '<button class="btn primary wide" id="again2" style="margin-bottom:10px">🔁 처음부터 다시 (별 1~3개)</button>'
            : '')+
          '<button class="btn go wide" id="lst">🌟 목록으로</button>'+
        '</div>';
      if(document.getElementById('sdraw')) document.getElementById('sdraw').onclick = function(){
        modalStarDraw(function(got){
          var prev = (reMode && typeof rec.stars==='number') ? rec.stars : 0;
          PROG.spec[sp.id] = {passed:true, at:Date.now(), stars: prev + got}; pendDone('spec:'+sp.id);
          justGot = got; drawn = true; wasBefore = true; render(); checkFinal();
        }, lo, hi);
      };
      if(document.getElementById('again2')) document.getElementById('again2').onclick = function(){
        i=0; retry=0; stopAll(); ask();
      };
      document.getElementById('lst').onclick = screenSpecials;
    }
    if(wasBefore && justGot===null) checkFinal();
  }
  ask();
}

var G = null;

function startGame(L, act, custom){
  G = {L:L, act:act, i:0, correct:0, total:0, hints:0, qs:[], wrong:[], back:null};
  if(custom)             G.qs = custom.slice();
  else if(act==='learn') G.qs = L.items.slice();
  else if(act==='listen') G.qs = pickN(L.items, Math.min(8, L.items.length));
  else if(act==='build')  G.qs = pickN(L.items, Math.min(6, L.items.length));
  else if(act==='picture')G.qs = pickN(L.items.filter(function(x){return x.pic;}), 6);
  else if(act==='firstsound') G.qs = pickN(L.items.filter(function(x){return x.first!==false;}), 8);
  else if(act==='sentence'){ var sh = L.sentences.filter(function(x){ return x.split(' ').length<=6; });
                             G.qs = shuffle(sh.length?sh:L.sentences).slice(0,4); }
  else if(act==='read')     G.qs = L.story.p.slice();      /* 책 순서대로 */
  else if(act==='wordread') G.qs = pickN(L.items, Math.min(12, L.items.length));
  G.total = G.qs.length;
  renderQ();
}

function gameHead(label){
  var pct = Math.round(G.i / G.total * 100);
  return '<div class="topbar">'+
      '<button class="iconbtn" id="gback">←</button>'+
      '<h2>'+ACTS[G.act].ico+' '+ACTS[G.act].name+'</h2>'+
      '<div class="pill">'+(G.i+1)+'/'+G.total+'</div>'+
    '</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="q">'+label+'</div>';
}
function bindBack(){ document.getElementById('gback').onclick = function(){ stopAll(); (G.back || function(){ screenLevel(G.L); })(); }; }

function nextQ(){
  G.i++;
  if(G.i >= G.total) screenResult();
  else renderQ();
}

function renderQ(){
  var f = {learn:qLearn, listen:qListen, build:qBuild, picture:qPicture, sentence:qSentence, firstsound:qFirst, read:qRead, wordread:qWordRead}[G.act];
  f();
  bindBack();
}

    '<div class="row" style="margin-top:16px">'+

function qBuild(){
  var it = G.qs[G.i];
  var letters = it.w.split('');
  var bag = shuffle(letters.map(function(c,i){ return {c:c, id:i}; }));
  var placed = [];

  function draw(){

/* =========================================================
   10-B) 단계 테스트 (20문제 · 1문제 5점 · 90점 이상 통과)
   ========================================================= */
var T = null;
var PASS = 90;

function clean(w){ return w.replace(/[^A-Za-z]/g,'').toLowerCase(); }
/* 항목이 모자라도 20문제가 나오도록 섞어가며 뽑기 */
function cyc(arr, n){
  var out=[], pool=[];
  for(var i=0;i<n;i++){ if(!pool.length) pool=shuffle(arr); out.push(pool.pop()); }
  return out;
}
/* 20문제 중 14문제(70%)는 '글자를 읽어야만' 풀리는 문항으로 짠다.
   읽기 문항: lpic(글자→그림) · pic(단어→그림) · mean(단어→우리말 뜻) · cloze(문장→빈칸)
   듣기 문항: listen(소리→단어) · spell(소리→철자) · first(그림→첫글자)  */
var TEST_OPTS = 6;   /* 테스트는 6지선다 (찍기 25% → 17%) */
function makeTestQs(L){
  var qs=[], pics=L.items.filter(function(x){return x.pic;});
  var canFirst = L.items.filter(function(x){return x.first!==false;});
  if(L.type==='letters'){
    cyc(canFirst,14).forEach(function(it){ qs.push({t:'lpic',it:it}); });      /* 읽기 14 */
    cyc(L.items,3).forEach(function(it){ qs.push({t:'listen',it:it}); });
    cyc(canFirst,3).forEach(function(it){ qs.push({t:'first',it:it}); });
  } else if(pics.length >= TEST_OPTS){
    cyc(pics,8).forEach(function(it){ qs.push({t:'pic',it:it}); });            /* 읽기 8 */
    cyc(L.sentences,6).forEach(function(x){ qs.push({t:'cloze',s:x}); });      /* 읽기 6 */
    cyc(L.items,3).forEach(function(it){ qs.push({t:'listen',it:it}); });
    cyc(L.items,3).forEach(function(it){ qs.push({t:'spell',it:it}); });
  } else {                                    /* 그림이 없는 레벨 (사이트워드·어미) */
    cyc(L.sentences,8).forEach(function(x){ qs.push({t:'cloze',s:x}); });      /* 읽기 8 */
    cyc(L.items,6).forEach(function(it){ qs.push({t:'mean',it:it}); });        /* 읽기 6 */
    cyc(L.items,3).forEach(function(it){ qs.push({t:'listen',it:it}); });
    cyc(L.items,3).forEach(function(it){ qs.push({t:'spell',it:it}); });
  }
  return shuffle(qs);
}

function startTest(L){
  T = {L:L, qs:makeTestQs(L), i:0, correct:0, marks:[], lock:false};
  renderT();
}
function tHead(label){
  var pct = Math.round(T.i / T.qs.length * 100);
  var dots = '';
  for(var i=0;i<T.qs.length;i++){
    var m = T.marks[i];
    dots += '<div class="dot '+(m===1?'o':(m===0?'x':''))+'"></div>';
  }
  return '<div class="topbar">'+
      '<button class="iconbtn" id="tback">←</button>'+
      '<h2>🎯 단계 '+T.L.id+' 테스트</h2>'+
      '<div class="pill">'+(T.correct*5)+'점</div>'+
    '</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="q">'+(T.i+1)+'번 / 20문제 · '+label+'</div>';
}
function bindTBack(){
  document.getElementById('tback').onclick = function(){
    if(!confirm('테스트를 그만둘까요? 점수는 저장되지 않아요.')) return;
    stopAll();
    screenLevel(T.L);
  };
}
function tNext(){
  T.i++; T.lock=false;
  if(T.i>=T.qs.length) screenTestResult(); else renderT();
}

function tSpell(q){
  var it=q.it, letters=it.w.split('');
  var bag = shuffle(letters.map(function(c,i){ return {c:c,id:i}; }));
  var placed=[];
  function draw(){
    app.innerHTML = tHead('소리를 듣고 글자를 놓아요') +
      '<div class="card" style="text-align:center">'+
        '<div class="emoji" style="font-size:58px">'+it.e+'</div>'+
        '<div class="ko">'+esc(it.k)+'</div>'+
        '<div class="row"><button class="btn primary" id="play">🔊 듣기</button><button class="btn" id="slow">🐢 천천히</button></div>'+
        '<div class="slots">'+letters.map(function(_,i){
          var pl=placed[i];
          return '<div class="slot '+(pl?'filled':'')+'" data-i="'+i+'">'+(pl?esc(pl.c):'')+'</div>';
        }).join('')+'</div>'+
        '<div class="tiles">'+bag.map(function(t){
          var used = placed.some(function(x){ return x && x.id===t.id; });
          return '<button class="tile '+(used?'used':'')+'" data-id="'+t.id+'">'+esc(t.c)+'</button>';
        }).join('')+'</div>'+
      '</div>';
    bindTBack();
    document.getElementById('play').onclick = function(){ sayParts(blendOf(it), RATE); };
    document.getElementById('slow').onclick = function(){ sayParts(blendOf(it), 0.6); };
    on('.tile', function(){
      if(T.lock) return;
      var id=+this.dataset.id;
      if(placed.some(function(x){return x && x.id===id;})) return;
      var slot = letters.findIndex(function(_,i){ return !placed[i]; });
      if(slot<0) return;
      placed[slot]=bag.filter(function(x){return x.id===id;})[0];
      beep([600],.05);
      if(placed.filter(Boolean).length===letters.length) check(); else draw();
    });
    on('.slot', function(){
      if(T.lock) return;
      var i=+this.dataset.i;
      if(placed[i]){ placed[i]=null; beep([420],.05); draw(); }
    });
  }
  function check(){
    var made = letters.map(function(_,i){ return placed[i]?placed[i].c:''; }).join('');
    var ok = (made===it.w);
    draw();
    tAnswer(ok, function(){
      var box=app.querySelector('.slots');
      if(ok){ box.classList.add('pop'); sayParts(blendOf(it),RATE); }
      else { box.classList.add('shake'); box.innerHTML='<div class="word en small" style="width:100%;color:var(--berry-ink)">'+esc(it.w)+'</div>'; say(it.w,0.85); }
    });
  }
  draw();
}

function tCloze(q){
  var L=T.L, words=q.s.split(' ');
  var cands=[];
  words.forEach(function(w,i){
    var c=clean(w);
    if(L.items.some(function(x){ return x.w.toLowerCase()===c; })) cands.push(i);
  });
  if(!cands.length) cands = words.map(function(_,i){return i;}).filter(function(i){ return i>0; });
  /* 같은 단어가 문장에 두 번 나오면 한쪽만 가려도 다른 쪽에서 정답이 들린다 → 한 번만 나오는 단어를 먼저 고른다 */
  function times(c){ return words.filter(function(x){ return clean(x)===c; }).length; }
  var uniq = cands.filter(function(i){ return times(clean(words[i]))===1; });
  if(uniq.length) cands = uniq;
  var bi = cands[Math.floor(Math.random()*cands.length)];
  var ans = clean(words[bi]);
  /* 그래도 중복이면 모든 자리를 함께 가린다 */
  var idx = words.map(function(_,i){ return i; }).filter(function(i){ return clean(words[i])===ans; });
  var opts = shuffle(pickN(L.items.filter(function(x){ return x.w.toLowerCase()!==ans; }),TEST_OPTS-1).map(function(x){return x.w;}).concat([ans]));
  var shown = words.map(function(w,i){ return idx.indexOf(i)>=0 ? '<span style="color:var(--berry-ink)">____</span>' : esc(w); }).join(' ');

  app.innerHTML = tHead('문장을 듣고 빈칸을 채워요') +
    '<div class="card" style="text-align:center">'+
      '<div class="sent">'+shown+'</div>'+
      '<div class="row"><button class="btn primary" id="play">🔊 문장 듣기</button><button class="btn" id="slow">🐢 천천히</button></div>'+
    '</div>'+
    '<div class="opts">'+opts.map(function(o){
      return '<button class="opt en" data-w="'+esc(o)+'">'+esc(o)+'</button>';
    }).join('')+'</div>';
  /* 정답 단어는 들려주지 않는다 — 하준이가 문장을 읽어서 채워야 한다 */
  var parts = [], buf = [];
  words.forEach(function(w,i){
    if(idx.indexOf(i)>=0){ if(buf.length){ parts.push(buf.join(' ')); buf=[]; } parts.push({t:'hmmm', silent:true}); }
    else buf.push(w);
  });
  if(buf.length) parts.push(buf.join(' '));
  var play = function(){ sayParts(parts, RATE); };
  var muted = words.map(function(w,i){ return idx.indexOf(i)>=0 ? {t:'hmmm', silent:true} : w; });
  document.getElementById('play').onclick = play;
  document.getElementById('slow').onclick = function(){ sayParts(muted, 0.6); };
  setTimeout(play,300);
  on('.opt', function(){
    var self=this, ok=(clean(self.dataset.w)===ans);
    tAnswer(ok, function(){
      self.classList.add(ok?'ok':'no');
      if(!ok) Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(e){ if(clean(e.dataset.w)===ans) e.classList.add('ok'); });
      say(q.s, 0.8);
    });
  });
}

/* ⭐ 별 뽑기 — 단어/문장 테스트를 통과하면 별 1~5개를 뽑는다 */
/* ── 아직 안 뽑은 별 ──
   통과했는데 별 뽑기 전에 화면을 나가도 통과가 사라지지 않게, 통과하는 순간 PROG.pend 에 저장해 둔다.
   화면 안에서 뽑으면 pendDone 으로 지우고, 나갔다면 홈·원서 목록에서 pendDraw 로 뽑는다.
   p = {key, k:'quiz'|'sent'|'mm'|'orig'|'paper'|'spec', id, ids, re(다시 도전), lo, hi, t(제목)} */
function pendList(){ if(!PROG.pend) PROG.pend = []; return PROG.pend; }
function pendFind(key){ return pendList().filter(function(x){ return x.key === key; })[0]; }
function pendAdd(p){ p.at = Date.now(); PROG.pend = pendList().filter(function(x){ return x.key !== p.key; }).concat([p]); saveProgress(); }
function pendDone(key){ PROG.pend = pendList().filter(function(x){ return x.key !== key; }); saveProgress(); }
function pendAlive(p){   /* 대상이 지워졌으면 더는 보여주지 않는다 */
  if(p.k === 'quiz') return !!quizById(p.id);
  if(p.k === 'sent') return !!sentById(p.id);
  if(p.k === 'mm') return mimemal().some(function(m){ return (p.ids||[]).indexOf(m.id) >= 0; });
  if(p.k === 'orig') return !!origById(p.id);
  if(p.k === 'paper') return papers().some(function(b){ return b.id === p.id; });
  if(p.k === 'spec') return SPECIALS.some(function(x){ return x.id === p.id; });
  return false;
}
function pendApply(p, got){   /* 각 시험 화면의 별 뽑기와 똑같이 기록한다 */
  var prev;
  if(p.k === 'quiz'){ var q = quizById(p.id); if(q){ q.done = true; q.stars = got; } }
  else if(p.k === 'sent'){ var se = sentById(p.id); if(se){ se.done = true; se.stars = got; } }
  else if(p.k === 'mm'){
    var list = mimemal().filter(function(m){ return (p.ids||[]).indexOf(m.id) >= 0; });
    var per = list.length ? Math.floor(got/list.length) : 0, rem = got - per*list.length;
    list.forEach(function(m,i){ m.done = true; m.stars = per + (i<rem?1:0); });
  }
  else if(p.k === 'orig'){ var o = origById(p.id); if(o){ prev = (p.re && typeof o.stars==='number') ? o.stars : 0; o.done = true; o.at = Date.now(); o.stars = prev + got; } }
  else if(p.k === 'paper'){ var b = papers().filter(function(x){ return x.id === p.id; })[0]; if(b){ prev = (p.re && typeof b.stars==='number') ? b.stars : 0; b.stars = prev + got; } }
  else if(p.k === 'spec'){ if(!PROG.spec) PROG.spec = {}; var r = PROG.spec[p.id] || {}; prev = (p.re && typeof r.stars==='number') ? r.stars : 0; PROG.spec[p.id] = {passed:true, at:Date.now(), stars: prev + got}; }
}
function pendDraw(p, after){
  modalStarDraw(function(got){ pendApply(p, got); pendDone(p.key); if(after) after(got); checkFinal(); }, p.lo, p.hi);
}

      }).join('')+'</select></label>'+
      '<div class="muted" style="margin-top:4px">Google · Natural · Enhanced 가 붙은 목소리가 가장 좋아요.</div>';

    apiGet('voices', function(r){
      if(r === undefined) r = {error:'응답 없음'};
      (function(r){
      if(!r || r.error || !r.voices){
        w.innerHTML = '<div class="muted" style="color:var(--berry-ink)">목소리 목록을 못 받았어요: '+esc(r && r.error ? r.error : '알 수 없음')+'</div>';
        return;
      }
      var rank = function(n){
        if(/Chirp3-HD/i.test(n)) return 0;
        if(/Neural2/i.test(n))  return 1;
        if(/Wavenet/i.test(n))  return 2;
        if(/Studio|Polyglot/i.test(n)) return 3;
        return 4;
      };
      var vs = r.voices.slice().sort(function(a,b){ return rank(a.name)-rank(b.name) || a.name.localeCompare(b.name); });
      w.innerHTML = '<label>목소리 <select id="av" style="flex:1;padding:8px;border-radius:10px;border:2px solid var(--line);font-family:inherit">'+

      document.getElementById('av').onchange = function(){
        AIVOICE = this.value; PROG.tts.voice = AIVOICE; saveProgress();
        acache.clear(); sayParts([SND.c,'at','cat'], RATE);
      };
      })(r);
    });
  }
}

    ['진도 저장 위치', OFFLINE || !hasServer ? '📱 이 기기에만' : '☁️ 구글 + 📱 기기'],
    ['기기 저장(localStorage)', (function(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return '✅ 사용 가능'; }catch(e){ return '❌ 막힘 — 사파리 설정 확인'; } })()],
    ['영어 음성 개수', v.length ? '✅ '+v.length+'개' : '❌ 0개 (화면을 한 번 터치하면 잡히기도 해요)'],
    ['고른 목소리', voice ? voice.name : '(없음)'],
    ['AI 음성', hasServer ? (AI_OK ? '✅ 켜짐' : '⚪ 꺼짐 (API 키 없음)') : '⚪ 확인 불가'],
    ['소리 엔진', TTSMODE==='ai' ? 'AI 음성' : '기기 음성'],
    ['화면 버전', APP_VERSION],
    ['화면 크기', window.innerWidth+' × '+window.innerHeight],
    ['모은 별 / 지갑', totalStars()+' / '+walletStars()],
    ['별 내역', '놀이 '+actStars()+' + 레벨업 '+testStars()+' + 책 '+bookStars()+' + 스페셜 '+specStars()+' + 원서 '+origStars()+' + 종이책 '+paperStars()+' + 단어 '+quizStars()+' + 문장 '+sentStars()+' + 아빠 '+bonusStars()+' − 쓴 별 '+spentStars()],
    ['브라우저', navigator.userAgent]
  ];
  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="back">←</button><h2>🩺 진단</h2><div style="width:44px"></div></div>'+
    (OFFLINE
      ? '<div class="card" style="margin-bottom:12px;background:#FFF6DF;line-height:1.7">'+
          '<b>⚠️ 서버와 연결이 안 됩니다</b><div class="muted" style="margin-top:6px">'+
          '<b>아이패드·아이폰</b>이라면 대부분 이것 때문입니다:<br>'+
          '<b>설정 → 앱 → Safari → 고급 → 사이트간 추적 방지 끄기</b><br>'+
          '(또는 설정 → Safari → 개인정보 보호 → 사이트간 추적 방지 끄기)<br><br>'+
          '끄신 뒤 앱을 완전히 닫고 다시 열어주세요.</div></div>'
      : '<div class="card" style="margin-bottom:12px;background:#F0FDF4;text-align:center"><b>✅ 다 정상입니다</b></div>')+
    '<div class="sheet">'+ rows.map(function(r){
      return '<div style="padding:7px 0;border-bottom:1px solid var(--line)">'+
        '<div style="font-size:13px;color:var(--ink-soft)">'+esc(r[0])+'</div>'+
        '<div style="font-size:14px;word-break:break-all">'+esc(String(r[1]))+'</div></div>';
    }).join('') +'</div>'+
    '<div class="sheet">'+
      '<h3>⚠️ 오류 기록 '+ERRS.length+'건</h3>'+
      (ERRS.length
        ? '<div class="muted" style="word-break:break-all;line-height:1.7">'+ERRS.slice(-10).map(esc).join('<br>')+'</div>'
        : '<div class="muted">없어요 👍</div>')+
    '</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn primary" id="reload" style="flex:1">🔄 다시 열기</button>'+
    '<button class="btn" id="copy" style="flex:1">📋 내용 복사</button></div>';
  document.getElementById('back').onclick = screenSettings;
  document.getElementById('reload').onclick = function(){ location.reload(); };
  document.getElementById('copy').onclick = function(){
    var t = rows.map(function(r){ return r[0]+': '+r[1]; }).join('\n') + '\n오류: ' + ERRS.join(' | ');
    try{ navigator.clipboard.writeText(t); toast('📋'); }
    catch(e){ alert(t); }
  };
}

/* =========================================================
   12) 시작
   ========================================================= */
try{
  /* 화면을 숨기거나 닫을 때, 아직 못 올린 변경을 즉시 서버로 보낸다 */
  function flushNow(){ if(syncPending) { clearTimeout(saveTimer); flushSave(true); } }
  try{
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') flushNow(); });
    window.addEventListener('pagehide', flushNow);
    window.addEventListener('beforeunload', flushNow);
    /* 다시 화면이 보이면 못 올린 변경을 재시도 */
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && syncPending) flushSave(); });
  }catch(e){}
  loadProgress(screenIntro);
}catch(e){
  ERRS.push('부팅: '+e);
  try{ localLoad(); normProg(); screenIntro(); }catch(e2){ bootFail(e2); }
}
</script>
</body>
</html>
