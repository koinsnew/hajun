<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>영어랑 놀자!</title>
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어랑 놀자">
<meta name="application-name" content="영어랑 놀자">
<meta name="theme-color" content="#1E6CF2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2A33;
    --ink-soft:#6B6559;
    --sky:#4FA8F7;
    --grape:#2457C5;
    --mango:#FFB020;
    --melon:#22C55E;
    --berry:#FF5C8A;
    /* 글자용 진한 톤 — 흰 배경에서 4.5:1 이상 (밝은 원색은 테두리·배경·장식에만) */
    --mango-ink:#B45309;
    --melon-ink:#15803D;
    --berry-ink:#BE185D;
    --paper:#FFFFFF;
    --bg:#FFF9EE;
    --line:#E8DFCC;
    --shadow:3px 4px 0 rgba(43,42,51,.16);   /* A안: 얇은 연필 테두리 + 낮은 그림자 */
    --pencil:#2457C5; --crayon:#C92A2A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}   /* 버튼(.btn) 등 display 를 가진 요소도 hidden 이면 확실히 숨김 */
  html,body{margin:0;padding:0;height:100%}
  body{
    word-break:keep-all;overflow-wrap:break-word;
    font-family:'Gowun Dodum', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    background:#FFF9EE repeating-linear-gradient(180deg, transparent 0 31px, #F1E8D6 31px 32px);   /* 공책 종이 */
    background-attachment:fixed;
    overscroll-behavior:none;
  }
  .en{font-family:'Patrick Hand',sans-serif;font-weight:400;letter-spacing:.02em}
  #app{max-width:520px;margin:0 auto;padding:14px 14px 40px;min-height:100%}

  /* ---------- 공통 부품 ---------- */
  .btn{
    border:none;border-radius:18px;padding:14px 18px;font-family:inherit;font-size:18px;
    background:var(--paper);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,42,51,.14)}
  .btn:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
  .btn.primary{background:#2457C5;color:#fff;box-shadow:0 6px 0 #173C8C}
  .btn.primary:active{box-shadow:0 2px 0 #173C8C}
  .btn.go{background:#15803D;color:#fff;box-shadow:0 6px 0 #14532D}
  .btn.go:active{box-shadow:0 2px 0 #14532D}
  .btn.wide{display:block;width:100%}
  .btn[disabled]{opacity:.45;pointer-events:none}

  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .iconbtn{
    width:44px;height:44px;border-radius:14px;border:none;background:var(--paper);
    box-shadow:var(--shadow);font-size:20px;cursor:pointer;flex:none;
  }
  .iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,42,51,.14)}
  .topbar h2{margin:0;font-size:19px;flex:1;text-align:center}
  .pill{background:#fff;border-radius:999px;padding:6px 12px;font-size:15px;box-shadow:var(--shadow)}

  .card{background:var(--paper);border-radius:24px;padding:18px;box-shadow:var(--shadow)}

  /* ---------- 인트로 ---------- */
  .intro{text-align:center;padding-top:8vh}
  .intro .logo{font-size:64px;animation:bob 2.4s ease-in-out infinite}
  .intro .hsvg.logo{margin:0 auto 4px}
  .intro h1{font-size:34px;margin:8px 0 4px;letter-spacing:-.5px}
  .intro p{color:var(--ink-soft);font-size:16px;margin:0 0 26px}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}

  /* ---------- 홈: 레벨 목록 ---------- */
  .hero{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2457C5,#2563EB);
    color:#fff;border-radius:24px;padding:14px;box-shadow:0 6px 0 #1E4AA8;margin-bottom:12px}
  .hero .face{font-size:44px}
  .hero b{display:block;font-size:20px}
  .hero small{opacity:.9;font-size:14px}
  .hsvg{width:104px;height:137px;flex:none;display:block}
  .hsvg.lg{width:180px;height:237px;margin:0 auto}
  .hinfo{flex:1;min-width:0}
  .hinfo .nm{font-size:22px;line-height:1.2}
  .hinfo .ti{font-size:15px;opacity:.95;margin-bottom:8px}
  .hbar{height:10px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden;margin-bottom:4px}
  .hbar i{display:block;height:100%;background:var(--mango);border-radius:999px;transition:width .5s}
  .hinfo .cnt{font-size:13px;opacity:.9}

  .rw{margin-bottom:14px}
  .rw h3{margin:0 0 3px;font-size:17px}
  .rw .sub{color:var(--ink-soft);font-size:13px;margin-bottom:10px}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rchip{display:flex;align-items:center;gap:7px;background:#FBF6EA;border:2px solid var(--line);
    border-radius:14px;padding:8px 9px;font-size:13px;line-height:1.25;text-align:left;
    font-family:inherit;cursor:default;color:var(--ink-soft);width:100%}
  .rchip .ri{font-size:19px;flex:none;filter:grayscale(1);opacity:.5}
  .rchip .rn{flex:1;min-width:0}
  .rchip.won{background:#FFF8E6;border-color:var(--mango-ink);color:var(--ink);cursor:pointer}
  .rchip.won .ri{filter:none;opacity:1}
  .rchip.won .rn:after{content:' 획득!';color:var(--mango-ink)}
  .rchip.given{background:#F0FDF4;border-color:var(--melon-ink)}
  .rchip.given .rn:after{content:' 받음 ✅';color:var(--melon-ink)}
  .rule{display:flex;align-items:stretch;gap:5px;margin:0 0 12px}
  .rule .rs{flex:1;background:#E7EEFB;border:2px solid #C9D6F2;border-radius:14px;padding:8px 4px;text-align:center}
  .rule .rs b{display:block;font-size:22px;line-height:1.2}
  .rule .rs span{font-size:12px;line-height:1.3;color:var(--ink)}
  .rule .rs.hit{background:#FFF6DF;border-color:var(--mango-ink)}
  .rule .ra{align-self:center;color:var(--grape);font-size:17px;flex:none}

  .rchip.final{grid-column:1/-1;position:relative;overflow:hidden;padding:12px 11px;
    background:linear-gradient(135deg,#312E81,#1E4AA8 55%,#312E81);
    border:3px solid #FBBF24;color:#FDE68A;box-shadow:0 4px 0 #173C8C;cursor:default}
  .rchip.final .ri{filter:none;opacity:1;font-size:28px}
  .rchip.final .rn{font-size:15px;color:#FDE68A}
  .rchip.final .rn b{display:block;font-size:17px;color:#fff;letter-spacing:.3px}
  .rchip.final:after{content:'';position:absolute;top:0;left:-60%;width:38%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-18deg);animation:sweep 3s ease-in-out infinite}
  @keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
  .rchip.final.won{background:linear-gradient(135deg,#B45309,#FDE047 50%,#B45309);
    border-color:#FFF7CD;color:#4A2500;box-shadow:0 4px 0 #92400E;cursor:pointer;
    animation:goldpulse 1.7s ease-in-out infinite}
  .rchip.final.won .rn{color:#4A2500}
  .rchip.final.won .rn b{color:#3B1D00}
  @keyframes goldpulse{0%,100%{box-shadow:0 4px 0 #92400E, 0 0 0 0 rgba(251,191,36,.65)}
    50%{box-shadow:0 4px 0 #92400E, 0 0 0 10px rgba(251,191,36,0)}}

  .testbtn{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:20px;padding:16px;
    margin:14px 0 4px;font-family:inherit;text-align:left;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#C2410C,#DB2765);box-shadow:0 6px 0 #9A3412}
  .testbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #C2410C}
  .testbtn.lock{background:#E8DFCC;color:var(--ink-soft);box-shadow:0 6px 0 #E0D5BE;cursor:not-allowed}
  .testbtn .ico{font-size:30px;flex:none}
  .testbtn .t{flex:1}
  .testbtn .t b{display:block;font-size:18px}
  .testbtn .t small{font-size:13px}

  .dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#E8DFCC}
  .dot.o{background:var(--melon)}.dot.x{background:var(--berry)}

  .ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(43,42,51,.62);display:flex;align-items:center;
    justify-content:center;padding:18px;z-index:60;overflow:auto}
  .mod{background:#fff;border-radius:28px;padding:22px 20px;max-width:400px;width:100%;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.18);animation:popin .32s cubic-bezier(.2,1.4,.4,1)}
  @keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .mod h2{margin:6px 0 2px;font-size:26px}
  .mod p{color:var(--ink-soft);margin:4px 0 16px;font-size:16px}
  .reel{font-size:22px;background:#FBF6EA;border:3px dashed var(--line);border-radius:18px;
    padding:22px 10px;margin:12px 0;min-height:84px;display:flex;align-items:center;justify-content:center;gap:8px}
  .reel.hit{border-style:solid;border-color:var(--mango-ink);background:#FFF8E6;animation:pop .45s}
  .reel .e{font-size:34px}
  .lvup{font-size:20px;color:var(--grape)}
  .conf{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:70;overflow:hidden}
  .ov .conf{position:fixed;z-index:0}
  body:has(.result) > .conf{z-index:-1;-webkit-mask-image:linear-gradient(90deg,#000 0 14%,transparent 22% 78%,#000 86%);mask-image:linear-gradient(90deg,#000 0 14%,transparent 22% 78%,#000 86%)}   /* 결과 화면: 색종이는 카드·글자 뒤, 가운데(제목)는 비우고 양옆으로 */
  .ov .mod{position:relative;z-index:1}
  .cf{position:absolute;font-size:22px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
  .lvl{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 14px;
    box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;border:3px solid transparent;text-align:left;width:100%;font-family:inherit}
  .lvl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,42,51,.14)}
  .lvl .no{width:46px;height:46px;border-radius:14px;background:#E7EEFB;color:var(--grape);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .lvl .t{flex:1;min-width:0}
  .lvl .t b{display:block;font-size:17px}
  .lvl .t small{color:var(--ink-soft);font-size:13px}
  .lvl .stars{font-size:13px;color:var(--mango-ink);white-space:nowrap}
  .lvl.locked{opacity:.5;filter:grayscale(.6)}
  .lvl.done{border-color:#BBF7D0}

  /* ---------- 레벨 상세 ---------- */
  .actbtn{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:none;border-radius:20px;
    padding:14px;box-shadow:var(--shadow);margin-bottom:10px;font-family:inherit;text-align:left;cursor:pointer}
  .actbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,42,51,.14)}
  .actbtn .ico{font-size:30px;width:46px;text-align:center;flex:none}
  .actbtn .t{flex:1}
  .actbtn .t b{display:block;font-size:17px}
  .actbtn .t small{color:var(--ink-soft);font-size:13px}
  .actbtn .st{color:var(--mango);font-size:14px;white-space:nowrap}

  /* ---------- 게임 공통 ---------- */
  .bar{height:12px;background:#E8DFCC;border-radius:999px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--melon),#86EFAC);border-radius:999px;transition:width .3s}
  .q{text-align:center;color:var(--ink-soft);font-size:16px;margin:2px 0 12px}

  .word{font-size:56px;line-height:1.1;text-align:center;margin:6px 0}
  .word.small{font-size:40px}
  .emoji{font-size:88px;text-align:center;line-height:1.1}
  .ko{text-align:center;color:var(--ink-soft);font-size:17px;margin-top:4px}

  .chunks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
  .chunk{
    border:none;border-radius:16px;padding:12px 18px;font-family:'Patrick Hand',sans-serif;font-weight:400;
    font-size:30px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);
  }
  .chunk.onset{background:#FFE7B3;color:#8A5A00;box-shadow:0 5px 0 #E8C377}
  .chunk.rime{background:#CFE8FF;color:#0B4C86;box-shadow:0 5px 0 #93C5FD}
  .chunk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .chunk.pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22) translateY(-8px)}100%{transform:scale(1)}}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .opt{
    background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 8px;
    font-family:'Patrick Hand',sans-serif;font-weight:400;font-size:32px;cursor:pointer;box-shadow:var(--shadow);
  }
  .opt.pic{font-size:52px;font-family:inherit;padding:14px 8px}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,42,51,.14)}
  .opt.ok{background:#DCFCE7;border-color:var(--melon-ink)}
  .opt.no{background:#FFE4E6;border-color:var(--berry-ink);animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .shake{animation:shake .3s}

  .slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 10px;min-height:64px}
  .slot{
    width:54px;height:64px;border-radius:14px;border:3px dashed var(--line);background:#FBF6EA;
    display:flex;align-items:center;justify-content:center;font-family:'Patrick Hand',sans-serif;font-weight:400;font-size:30px;cursor:pointer;
  }
  .slot.filled{border-style:solid;border-color:var(--grape);background:#E7EEFB;color:var(--grape)}
  .slot.wide{width:auto;padding:0 12px;min-width:60px;font-size:22px;height:52px}
  .tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
  .tile{
    border:none;border-radius:14px;background:var(--mango);color:#5B3A00;box-shadow:0 5px 0 #D98D00;
    min-width:54px;height:60px;font-family:'Patrick Hand',sans-serif;font-weight:400;font-size:28px;cursor:pointer;padding:0 10px;
  }
  .tile.word{font-size:20px;height:52px}
  .tile:active{transform:translateY(3px);box-shadow:0 2px 0 #D98D00}
  .tile.used{visibility:hidden}

  .sent{font-family:'Patrick Hand',sans-serif;font-weight:400;font-size:26px;text-align:center;line-height:1.5}
  .qzrow{display:flex;gap:8px;align-items:stretch;margin-bottom:16px}
  .qzrow .qzbk{margin-bottom:0}
  .qzedit{flex:0 0 auto;width:52px;border:none;border-radius:16px;background:#E7EEFB;
    font-size:22px;cursor:pointer;box-shadow:0 6px 0 #D9CDB3}
  .qzedit:active{transform:translateY(2px);box-shadow:0 2px 0 #D9CDB3}
  .sw{display:inline-block;padding:2px 4px;border-radius:8px;cursor:pointer}
  .sw.hi{background:var(--mango);color:#fff}
  .sw.hasnote{background:#FFF3D6;box-shadow:inset 0 0 0 2px var(--mango);
    display:inline-flex;flex-direction:column;align-items:center;vertical-align:top}
  .wnote{display:block;margin-top:2px;font-family:'Noto Sans KR',sans-serif;font-weight:600;
    font-size:12px;line-height:1.25;color:var(--berry-ink);background:#fff;
    border:1.5px solid var(--mango);border-radius:8px;padding:1px 6px;max-width:150px;
    white-space:normal;word-break:break-word;cursor:pointer}
  .readtip{background:#FFF6DF;border:2px dashed var(--mango);border-radius:16px;padding:12px;
    font-size:15px;line-height:1.5;color:#8A5A00;margin-top:14px}
  .mute{display:inline-block;background:#E8DFCC;color:var(--ink-soft);border-radius:999px;
    padding:2px 10px;font-size:13px;margin-bottom:8px}
  .dad{display:inline-flex;align-items:center;gap:5px;background:#E0F2FE;color:#075985;
    border-radius:999px;padding:3px 11px;font-size:13px;margin-bottom:6px}
  .bigword{font-family:'Patrick Hand',sans-serif;font-weight:400;font-size:60px;line-height:1.1;
    color:var(--grape);margin:16px 0 8px;word-break:break-all}
  .judge{display:flex;gap:10px;margin-top:14px}
  .judge .btn{flex:1;font-size:18px;padding:17px}
  .btn.no{background:#FFE4E6;color:#9F1239;box-shadow:0 6px 0 #FDA4AF}
  .btn.no:active{box-shadow:0 2px 0 #FDA4AF}
  .misschip{display:inline-block;background:#FFE4E6;color:#9F1239;border-radius:10px;
    padding:4px 9px;margin:3px 3px 0 0;font-family:'Patrick Hand',sans-serif;font-size:15px}
  .misschip b{font-size:11px;opacity:.75;font-family:'Jua',sans-serif}
  .storyline{background:#FBF6EA;border-radius:12px;padding:7px 10px;margin-bottom:6px;
    font-family:'Patrick Hand',sans-serif;font-size:14px;color:var(--ink-soft);text-align:left}
  .storyline.now{background:#FFF6DF;color:var(--ink);font-weight:600}
  .storyline.done{background:#F0FDF4;color:#166534}
  .poem{font-family:'Patrick Hand',sans-serif;font-weight:400;font-size:25px;line-height:1.65;text-align:center}
  .poem .pl{display:block}
  /* 읽기 줄 구분선: 윗줄·아랫줄이 헷갈리지 않게 줄마다 점선을 긋는다 (RULE_* 는 아래 CSS 값으로 조절) */
  .rline{display:block;height:0;border-top:2px dashed #CDBF9F;margin:5px 4px 7px}
  .poem .pl + .pl{border-top:2px dashed #CDBF9F;margin-top:5px;padding-top:7px}
  .spbtn{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:20px;padding:14px;
    margin-bottom:10px;font-family:inherit;text-align:left;cursor:pointer;background:#fff;box-shadow:var(--shadow);
    border-bottom:6px solid #E8DFCC}
  .spbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,42,51,.14)}
  .spbtn.done{border-bottom-color:var(--mango-ink)}
  .spbtn .ico{font-size:32px;flex:none}
  .spbtn .t{flex:1}
  .spbtn .t b{display:block;font-family:'Patrick Hand',sans-serif;font-size:17px}
  .spbtn .t small{color:var(--ink-soft);font-size:13px}
  .stz{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .sz{width:22px;height:6px;border-radius:3px;background:#E8DFCC}
  .sz.on{background:var(--grape)}.sz.ok{background:var(--melon)}.sz.later{background:#F59E0B}
  .oglater{text-align:center;font-size:14px;color:#9A3412;background:#FFEDD5;border-radius:999px;padding:6px 12px;margin:-4px auto 10px;width:max-content;max-width:100%}
  .pbk{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:18px;padding:13px;
    margin-bottom:9px;font-family:inherit;text-align:left;cursor:pointer;background:#fff;
    box-shadow:var(--shadow);border-left:7px solid #7C9BE0}
  .pbk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,42,51,.14)}
  .pbk.done{border-left-color:var(--mango-ink)}
  .pbk .ico{font-size:28px;flex:none}
  .pbk .t{flex:1;min-width:0}
  .pbk .t b{display:block;font-family:'Patrick Hand',sans-serif;font-size:15px;line-height:1.25}
  .pbk .t small{color:var(--ink-soft);font-size:12px}
  .pgnum{font-family:'Patrick Hand',sans-serif;font-weight:400;font-size:78px;color:var(--grape);line-height:1}

/* 무슨 일이 있어도 흰 화면으로 두지 않는다. 오류는 기록해서 설정 > 진단에서 볼 수 있다. */
var ERRS = [];

/* ══════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════ */
var APP_VERSION = '2026.11.09 22:05';   /* 이 화면 파일의 버전 — 진단에서 확인 */

/* --- 앱스스크립트 REST 호출 --- */
function apiGet(action, cb){
  /* GET은 JSONP로 부른다 (GitHub 도메인 ↔ 앱스스크립트 크로스도메인 대응) */
  var name = '__pk_cb_' + (apiGet._n = (apiGet._n||0) + 1);
  var done = false;
  var t = setTimeout(function(){ if(done) return; done=true; cleanup(); cb(undefined); }, 12000);
  function cleanup(){ try{ delete window[name]; }catch(e){ window[name]=undefined; } if(sc&&sc.parentNode) sc.parentNode.removeChild(sc); clearTimeout(t); }
  window[name] = function(data){ if(done) return; done=true; cleanup(); cb(data); };
  var sc = document.createElement('script');
  sc.onerror = function(){ if(done) return; done=true; cleanup(); cb(undefined); };
  sc.src = GAS_URL + '?action=' + encodeURIComponent(action) + '&callback=' + name;
  document.head.appendChild(sc);
}
function apiPost(payload, cb, keepalive){
  /* POST는 text/plain 으로 보내 프리플라이트 없이 크로스도메인 동작 */
  var opt = { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) };
  if(keepalive) opt.keepalive = true;   /* 화면을 닫아도 전송 완료되게 */
  fetch(GAS_URL, opt).then(function(r){ return r.json(); })
    .then(function(j){ cb && cb(j); })
    .catch(function(e){ cb && cb(undefined, e); });
}
/* ── 동기화 상태 ──
   LOAD_BASE_SCORE: 부팅 때 채택한 진도의 '무게'. 이것보다 재앙적으로 줄면 서버에 안 쓴다.
   syncPending: 서버에 아직 못 올린 변경이 있음. syncRetry: 재시도 타이머. allowWipe: 의도한 초기화. */
var LOAD_BASE_SCORE = 0, syncPending = false, syncRetry = null, syncFailN = 0, allowWipe = false;
/* 서버에서 받은 진도에 '실제로 한 흔적'이 있는지 (빈 진도면 기기 것을 쓴다) */
function hasProgress(p){
  if(!p) return false;
  if(p.stars && Object.keys(p.stars).length) return true;
  var arrs = ['rewards','draws','quizzes','sents','bonus','cards','prizes','tests'];
  for(var i=0;i<arrs.length;i++){ if(p[arrs[i]] && p[arrs[i]].length) return true; }
  if(p.spec && Object.keys(p.spec).length) return true;
  if(p.books && Object.keys(p.books).length) return true;
  if(p.papers && p.papers.some && p.papers.some(function(b){ return b.read||b.done; })) return true;
  if(p.spent) return true;
  if(p.finalWon) return true;
  return false;
}
/* 진도의 '무게' — 더 진행된 쪽을 고르기 위한 점수 */
function progScore(p){
  if(!p) return -1;
  var n = 0;
  try{ n += Object.keys(p.stars||{}).length * 100; }catch(e){}
  ['rewards','draws','quizzes','sents','bonus','cards','prizes','tests'].forEach(function(k){ if(p[k]&&p[k].length) n += p[k].length; });
  if(p.spec) n += Object.keys(p.spec).length;
  if(p.books) n += Object.keys(p.books).length;
  if(p.papers && p.papers.forEach) p.papers.forEach(function(b){ if(b.read||b.done) n++; });
  n += (p.spent||0)/10;
  return n;
}

};
var DIGSND = { sh:SD('sh','shh','ʃ'), ch:SD('ch','chuh','tʃə'), th:SD('th','thuh','θ'),

}

var voice=null, RATE=0.9;
var TTSMODE='device';                 /* 'device' = 기기 음성 · 'ai' = Google Cloud AI 음성 */
var AIVOICE='en-US-Neural2-F';
var AI_OK=false;                      /* 서버에 API 키가 있는가 */
var acache=new Map();                 /* 같은 소리는 한 번만 받아온다 */
var curAudio=null;

/* --- 기기 음성: 되도록 좋은 목소리를 고른다 --- */
function voiceScore(v){
  var n=(v.name||'')+' '+(v.voiceURI||''), s=0;
  if(/en[-_]US/i.test(v.lang)) s+=40; else if(/^en/i.test(v.lang)) s+=15;
  if(/Google/i.test(n)) s+=30;
  if(/Natural|Neural|Online/i.test(n)) s+=28;
  if(/Enhanced|Premium/i.test(n)) s+=25;
  if(/Samantha|Aria|Jenny|Zira|Ava|Allison/i.test(n)) s+=12;
  if(/Compact|eSpeak|espeak/i.test(n)) s-=100;
  if(v.localService===false) s+=8;
  return s;
}
function allVoices(){
  var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return vs.filter(function(v){ return /^en/i.test(v.lang); })
           .sort(function(a,b){ return voiceScore(b)-voiceScore(a); });
}
function pickVoice(){
  try{
    var vs = allVoices(); if(!vs.length) return;
    /* PROG는 이 아래에서 만들어진다. 아이패드는 목소리를 바로 주기 때문에
       여기서 PROG를 그냥 읽으면 undefined를 건드려 앱 전체가 죽는다. */
    var want = (typeof PROG !== 'undefined' && PROG && PROG.tts) ? PROG.tts.dev : '';
    if(want){
      var m = vs.filter(function(v){ return v.name===want; })[0];
      if(m){ voice=m; return; }
    }
    voice = vs[0];
  }catch(e){ ERRS.push('pickVoice: '+e); }
}
try{
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
}catch(e){ ERRS.push('speechSynthesis init: '+e); }

function utter(text, rate){
  var u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate = rate || RATE; u.pitch = 1.05;
  if(voice) u.voice = voice;
  return u;
}

/* --- 공통 --- */
function P(x){ return (typeof x === 'string') ? {t:x} : x; }
function xesc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stopAll(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; }
}
function ssmlOf(parts, gap){
  var g = '<break time="'+(gap||330)+'ms"/>', out = '';
  parts.forEach(function(p, i){
    var prevSilent = i>0 && parts[i-1].silent;
    if(i>0 && !p.silent && !prevSilent) out += g;
    if(p.silent)      out += '<break time="750ms"/>';
    else if(p.ipa)    out += '<phoneme alphabet="ipa" ph="'+xesc(p.ipa)+'">'+xesc(p.L||p.t)+'</phoneme>';
    else              out += xesc(p.t);
  });
  return '<speak>'+out+'</speak>';
}
function playB64(b64, onEnd, onTime){
  var a = new Audio('data:audio/mp3;base64,'+b64);
  curAudio = a;
  if(onTime) a.ontimeupdate = function(){ onTime(a.currentTime); };
  a.onended = function(){ if(curAudio===a) curAudio=null; if(onEnd) onEnd(); };
  a.onerror = function(){ if(onEnd) onEnd(); };
  a.play().catch(function(){ if(onEnd) onEnd(); });
}
function aiFetch(ssml, rate, marks, cb){
  var ck = ssml+'|'+AIVOICE+'|'+rate+'|'+marks;
  if(acache.has(ck)){ cb(acache.get(ck)); return; }
  if(!hasServer){ cb(null); return; }
  apiPost({action:'tts', ssml:ssml, voice:AIVOICE, rate:rate, marks:marks}, function(r){
    if(!r || r.error || !r.audio){ cb(null); return; }
    if(acache.size > 400) acache.clear();
    acache.set(ck, r); cb(r);
  });
}
function useAI(){ return TTSMODE==='ai' && AI_OK && hasServer; }

/* --- 조각들을 차례로 읽어준다 (AI면 한 덩어리 SSML, 아니면 기기 음성) --- */
function sayParts(parts, rate){
  parts = parts.map(P);
  stopAll();
  var r = rate || RATE;
  if(useAI()){
    aiFetch(ssmlOf(parts), r, false, function(res){
      if(res) playB64(res.audio); else devParts(parts, r);
    });
  } else devParts(parts, r);
}
function devParts(parts, r){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  parts.forEach(function(p){ speechSynthesis.speak(utter(p.t, r)); });
}
function say(text, rate){ sayParts([text], rate); }

/* --- 문장을 읽으며 단어를 하나씩 짚어준다 --- */
function speakWords(words, rate, onWord, onEnd){
  stopAll();
  var r = rate || RATE;
  if(useAI()){
    var ssml = '<speak>'+words.map(function(w,i){ return '<mark name="w'+i+'"/>'+xesc(w); }).join(' ')+'</speak>';
    aiFetch(ssml, r, true, function(res){
      if(!res){ devWords(words, r, onWord, onEnd); return; }
      var mk = (res.marks||[]).map(function(m){ return {i:parseInt(String(m.markName).slice(1),10), t:m.timeSeconds||0}; })
                              .sort(function(a,b){ return a.t-b.t; });
      var last = -2;
      playB64(res.audio,
        function(){ onWord(-1); if(onEnd) onEnd(); },
        function(ct){
          if(!mk.length) return;
          var cur = -1;
          for(var i=0;i<mk.length;i++){ if(ct >= mk[i].t - 0.02) cur = mk[i].i; }
          if(cur!==last){ last=cur; onWord(cur); }
        });
    });
  } else devWords(words, r, onWord, onEnd);
}
function devWords(words, r, onWord, onEnd){
  if(!window.speechSynthesis){ if(onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  words.forEach(function(w,i){
    var u = utter(w, r);
    u.onstart = function(){ onWord(i); };
    u.onend = function(){ if(i===words.length-1){ onWord(-1); if(onEnd) onEnd(); } };
    speechSynthesis.speak(u);
  });
}
/* 단어 하나를 어떻게 끊어 읽을지 — 첫소리 + 나머지 + 통째로 */
function blendOf(it){
  if(it.bl) return it.bl.concat([it.w]);        /* 2음절·어미 단어 */
  if(!it.on && !it.ri) return [it.w];
  return onsetParts(it.on).concat([it.ri, it.w]);
}

/* 미리 받아두면 하준이가 누를 때 안 기다린다 */
function prefetch(parts){
  if(!useAI()) return;
  aiFetch(ssmlOf(parts.map(P)), RATE, false, function(){});
}

/* 효과음 (파일 없이 WebAudio) */
var actx=null;
function beep(freqs, dur){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var t = actx.currentTime;
    freqs.forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*dur);
      g.gain.exponentialRampToValueAtTime(.25,t+i*dur+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t+i*dur); o.stop(t+i*dur+dur);
    });
  }catch(e){}
}

/**
 * 사파리(아이패드/아이폰)에서 API 응답이 늦거나 막혀도
 * 성공도 실패도 알리지 않고 조용히 멈추는 일이 있다. 그러면 화면이 영영 흰색이 된다.
 * → 5초 안에 답이 없으면 기기 저장분으로 그냥 시작한다.
 */
function loadProgress(cb){
  var done = false;
  function fin(){
    if(done) return; done = true;
    try{ cb(); }catch(e){ ERRS.push('start: '+e); bootFail(e); }
  }
  if(!hasServer){ OFFLINE = true; localLoad(); applyProg(); fin(); return; }

  var timer = setTimeout(function(){
    if(done) return;
    OFFLINE = true;                 /* 서버가 조용하다 → 기기에 저장된 걸로 진행 */
    ERRS.push('서버 응답 없음(5초) → 오프라인으로 시작');
    var m = document.getElementById('bootmsg');
    if(m) m.textContent = '서버가 느려요. 그냥 시작할게요…';
    localLoad(); applyProg(); fin();
  }, 5000);

  try{
    apiGet('load', function(p, err){
      clearTimeout(timer);
      if(done){ return; }   /* 이미 타임아웃으로 시작했으면 서버 저장을 켜지 않는다 */
      if(p === undefined){
        OFFLINE = true; ERRS.push('진도 불러오기 실패: '+err); localLoad();
      } else {
        SERVER_LOADED = true;
        var local = readLocal();
        var sHas = hasProgress(p), lHas = hasProgress(local);

      LOAD_BASE_SCORE = progScore(PROG);   /* 이 값보다 재앙적으로 줄면 서버 저장을 막는다 */
      if(needPush && SERVER_LOADED && !OFFLINE){

      }
      try{

function flushSave(keepalive){

    apiPost({action:'save', prog:snapshot}, function(j, e){
      if(e || !j || j.ok===false){
        /* 실패 → 잠깐 뒤 재시도 (지수 백오프, 최대 30초). 세션을 영구 오프라인으로 만들지 않는다. */

        if(!r.width && !r.height) return;          /* 안 보이는 단어는 건너뜀 */
        if(minBottom === null){ minBottom = r.bottom; return; }
        if(r.top >= minBottom - 3){ starts.push(e); minBottom = r.bottom; }   /* 윗줄 단어들보다 아래 → 새 줄 */
        else minBottom = Math.min(minBottom, r.bottom);
      });
      starts.forEach(function(e){ var l = document.createElement('span'); l.className = 'rline'; c.insertBefore(l, e); });
    });
  }catch(e){}
  if(ruleObs) ruleObs.observe(app, {childList:true, subtree:true});
}

  var src = [];
  /* 단어장: 단어(w)를 불러 주고 영어 단어 + 한글 뜻(k)을 쓴다 */
  quizzes().forEach(function(q){
    var it = (q.items || []).filter(function(x){ return x && x.w; }).map(function(x){ return {en:x.w, ko:x.k || ''}; });
    if(it.length) src.push({k:'q', id:q.id, title:q.title, items:it, ico:'🔤'});
  });
  sents().forEach(function(s){ if(s.items && s.items.length) src.push({k:'s', id:s.id, title:s.title, items:s.items, ico:'📖'}); });
  origList().forEach(function(o){ if(o.items && o.items.length) src.push({k:'o', id:o.id, title:o.t || o.title || '원서', items:o.items, ico:'📘'}); });
  var rec = notes().slice(-5).reverse();
  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="back" aria-label="뒤로">←</button>'+
      '<h2>📒 테스트 노트</h2><div style="width:44px"></div></div>'+
    '<div class="card nthow">'+
      '<b>✏️ 이렇게 해요</b>'+
      '<ol><li>번호마다 문장을 듣고 (🔊 또는 아빠가 불러 줘요)</li><li><b>위 줄</b>에 영어 문장, <b>아래 줄</b>에 한글 뜻을 써요</li>'+
      '<li>아빠가 영어 따로, 뜻 따로 ⭕ / ╱ 채점!</li></ol>'+
    '</div>'+
    '<div class="homehd">📚 단어장 · 문장으로 시험 보기</div>'+
    (src.length ? src.map(function(x, i){
      return '<button class="qzbk ntpick" data-i="'+i+'">'+
        '<div class="ico">'+x.ico+'</div><div class="t"><b>'+esc(x.title)+'</b><small>'+(x.k==='q'?'단어 테스트':(x.k==='s'?'문장 암기':'원서'))+' · '+x.items.length+(x.k==='q'?'단어':'문장')+' 중 '+Math.min(NOTE_ROWS, x.items.length)+'개 · 🔊 불러 줘요</small></div>'+
        '<div class="ogarrow" aria-hidden="true">▶</div></button>';
    }).join('') : '<div class="card muted" style="text-align:center">아직 단어장·문장이 없어요. 「단어 테스트」 「문장 암기」 「원서 테스트」에서 아빠가 넣을 수 있어요.</div>')+
    '<div class="homehd">🗣️ 아빠가 불러 주기</div>'+
    '<button class="qzbk" id="free"><div class="ico">🗣️</div><div class="t"><b>자유 노트</b><small>아빠가 문장을 말해 주면 1번부터 '+NOTE_ROWS+'번까지 받아쓰기</small></div><div class="ogarrow" aria-hidden="true">▶</div></button>'+
    (rec.length ? '<div class="homehd">🗂️ 최근 점수</div><div class="card ntrec">'+
      rec.map(function(r){
        var d = new Date(r.at), sc = noteScore(r);
        return '<div class="ntrecrow"><span>'+(d.getMonth()+1)+'/'+d.getDate()+' · '+esc(r.t)+'</span><b class="'+(sc>=80?'hi':'')+'">'+
          (typeof r.e === 'number' ? '영어 '+r.e+' · 뜻 '+r.k+' / '+r.n+' · ' : '')+sc+'점</b></div>';
      }).join('')+'</div>' : '');
  document.getElementById('back').onclick = screenHome;
  document.getElementById('free').onclick = function(){ startNote(null, null); };
  on('.ntpick', function(){ var x = src[+this.dataset.i]; if(x) startNote(x, null); });
}

/* set: {title, items:[{en,ko}]} (없으면 자유 노트) · only: 이 문장들로만 (틀린 것 다시) */
function startNote(set, only){
  var items = only ? only.slice() : (set ? shuffle(set.items).slice(0, NOTE_ROWS) : []);
  var n = set ? Math.max(1, items.length) : NOTE_ROWS;
  var title = set ? set.title : '자유 노트';
  var mE = [], mK = [];        /* 영어·뜻 채점: 1=⭕ / 0=╱ / undefined=아직 */
  var phase = 'write', pad = null;

  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="back" aria-label="그만하기">←</button>'+
      '<h2>📒 '+esc(title)+(only?' · 다시':'')+'</h2><div class="pill" id="ntscore" aria-live="polite">'+n+'문장</div></div>'+
    '<div class="nttip">✏️ <b>위 줄 영어</b> · <b>아래 줄 한글 뜻</b> &nbsp;·&nbsp; ↕ 왼쪽 번호 칸을 밀면 위아래로 움직여요</div>'+
    '<div class="ntbook" id="book">'+
      '<div class="ntgut" id="gut"></div>'+
      '<div class="ntpage" id="page"><canvas id="ntink" role="img" aria-label="공책. 번호마다 위 줄에 영어 문장, 아래 줄에 한글 뜻을 써요"></canvas><canvas id="ntmark" aria-hidden="true"></canvas></div>'+
    '</div>'+
    '<div id="ntctl"></div>';
  document.getElementById('back').onclick = function(){
    if(pad && pad.count() && phase !== 'done' && !confirm('쓴 것이 지워져요. 그만할까요?')) return;
    stopAll(); screenNoteHome();
  };

  var HEAD = 46, W, RH;
  /* 공책 크기 정하기 — 화면을 가로로 돌리면 다시 맞춘다(쓴 글씨·채점은 그대로 늘려서 옮김) */
  function layout(){
    var page = document.getElementById('page'), W2 = Math.max(260, page.clientWidth || 320);
    var sc = Math.max(1, Math.min(1.45, W2/420));
    var EH = Math.round(NOTE_EN_H*sc), KH = Math.round(NOTE_KO_H*sc), RH2 = EH + KH, H = HEAD + n*RH2 + 6;
    var old = pad ? pad.dump() : null;
    if(old) ['ntink','ntmark'].forEach(function(id){ var c = document.getElementById(id), c2 = c.cloneNode(false); c.parentNode.replaceChild(c2, c); });   /* 예전 손글씨 입력 연결 끊기 */
    pad = notePad(document.getElementById('ntink'), document.getElementById('ntmark'), W2, H, {head:HEAD, eh:EH, kh:KH, n:n});
    if(old && W) pad.load(old.strokes.map(function(s){ return s.map(function(p){ return {x:p.x*W2/W, y: HEAD + (p.y-HEAD)*RH2/RH}; }); }));
    W = W2; RH = RH2;
    document.getElementById('gut').innerHTML = gutHtml();
    Array.prototype.forEach.call(app.querySelectorAll('.ntsay'), function(b){
      b.onclick = function(){ var it = items[+b.dataset.i]; if(it) speakWords(String(it.en).split(/\s+/), RATE, function(){}); };
    });
    if(old){ pad.enable(phase === 'write'); pad.marks(mE, mK); if(phase === 'grade') pad.onCellTap(cellTap); if(phase === 'done') pad.stamp(score().sc); }
  }
  var lastW = 0, rt = null;
  function onResize(){
    if(!document.getElementById('book')){ window.removeEventListener('resize', onResize); return; }
    clearTimeout(rt); rt = setTimeout(function(){ var w = document.getElementById('page').clientWidth; if(Math.abs(w - lastW) > 30){ lastW = w; layout(); } }, 250);
  }
  window.addEventListener('resize', onResize);

  /* 왼쪽 번호 칸 (🔊 + 번호) — 여기는 손가락으로 밀면 화면이 움직인다 */
  function gutHtml(){
  var gut = '<div class="ntgh" style="height:'+HEAD+'px"></div>';
  for(var i=0;i<n;i++){
    gut += '<div class="ntgrow" style="height:'+RH+'px">'+
      (set ? '<button class="ntsay" data-i="'+i+'" aria-label="'+(i+1)+'번 문장 듣기"><b>'+(i+1)+'</b><i>🔊</i></button>'
           : '<span class="ntnum">'+(i+1)+'</span>')+
    '</div>';
  }
  return gut;
  }
  layout(); lastW = W;

  writeCtl();
  function writeCtl(){
    phase = 'write'; pad.enable(true); document.getElementById('book').classList.remove('grading');
    document.getElementById('ntctl').innerHTML =
      '<div class="row ntbtns"><button class="btn" id="undo">↶ 한 획</button><button class="btn" id="clr">↺ 다 지우기</button></div>'+
      (set ? '<button class="btn wide" id="sayall" style="margin-bottom:10px">🔊 1번부터 차례로 듣기</button>' : '<div class="muted ntfree">👨 아빠가 1번부터 문장을 불러 주세요.</div>')+
      '<button class="btn primary wide" id="done">✋ 다 썼어요! 아빠 채점</button>';
    document.getElementById('undo').onclick = function(){ pad.undo(); };
    document.getElementById('clr').onclick = function(){ if(!pad.count() || confirm('다 지울까요?')) pad.clear(); };
    if(set) document.getElementById('sayall').onclick = function(){
      var i = 0;
      (function next(){
        if(i >= items.length || phase !== 'write') return;
        var it = items[i++];
        speakWords(String(it.en).split(/\s+/), RATE, function(){}, function(){ setTimeout(next, NOTE_SAY_GAP*1000); });
      })();
    };
    document.getElementById('done').onclick = function(){
      if(!pad.count()){ noSound(); toast('먼저 공책에 써 주세요 ✏️'); return; }
      stopAll(); gradeCtl();
    };
  }

  function gradeCtl(){
    phase = 'grade'; pad.enable(false); document.getElementById('book').classList.add('grading');
    beep([600,800], .06);
    var keyHtml = '';
    for(var i=0;i<n;i++){
      var it = items[i];
      keyHtml += '<div class="ntkey" data-row="'+i+'">'+
        '<div class="ntkhd"><span class="ntno">'+(i+1)+'</span>'+
          (it ? '<span class="ntans"><b class="en">'+esc(it.en)+'</b><small>'+esc(it.ko || '')+'</small></span>' : '<span class="ntans"><small class="muted">(아빠가 부른 문장)</small></span>')+
        '</div>'+
        '<div class="ntkbt">'+
          '<span class="ntlab">영어</span><button class="ntok" data-c="e" data-i="'+i+'" aria-label="'+(i+1)+'번 영어 맞음">⭕</button><button class="ntx" data-c="e" data-i="'+i+'" aria-label="'+(i+1)+'번 영어 틀림">╱</button>'+
          '<span class="ntlab">뜻</span><button class="ntok" data-c="k" data-i="'+i+'" aria-label="'+(i+1)+'번 뜻 맞음">⭕</button><button class="ntx" data-c="k" data-i="'+i+'" aria-label="'+(i+1)+'번 뜻 틀림">╱</button>'+
        '</div>'+
      '</div>';
    }
    document.getElementById('ntctl').innerHTML =
      '<div class="nthead">👨 아빠 차례! 번호마다 <b>영어</b>와 <b>뜻</b>을 따로 채점해 주세요 <small>(공책의 영어 줄·뜻 줄을 눌러도 ⭕ → ╱ 로 바뀌어요)</small></div>'+
      '<div class="card ntkeys">'+keyHtml+'</div>'+
      '<div class="row ntbtns"><button class="btn" id="allok">⭕ 남은 것 모두 맞음</button><button class="btn" id="more">✏️ 더 쓸래요</button></div>'+
      '<button class="btn go wide" id="fin" disabled>채점 끝! 점수 보기</button>';
    on('.ntok', function(){ setMark(this.dataset.c, +this.dataset.i, 1); });
    on('.ntx', function(){ setMark(this.dataset.c, +this.dataset.i, 0); });
    document.getElementById('allok').onclick = function(){ for(var i=0;i<n;i++){ if(mE[i] === undefined) setMark('e', i, 1); if(mK[i] === undefined) setMark('k', i, 1); } };
    document.getElementById('more').onclick = function(){ mE = []; mK = []; pad.marks(mE, mK); score(); writeCtl(); };
    document.getElementById('fin').onclick = finish;
    pad.onCellTap(cellTap);
    score();
  }
  function cellTap(c, i){
    if(phase !== 'grade') return;
    var m = c === 'e' ? mE : mK;
    setMark(c, i, m[i] === 1 ? 0 : (m[i] === 0 ? undefined : 1));
  }
  function setMark(c, i, v){
    if(phase !== 'grade') return;
    (c === 'e' ? mE : mK)[i] = v;
    if(v === 1) beep([880,1175], .05); else if(v === 0) beep([300,220], .05);
    pad.marks(mE, mK, c, i);
    var row = app.querySelector('.ntkey[data-row="'+i+'"]');
    if(row){
      row.querySelector('.ntok[data-c="'+c+'"]').classList.toggle('on', v === 1);
      row.querySelector('.ntx[data-c="'+c+'"]').classList.toggle('on', v === 0);
    }
    score();
  }
  function score(){
    var done = 0, e = 0, k = 0;
    for(var i=0;i<n;i++){
      if(mE[i] !== undefined) done++; if(mK[i] !== undefined) done++;
      if(mE[i] === 1) e++; if(mK[i] === 1) k++;
    }
    var p = document.getElementById('ntscore');
    if(p) p.textContent = phase === 'write' ? n+'문장' : '영 '+e+' · 뜻 '+k;
    var f = document.getElementById('fin');
    if(f){ f.disabled = done < n*2; f.textContent = done < n*2 ? '채점 '+done+' / '+(n*2)+' — 남은 칸을 채점해 주세요' : '채점 끝! 점수 보기'; }
    return {e:e, k:k, sc: Math.round((e+k)*100/(n*2))};
  }

  function finish(){
    var s = score();
    phase = 'done'; pad.enable(false);
    pad.stamp(s.sc);
    var wrong = []; for(var i=0;i<n;i++) if((mE[i] === 0 || mK[i] === 0) && items[i]) wrong.push(items[i]);
    if(!PROG.notes) PROG.notes = [];
    PROG.notes.push({id:'n'+Date.now(), at:Date.now(), t:title, n:n, e:s.e, k:s.k, sc:s.sc, w:wrong.map(function(x){ return x.en; })});
    if(PROG.notes.length > NOTE_KEEP) PROG.notes = PROG.notes.slice(-NOTE_KEEP);
    saveProgress();
    if(s.sc === 100){ starSound(); confetti(60); } else if(s.sc >= 80){ okSound(); confetti(26); } else okSound();
    var msg = s.sc === 100 ? '🏆 백 점! 완벽해요!' : s.sc >= 80 ? '🎉 아주 잘했어요!' : s.sc >= 50 ? '👍 좋아요! 틀린 것만 다시 해 봐요' : '💪 괜찮아요! 틀린 것만 다시 연습해요';
    document.getElementById('ntctl').innerHTML =
      '<div class="card ntres" role="status"><div class="ntbig">'+s.sc+'<small>점</small></div>'+
        '<div class="ntsplit"><span>🇺🇸 영어 <b>'+s.e+'</b> / '+n+'</span><span>🇰🇷 뜻 <b>'+s.k+'</b> / '+n+'</span></div>'+
        '<div class="ntmsg">'+msg+'</div></div>'+
      (wrong.length ? '<button class="btn primary wide" id="again" style="margin-bottom:10px">🔁 틀린 '+wrong.length+'문장만 다시 쓰기</button>' : '')+
      '<button class="btn wide" id="new" style="margin-bottom:10px">📒 새 노트</button>'+
      '<button class="btn go wide" id="home">🏠 홈으로</button>';
    if(document.getElementById('again')) document.getElementById('again').onclick = function(){ startNote(set, wrong); };
    document.getElementById('new').onclick = screenNoteHome;
    document.getElementById('home').onclick = screenHome;
    var p = document.getElementById('ntscore'); if(p) p.textContent = s.sc+'점';
    setTimeout(function(){ var r = app.querySelector('.ntres'); if(r && r.scrollIntoView) r.scrollIntoView({behavior:'smooth', block:'center'}); }, 250);
  }
}
var NOTE_SAY_GAP = 9;     /* 「차례로 듣기」: 문장 사이 쉬는 시간(초) — 쓸 시간 */

/* ── 공책 캔버스: 바탕(번호마다 영어 4선 줄 + 한글 뜻 줄) + 손글씨 + 위 캔버스에 채점 표시 ── */
function notePad(cv, mk, W, H, g){
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  [cv, mk].forEach(function(c){ c.width = W*DPR; c.height = H*DPR; c.style.width = W+'px'; c.style.height = H+'px'; });
  var ctx = cv.getContext('2d'), mx = mk.getContext('2d');
  ctx.scale(DPR, DPR); mx.scale(DPR, DPR);
  var RH = g.eh + g.kh;
  var strokes = [], cur = null, enabled = true, cellTap = null, ME = [], MK = [], stampSc = null, anim = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function cellBox(c, i){ var y0 = g.head + i*RH; return c === 'e' ? {x:6, y:y0+3, w:W-12, h:g.eh-4} : {x:6, y:y0+g.eh+1, w:W-12, h:g.kh-5}; }

  function paper(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#FFFDF7'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#EEF3FC'; ctx.fillRect(0, 0, W, g.head);
    ctx.fillStyle = '#1E4AA8'; ctx.font = '400 17px Jua, sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillText('📒 위 줄: 영어 문장  ·  아래 줄: 한글 뜻', 12, g.head/2);
    for(var i=0;i<g.n;i++){
      var y0 = g.head + i*RH;
      /* 영어 4선 */
      var t = y0 + g.eh*0.17, band = g.eh*0.22;
      hl(10, W-10, t, '#D5DCEC', 1.1);
      hl(10, W-10, t+band, '#DFE4F0', 1.1, [6,6]);
      hl(10, W-10, t+band*2, '#F2A7A7', 1.6);
      hl(10, W-10, t+band*3, '#D5DCEC', 1.1);
      /* 한글 뜻 줄 */
      ctx.fillStyle = '#F8F4EA'; ctx.fillRect(0, y0+g.eh, W, g.kh);
      ctx.fillStyle = '#A39A86'; ctx.font = '400 13px Jua, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('뜻', 10, y0 + g.eh + 6);
      hl(32, W-10, y0 + g.eh + g.kh*0.78, '#CDBF9F', 1.3, [3,4]);
      hl(0, W, y0 + g.eh, '#E6DCC8', 1);
      hl(0, W, y0 + RH, '#B9AD92', 1.6);
    }
    hl(0, W, g.head, '#2457C5', 1.6);
  }
  function hl(x1, x2, y, c, w, dash){ ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke(); ctx.restore(); }
  function ink(s){
    ctx.save(); ctx.strokeStyle = '#1F2A44'; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); s.forEach(function(p, i){ if(i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
    if(s.length === 1) ctx.lineTo(s[0].x+0.1, s[0].y+0.1);
    ctx.stroke(); ctx.restore();
  }
  function redraw(){ paper(); strokes.forEach(ink); }
  redraw();

  function pos(e){ var r = mk.getBoundingClientRect(), t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e; return {x:(t.clientX - r.left)*W/r.width, y:(t.clientY - r.top)*H/r.height}; }
  function down(e){
    if(!enabled){
      if(cellTap){ var p = pos(e), i = Math.floor((p.y - g.head)/RH); if(i >= 0 && i < g.n) cellTap((p.y - g.head - i*RH) < g.eh ? 'e' : 'k', i); }
      return;
    }
    e.preventDefault(); cur = [pos(e)]; strokes.push(cur); ink(cur);
  }
  function move(e){ if(!cur) return; e.preventDefault(); var p = pos(e), l = cur[cur.length-1]; if(Math.abs(p.x-l.x) + Math.abs(p.y-l.y) < 1.2) return; cur.push(p);
    ctx.save(); ctx.strokeStyle = '#1F2A44'; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.restore(); }
  function up(){ cur = null; }
  mk.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  mk.addEventListener('touchstart', down, {passive:false}); mk.addEventListener('touchmove', move, {passive:false}); mk.addEventListener('touchend', up);

  /* ── 채점 표시: ⭕ 칸을 감싸는 빨간 동그라미 / ╱ 칸을 가로지르는 빗금 ── */
  function oneMark(v, b, k, seed){
    if(v === 1){
      mx.lineWidth = 3.8; mx.beginPath();
      var rx = b.w/2, ry = b.h*0.5, cx = b.x + b.w/2 + 2, cy = b.y + b.h/2, end = -2.4 + (Math.PI*2 + 0.35)*k, first = true;
      for(var a = -2.4; a <= end; a += 0.05){
        var wob = 1 + Math.sin(a*3 + seed)*0.022;
        var x = cx + Math.cos(a)*rx*wob, y = cy + Math.sin(a)*ry*wob + Math.cos(a)*2;
        if(first){ mx.moveTo(x, y); first = false; } else mx.lineTo(x, y);
      }
      mx.stroke();
    } else if(v === 0){
      mx.lineWidth = 5; mx.beginPath();
      var x1 = b.x + 14, y1 = b.y + b.h - 6, x2 = b.x + b.w - 14, y2 = b.y + 6;
      mx.moveTo(x1, y1); mx.lineTo(x1 + (x2-x1)*k, y1 + (y2-y1)*k); mx.stroke();
    }
  }
  function drawMarks(prog, c0, i0){
    mx.clearRect(0, 0, W, H);

    }

      mx.save(); mx.translate(W - 14, g.head + 4); mx.rotate(-0.12);

      mx.fillStyle = '#D6336C'; mx.fillText(String(stampSc), 0, 0);
      mx.lineWidth = 3; mx.beginPath(); mx.moveTo(-tw-4, 8); mx.lineTo(4, 6); mx.moveTo(-tw, 15); mx.lineTo(8, 13); mx.stroke();

  return {
    count: function(){ return strokes.length; },
    dump: function(){ return {strokes: strokes}; },
    load: function(s){ strokes = s; redraw(); },
    undo: function(){ strokes.pop(); redraw(); },
    clear: function(){ strokes = []; redraw(); },
    enable: function(b){ enabled = b; cv.parentNode.classList.toggle('locked', !b); },
    onCellTap: function(fn){ cellTap = fn; },
    marks: function(e, k, c, i){

/* ⚽ 페널티킥 — 진짜 축구처럼: 공을 손가락으로 쭉 밀어서(스와이프) 찬다.
   · 방향: 밀어 올린 방향 = 공이 가는 쪽
   · 세기: 길게 밀수록 세고 높게 (너무 길면 크로스바 위로!)
   · 골대 안을 톡 눌러도 그쪽으로 찬다
   골키퍼는 PK_KEEPER_SKILL 확률로 공 쪽을 맞혀 몸을 날린다. 맞혀도 구석 높은 공·빠른 공은 못 막는다. */
function screenPKGame(){
  var shot = 0, goals = 0, game = null;
  shotLog = []; var kinds = [];
  app.innerHTML =
    '<div class="topbar">'+
      '<button class="iconbtn" id="back" aria-label="그만하기">←</button>'+
      '<h2>⚽ 페널티킥</h2>'+
      '<div class="pill" id="pkpill">0/'+PK_SHOTS+'</div>'+
    '</div>'+
    '<div class="pkboard" id="score"></div>'+
    '<div class="pkfield" id="field"><canvas id="pkcv" role="img" aria-label="페널티킥 경기장. 공을 위로 쭉 밀거나 골대 안을 눌러서 슛!"></canvas>'+
      '<div class="pkgoalflash" id="flash">GOAL!</div></div>'+
    '<div class="pkmsg" id="msg" role="status">공을 손가락으로 <b>골대 쪽으로 쭉</b> 밀어서 슛! ⚽</div>'+

    if(confirm('게임을 그만둘까요? 낸 별 '+PK_PRICE+'개는 돌려받지 못해요.')){ if(game) game.stop(); screenHome(); }
  };
  board();
  game = pkGame(document.getElementById('pkcv'), function(res){
    shot++; shotLog[shot-1] = res.goal; kinds[shot-1] = res.kind;
    if(res.goal) goals++;
    var msg = document.getElementById('msg'), flash = document.getElementById('flash');
    if(!msg) return;
    msg.innerHTML = pkSay(res);
    if(res.goal){ flash.classList.remove('show'); void flash.offsetWidth; flash.classList.add('show'); confetti(24); }
    board();
    setTimeout(function(){
      if(!document.getElementById('pkcv')) return;
      if(shot >= PK_SHOTS){ game.stop(); finish(); }
      else { game.reset(shot); msg.innerHTML = (PK_SHOTS-shot===1 ? '🔥 <b>마지막 슛!</b> ' : '')+'다음 슛! 공을 쭉 밀어요 ⚽'; }
    }, res.goal ? 2300 : 1900);

  function board(){

    document.getElementById('score').innerHTML =
      '<div class="pkteam"><span>하준 FC</span><b>'+goals+'</b></div>'+
      '<div class="pkdots">'+dots+'</div>'+

  function finish(){

        '<div class="big">'+(won?'🏆':'😅')+'</div>'+

        '<p>'+PK_SHOTS+'번 차서 <b>'+goals+'골</b>을 넣었어요!<br>'+
          (won ? '<b style="color:var(--melon-ink)">'+PK_WIN_NEED+'골 이상 성공! 상품을 뽑으세요! 🎁</b>'
               : PK_WIN_NEED+'골 이상 넣으면 상품을 받아요. 다시 도전해봐요!')+'</p>'+

        (won ? '<button class="drawbtn" id="pzdraw">'+

    if(document.getElementById('pzdraw')) document.getElementById('pzdraw').onclick = function(){
      modalPrizeDraw(function(pz){
        if(!PROG.prizes) PROG.prizes = [];
        PROG.prizes.push({id:'z'+Date.now(), pid:pz.id, at:Date.now(), used:false});
        saveProgress();
        var o = openMod('<div style="font-size:60px">'+pz.e+'</div>'+
          '<h2>상품 획득!</h2><p><b>'+pz.n+'</b>을(를) 받았어요!<br>가방에서 확인하세요 🎒</p>'+

var shotLog = [];
var PK_KIND_TXT = {goal:'⚽ 골인!', top:'⚽ 구석 골인!', save:'🧤 선방', post:'🥅 골대', bar:'🥅 크로스바', over:'☁️ 위로', wide:'↔️ 옆으로'};
/* 중계 멘트 — 결과마다 다음에 어떻게 차면 좋을지 힌트도 */
function pkSay(r){
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  if(r.kind==='top') return '<b class="pkg">⚽ 구석에 꽂혔다!! 골키퍼 손이 안 닿아요! 🎉</b>';
  if(r.kind==='goal') return '<b class="pkg">'+pick(['⚽ 골~~~인!! 하준 선수 최고! 🎉','⚽ 골인!! 키퍼가 반대로 날았어요! 🎉','⚽ 들어갔다~!! 관중들이 난리 났어요! 🎉'])+'</b>';
  if(r.kind==='save') return '<b class="pkm">🧤 골키퍼 선방!</b> '+(r.guess ? '방향을 읽었어요. 다음엔 반대쪽이나 더 구석으로!' : '몸에 맞았어요. 가운데는 위험해요!');
  if(r.kind==='post') return '<b class="pkm">🥅 땡! 골대 맞았다!</b> 아까워~ 조금만 안쪽으로!';
  if(r.kind==='bar') return '<b class="pkm">🥅 쾅! 크로스바!</b> 조금만 살살 차 봐요!';
  if(r.kind==='over') return '<b class="pkm">☁️ 공이 하늘로~</b> 너무 세게 찼어요. 조금 짧게 밀어 봐요!';
  return '<b class="pkm">↔️ 골대 옆으로 나갔어요!</b> 방향을 조금 안쪽으로!';
}

/* ── 경기장 엔진: 원근 카메라로 그린 캔버스 (단위 m, 공 = 페널티 스폿 z=0, 골라인 z=11) ── */
function pkGame(cv, onResult){
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var W = Math.max(280, cv.parentNode.clientWidth || 340), H = Math.round(W * 1.18);
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px';
  var ctx = cv.getContext('2d'); ctx.scale(DPR, DPR);
  var GW = 3.66, GH = 2.44, GZ = 11, ND = 1.9, BR = 0.11;   /* 골대 반폭·높이·거리·그물 깊이·공 반지름 */
  var camZ = -3.4, camY = 1.5, F = W*1.55, HY = H*0.40;
  function P(x, y, z){ var d = Math.max(0.3, z - camZ); return {x: W/2 + F*x/d, y: HY - F*(y-camY)/d, s: F/d}; }
  /* 골대 면(z=GZ)의 화면 좌표 → 월드 (톡 눌러 조준) */
  function unP(sx, sy){ var d = GZ - camZ; return {x: (sx - W/2)*d/F, y: camY - (sy - HY)*d/F}; }

  /* 관중 — 미리 정해 둔 점들 */
  var crowd = [], CC = ['#E03131','#1971C2','#F59F00','#FFFFFF','#2F9E44','#AE3EC9','#F76707','#FFD43B'];
  for(var i=0;i<230;i++) crowd.push({x:Math.random(), y:Math.random(), c:CC[i%CC.length], p:Math.random()*6.28});

  var st, raf = 0, alive = true, t0 = 0, last = 0, aimPts = null, hintT = 0;
  function reset(n){
    st = {phase:'aim', ball:{x:0,y:BR,z:0}, spin:0, kx:0, ky:0, ka:0, kArm:0,
          shot:null, res:null, tShot:0, net:null, shake:0, cheer:0, trail:[], n:n||0};
    aimPts = null;
  }
  reset(0);

  /* ── 입력: 스와이프(방향·세기) 또는 골대 톡 ── */
  var down = null;
  function pt(e){ var r = cv.getBoundingClientRect(), t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e; return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height), t:Date.now()}; }
  function onDown(e){ if(st.phase!=='aim') return; e.preventDefault(); down = pt(e); aimPts = [down]; curlOf = 0; }
  function onMove(e){ if(!down) return; e.preventDefault(); aimPts.push(pt(e)); if(aimPts.length > 40) aimPts.splice(1,1); trackCurl(); }
  function onUp(e){
    if(!down) return; e.preventDefault();
    var u = aimPts[aimPts.length-1] || down, dx = u.x-down.x, dy = u.y-down.y, len = Math.sqrt(dx*dx+dy*dy);
    var d0 = down; down = null; aimPts = null;
    if(len < 14){   /* 톡 — 골대 근처를 누르면 그쪽으로 */
      var g = unP(d0.x, d0.y);
      if(g.y > -0.6 && g.y < GH + 1.2 && Math.abs(g.x) < GW + 1.6) kick(g.x, Math.max(0.15, g.y), 0.62, 0, true);
      return;
    }
    if(dy > -18) return;   /* 위로 밀어야 슛 */
    var pw = Math.max(0.15, Math.min(1.25, len / (W*0.52)));
    var tx = (dx / -dy) * 7.2;
    var ty = 0.12 + pw * 2.05;
    var v = len / Math.max(60, (u.t - d0.t)) * (360 / W);   /* px/ms — 휙 튕길수록 빠른 공 */
    var flick = Math.max(0, Math.min(1, (v - 0.6) / 1.2));
    kick(tx, ty, pw, curlOf, false, flick);
  }
  /* 휘어짐 계산용으로 마지막 길을 따로 보관 */
  var curlOf = 0;
  function trackCurl(){
    if(!aimPts || aimPts.length < 4) return;
    var a = aimPts[0], b = aimPts[aimPts.length-1], m = aimPts[aimPts.length>>1];
    var vx = b.x-a.x, vy = b.y-a.y, L = Math.sqrt(vx*vx+vy*vy) || 1;
    curlOf = ((m.x-a.x)*vy - (m.y-a.y)*vx) / L / L * 3.2;   /* 왼쪽으로 휘면 + */
    curlOf = Math.max(-1.2, Math.min(1.2, curlOf));
  }
  cv.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', onDown, {passive:false}); cv.addEventListener('touchmove', onMove, {passive:false}); cv.addEventListener('touchend', onUp, {passive:false});

  function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)/1.5; }
  function kick(tx, ty, pw, curl, tap, flick){
    var noise = 0.16 + Math.max(0, pw-0.8)*0.6;
    tx += gauss()*noise; ty += gauss()*noise*0.7;
    var T = 0.98 - 0.48*Math.min(1.1, pw) - 0.18*(flick || 0);   /* 셀수록·휙 찰수록 빨리 도착 → 골키퍼가 늦는다 */
    /* 골키퍼: 공 쪽을 맞힐지 (PK_KEEPER_SKILL), 아니면 다른 쪽 */
    var side = tx > 0.9 ? 1 : (tx < -0.9 ? -1 : 0), dir;
    var guess = Math.random() < PK_KEEPER_SKILL;
    if(guess) dir = side;
    else { var o = [-1,0,1].filter(function(v){ return v !== side; }); dir = o[Math.floor(Math.random()*o.length)]; }
    /* 다이빙 계획: 몸 가운데(가슴·팔)가 노린 곳으로 가게. 발은 한 걸음(±1.3m), 점프는 0.6m까지만 */
    var KX = 0, KY = 0, KA = 0;
    if(dir !== 0){
      var gx = guess ? tx : dir*2.2, gy = guess ? ty : 0.9;
      KA = dir * (1.35 - 0.35*Math.min(1, gy/2.2));
      KX = Math.max(-1.3, Math.min(1.3, gx - Math.sin(KA)*1.55));
      KY = Math.max(0, Math.min(0.6, gy - Math.cos(KA)*1.55));
    }
    st.shot = {tx:tx, ty:ty, T:T, curl:curl||0, dir:dir, KX:KX, KY:KY, KA:KA, guess:guess};
    st.phase = 'fly'; st.tShot = now(); st.trail = [];
    beep([180,120], .05); setTimeout(function(){ beep([520,740], .05); }, 30);
  }

  function now(){ return performance.now()/1000; }
  function ease(u){ return 1 - Math.pow(1-u, 3); }

  /* 골키퍼 몸통 선분(발→손끝)과 공 사이 거리로 막았는지 본다 */
  function keeperSeg(){
    var a = st.ka, base = {x: st.kx, y: st.ky + 0.05}, L = 2.25;
    return {ax: base.x, ay: base.y, bx: base.x + Math.sin(a)*L, by: base.y + Math.cos(a)*L};
  }
  function segDist(px, py, s){
    var vx = s.bx-s.ax, vy = s.by-s.ay, u = ((px-s.ax)*vx + (py-s.ay)*vy) / (vx*vx+vy*vy);
    u = Math.max(0, Math.min(1, u)); var qx = s.ax+vx*u-px, qy = s.ay+vy*u-py; return {d: Math.sqrt(qx*qx+qy*qy), u:u};
  }

  function step(){
    if(!alive) return;
    var t = now(), dt = Math.min(0.05, t - (last || t)); last = t;
    var S = st, sh = S.shot;
    /* 골키퍼 기본 동작: 좌우로 살짝 흔들기 */
    if(S.phase === 'aim'){
      S.kx = Math.sin(t*2.1)*0.35; S.ky = 0; S.ka = Math.sin(t*2.1)*0.06; S.kArm = 0.5 + Math.sin(t*4)*0.1;
    }
    if(S.phase === 'fly' || S.phase === 'after'){
      var e = t - S.tShot;
      /* 골키퍼 다이빙 (0.1초 반응 뒤 0.5초 동안) */
      var ku = Math.max(0, Math.min(1, (e - 0.12)/0.55)), k = ease(ku);
      if(sh.dir === 0){ S.kx = 0; S.ky = Math.sin(ku*Math.PI)*0.45; S.ka = 0; S.kArm = 1; }
      else {
        S.kx = sh.KX*k; S.ka = sh.KA*k; S.kArm = 1;
        S.ky = ku < 1 ? sh.KY*Math.sin(ku*Math.PI*0.85)/Math.sin(Math.PI*0.85) : Math.max(0, S.ky - dt*2.5);
      }
      if(S.phase === 'fly'){
        var u = Math.min(1, e / sh.T);
        var bow = Math.sin(u*Math.PI) * sh.curl;
        S.ball = {x: sh.tx*u + bow, y: BR + (sh.ty-BR)*u + Math.sin(u*Math.PI)*(sh.T > 0.75 ? 0.35 : 0.1), z: GZ*u};
        S.spin += dt*18; S.trail.push({x:S.ball.x,y:S.ball.y,z:S.ball.z}); if(S.trail.length>9) S.trail.shift();
        /* 골라인 전에 키퍼에 닿았나 (공이 9.6m 넘으면 확인) */
        if(S.ball.z > GZ - 1.2 && !S.res && Math.abs(sh.tx) < GW + 0.13 && sh.ty < GH + 0.13){   /* 어차피 밖으로 나갈 공은 키퍼가 손대지 않는다 */
          var sg = keeperSeg(), sd = segDist(S.ball.x, S.ball.y, sg);
          var rad = (sd.u > 0.75 ? 0.3 : (sh.dir === 0 ? 0.4 : 0.3)) + BR;
          if(sh.dir === 0 && sd.u > 0.45 && sd.u < 0.85) rad = 0.75 + BR;   /* 가운데 서 있을 땐 팔을 벌려 넓게 막는다 */
          if(sd.d < rad && S.ball.z > GZ - 0.5) { end('save'); }
        }
        if(u >= 1 && !S.res){
          var ax = Math.abs(sh.tx), y = sh.ty;
          if(y > GH + 0.13) end('over');
          else if(ax > GW + 0.13) end('wide');
          else if(ax > GW - 0.12) end('post');
          else if(y > GH - 0.12) end('bar');
          else end((ax > GW - 0.9 && y > GH - 0.8) ? 'top' : 'goal');
        }
      } else afterFly(dt, e);
    }
    if(S.shake > 0) S.shake = Math.max(0, S.shake - dt*2.2);
    if(S.cheer > 0) S.cheer = Math.max(0, S.cheer - dt*0.45);
    draw(t);
    raf = requestAnimationFrame(step);
  }

  /* 결과 뒤 공 움직임: 골 → 그물 안으로 / 막힘·골대 → 튕겨 나옴 / 위·옆 → 날아감 */
  function end(kind){
    var S = st; S.res = kind; S.phase = 'after'; S.t2 = now();
    var b = S.ball, goal = (kind === 'goal' || kind === 'top');

/* 관중 함성 — 잡음(노이즈)을 걸러 '와아~' 소리 */
function pkCrowd(sec){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var n = Math.floor(actx.sampleRate*sec), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2-1);
    var src = actx.createBufferSource(); src.buffer = buf;
    var bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
    var g = actx.createGain(), t = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t+0.15); g.gain.exponentialRampToValueAtTime(0.0001, t+sec);
    src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(t); src.stop(t+sec);
  }catch(e){}
}

var DAD_OK = false;   /* 이번 세션에 아빠 확인을 통과했는지 (홈에서 리셋) */
/* 아빠 확인이 필요한 동작을 감싼다. 이미 통과했으면 바로 실행. */
function needDad(cb, back, msg){
  if(DAD_OK){ cb(); return; }
  dadGate(function(){ DAD_OK = true; cb(); }, back, msg);
}
/* 아빠 PIN 게이트 — 통과하면 cb() 실행, 취소하면 back() (재사용) */
function dadGate(cb, back, msg){
  var pin='', bad=false;
  function draw(){
    app.innerHTML =
      '<div class="topbar"><button class="iconbtn" id="gback">←</button><h2>🔒 아빠 확인</h2><div style="width:44px"></div></div>'+
      '<div class="card" style="text-align:center">'+
        '<div style="font-size:44px">🔒</div>'+
        '<div style="font-size:17px;margin-top:6px">아빠 비밀번호를 넣어주세요</div>'+
        '<div class="muted">'+(msg || '콘텐츠를 고치거나 지우려면 필요해요 🙂')+'</div>'+
        '<div class="dots4">'+ [0,1,2,3].map(function(k){
          return '<div class="d4 '+(bad?'bad':(k<pin.length?'on':''))+'"></div>';
        }).join('') +'</div>'+
        '<div class="pin">'+
          [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-n="'+n+'">'+n+'</button>'; }).join('')+
          '<button data-n="del">←</button><button data-n="0">0</button><button data-n="ok">✓</button>'+
        '</div>'+
      '</div>';
    document.getElementById('gback').onclick = function(){ if(back) back(); else screenHome(); };
    on('.pin button', function(){
      var v=this.dataset.n; bad=false;
      if(v==='del') pin=pin.slice(0,-1);
      else if(v==='ok'){ if(pin===DAD_PIN){ okSound(); cb(); return; } noSound(); bad=true; pin=''; draw(); return; }
      else if(pin.length<4){ pin+=v; beep([600+(+v)*20],.04); }
      if(pin.length===4 && v!=='del'){ if(pin===DAD_PIN){ okSound(); cb(); return; } noSound(); bad=true; pin=''; draw(); return; }
      draw();
    });
  }
  draw();
}

  function draw(){

        '<div class="starpick" id="sp"></div>'+

      '</div>'+

        '<div class="chunks" style="margin:8px 0">'+ picks.map(function(t,i){
          return '<button class="chunk rime" style="font-family:inherit;font-size:14px;padding:8px 12px" data-t="'+esc(t)+'">'+esc(t)+'</button>';
        }).join('') +'</div>'+

        '<button class="btn go wide" id="go" style="font-size:20px;padding:17px"></button>'+
      '</div>'+
      (PROG.bonus.length

    /* 별 고르기 — 세 번째 별을 누르면 3개 */

    checkFinal();

}

               : [ {def:'',w:'',k:''}, {def:'',w:'',k:''}, {def:'',w:'',k:''} ];
  function draw(){
    app.innerHTML =
      '<div class="topbar"><button class="iconbtn" id="back">\u2190</button>'+

        '<div class="qlab">\ub2e8\uc5b4\uc7a5 \uc774\ub984</div>'+

      '<div class="sechd">\ubb38\uc81c \ubaa9\ub85d <span style="font-size:12px">\u00b7 \ub73b\ud480\uc774(\uc601\uc5b4 \ubb38\uc7a5) + \uc815\ub2f5 \ub2e8\uc5b4 + \ud55c\uae00 \ub73b</span></div>'+
      '<div id="rows"></div>'+
      '<button class="btn wide" id="addrow" style="margin-bottom:14px">\u2795 \ubb38\uc81c \ud55c \uc904 \ucd94\uac00</button>'+
      '<button class="btn primary wide" id="save" style="font-size:18px">\ud83d\udcbe \uc800\uc7a5\ud558\uae30</button>'+
      (editing ? '<button class="btn wide no" id="del" style="margin-top:9px;background:#FFE4E6;color:#9F1239;box-shadow:0 6px 0 #FDA4AF">\ud83d\uddd1 \uc774 \ub2e8\uc5b4\uc7a5 \uc9c0\uc6b0\uae30</button>' : '')+
      '<div class="muted" style="text-align:center;margin-top:10px;line-height:1.6">'+
        '\ub73b\ud480\uc774\ub294 \ud558\uc900\uc774\uac00 \uc544\ub294 \uc26c\uc6b4 \uc601\uc5b4 \ubb38\uc7a5\uc73c\ub85c.<br>\uc608: <b>a small animal that says meow</b> \u2192 cat \u2192 \uace0\uc591\uc774</div>';
    document.getElementById('back').onclick = function(){ if(editing) screenQuizList(); else screenQuizList(); };
    var box = document.getElementById('rows');
